:root{
  --bg:#f5f8f8;--surface:#fff;--ink:#0f2a2a;--body:#47534f;--muted:#66726f;--line:#e5eae9;
  --teal:#007878;--t6:#0c6c6c;--gold:#c09048;--gl:rgba(192,144,72,.42);--tt:#eef4f3;--tb:#d6e5e3;
  --ease:cubic-bezier(.22,.61,.36,1);
  --fd:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--fb:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--fb);background:var(--bg);color:var(--body);min-height:100vh;
  display:grid;place-items:center;padding:24px;position:relative;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(45deg,transparent 0 46px,rgba(0,120,120,.05) 46px 47px),
    repeating-linear-gradient(-45deg,transparent 0 46px,rgba(0,120,120,.05) 46px 47px);
  -webkit-mask-image:radial-gradient(120% 80% at 100% 0%,#000 0%,transparent 72%);
  mask-image:radial-gradient(120% 80% at 100% 0%,#000 0%,transparent 72%);
}
.wrap{position:relative;z-index:1;width:100%;max-width:430px}
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:34px 32px;box-shadow:0 24px 60px -30px rgba(6,63,54,.4);
}
.card::after{content:"";position:absolute;inset:6px;border:1px solid var(--gl);border-radius:9px;pointer-events:none;opacity:.5}
.card::before{content:"";position:absolute;inset-block-start:-4px;inset-inline-start:-4px;width:14px;height:14px;background:var(--gold);opacity:.5;transform:rotate(45deg);border-radius:2px}
.brand{text-align:center;margin-block-end:26px}
.brand .mark{
  width:64px;height:64px;margin:0 auto 14px;display:grid;place-items:center;
  color:var(--teal);background:var(--tt);border:1px solid var(--tb);
  clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
}
.brand .mark svg{width:30px;height:30px}
.brand h1{font-family:var(--fd);font-size:1.42rem;font-weight:600;color:var(--ink)}
.brand p{color:var(--muted);font-size:.93rem;margin-block-start:5px}
.field{margin-block-end:16px}
.field label{display:block;font-size:.92rem;font-weight:700;color:var(--ink);margin-block-end:7px}
.field input{
  width:100%;font-family:var(--fb);font-size:1rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,120,120,.13)}
.field input[dir=ltr]{text-align:left}
.btn{
  width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--fb);font-size:1rem;font-weight:700;padding:13px 20px;border:1px solid var(--teal);
  border-radius:10px;background:var(--teal);color:#fff;cursor:pointer;
  transition:background .25s,transform .25s var(--ease),opacity .2s;
}
.btn:hover:not(:disabled){background:#00615f;transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:progress;transform:none}
.btn svg{width:17px;height:17px}
.msg{
  display:none;align-items:flex-start;gap:9px;margin-block-end:16px;padding:12px 14px;
  border-radius:10px;font-size:.92rem;line-height:1.7;
}
.msg.show{display:flex}
.msg.err{background:#fdf1ec;border:1px solid #f0cdbc;color:#8c3d1c}
.msg.ok{background:var(--tt);border:1px solid var(--tb);color:var(--t6)}
.msg svg{width:16px;height:16px;flex:none;margin-block-start:3px}
.foot{margin-block-start:22px;padding-block-start:18px;border-block-start:1px solid var(--line);text-align:center}
.foot a{color:var(--teal);font-size:.9rem;font-weight:700;text-decoration:none}
.foot a:hover{text-decoration:underline}
.note{margin-block-start:14px;color:var(--muted);font-size:.82rem;line-height:1.7;text-align:center}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-block-start-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn,.field input{transition:none}.btn:hover{transform:none}.spin{animation:none}}
</style>
<style>
/* زرّ استعراض كلمة المرور داخل الحقل — لا فوقه، فلا يُغطّي النصّ */
.pwrap{position:relative}
.pwrap input{padding-inline-start:44px}
.peye{position:absolute;inset-inline-start:6px;inset-block-start:50%;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;padding:0;cursor:pointer;color:#6b7f7c;border-radius:8px}
.peye:hover{color:#0d5c52;background:rgba(13,92,82,.07)}
.peye:focus-visible{outline:2px solid #c09048;outline-offset:2px}
.peye svg{width:19px;height:19px}
/* سطرٌ واحد: «ابقني داخلًا» يمينًا و«نسيت كلمة المرور» يسارًا */
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-block:-4px 18px;flex-wrap:wrap}
.rem{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:#3f5551;user-select:none}
.rem input{width:17px;height:17px;accent-color:#0d5c52;cursor:pointer;margin:0}
.flink{background:none;border:0;padding:0;font:inherit;font-size:14px;color:#0d5c52;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.flink:hover{color:#c09048}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/><path d="M12 14.6v2.4"/>
        </svg>
      </div>
      <h1>لوحة تحكّم الموقع</h1>
      <p>جمعية حاضنة الجمعيات</p>
    </div>

    <div class="msg" id="msg" role="alert" aria-live="assertive"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" dir="ltr" autocomplete="username"
               placeholder="name@iaq.org.sa" required />
      </div>
      <div class="field">
        <label for="pass">كلمة المرور</label>
        <div class="pwrap">
          <input type="password" id="pass" name="pass" autocomplete="current-password"
                 placeholder="••••••••" required />
          <button type="button" class="peye" id="peye" aria-label="استعراض كلمة المرور"
                  aria-pressed="false" title="استعراض كلمة المرور">
            <svg id="peyeOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="peyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M2.5 12S6 5.5 12 5.5c2 0 3.7.7 5.1 1.6M21.5 12s-1.4 2.6-4 4.4c-1.6 1.1-3.5 1.6-5.5 1.6-.9 0-1.7-.1-2.5-.3"/>
              <path d="M4 20 20 4"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="lrow">
        <label class="rem" for="remember">
          <input type="checkbox" id="remember" checked />
          <span>ابقني داخلًا على هذا الجهاز</span>
        </label>
        <button type="button" class="flink" id="forgot">نسيت كلمة المرور؟</button>
      </div>
      <button type="submit" class="btn" id="btn">
        <span id="btnTxt">تسجيل الدخول</span>
        <svg id="btnIc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
    </form>

    <div class="foot"><a href="index.html">&#8592; العودة إلى الموقع</a></div>
    <form id="setForm" hidden>
      <div class="field">
        <label for="np">كلمة المرور الجديدة</label>
        <div class="pwrap">
          <input type="password" id="np" autocomplete="new-password" placeholder="ثمانية محارف على الأقل" />
          <button type="button" class="peye" id="npeye" aria-label="استعراض كلمة المرور" aria-pressed="false">

   العطب الذي تُصلحه هذه الوحدة: الجلسة كانت في sessionStorage — يُمحى بإغلاق
   التبويب — و refresh_token كان يُحفظ **ولا يُستعمل أبدًا**. فبعد ساعةٍ من
   الدخول تنتهي صلاحية الرمز، فتُخرج البوّابةُ المديرَ وتُظهر الشاشاتُ
   «JWT expired (401)» وأرقامًا فارغة.

     • تجديدٌ استباقيّ: مؤقّتٌ يُجدّد قبل النهاية بخمس دقائق.
     • تجديدٌ عند اليقظة: العودة إلى التبويب بعد نومٍ طويل تُجدّد فورًا.
     • تجديدٌ عند الرفض: أي طلبٍ يُرَدُّ بـ401 يُجدّد ويُعاد مرّةً واحدة.

   وإلّا sessionStorage فتنتهي الجلسة بإغلاق التبويب. الرمز في التخزين المحليّ
   مقايضةٌ معروفة: راحةُ البقاء مقابل بقائه على الجهاز — ولذلك يبقى الخيار
   بيد المدير، ويمحوه «خروج» من الموضعين.
   ============================================================================ */

  'use strict';
  var KEY = 'iaq_session';
  var CFG = window.IAQ_SUPABASE || window.IAQ_SUPA || null;

  function stores() {
    var out = [];
    try { if (window.localStorage) out.push(window.localStorage); } catch (e) { }
    try { if (window.sessionStorage) out.push(window.sessionStorage); } catch (e) { }

  var timer = null;

  document.addEventListener('visibilitychange', function () {

      }
      var d=res.data;
      var rememberEl=document.getElementById('remember');
      var keep = !rememberEl || rememberEl.checked;
      var sess = {
        access_token:d.access_token, refresh_token:d.refresh_token,
        expires_at:d.expires_at || (Math.floor(Date.now()/1000)+(d.expires_in||3600)),
        email:(d.user&&d.user.email)||email
      };
      /* keep=true يكتب في localStorage فتبقى الجلسة بعد إغلاق التبويب،
         وإلّا في sessionStorage فتنتهي بإغلاقه. الاختيار للمدير. */
      if (A) A.write(sess, keep);
      else sessionStorage.setItem('iaq_session', JSON.stringify(sess));
      try{ sessionStorage.removeItem('iaq_refresh_try'); }catch(e){}
      show('ok','تم التحقّق بنجاح، جارٍ فتح اللوحة...');
      setTimeout(function(){ location.replace(PANEL); }, 600);
    })
    .catch(function(){
      show('err','تعذّر الاتصال بالخدمة. تحقّق من الإنترنت وأعد المحاولة.');
      busy(false);
    });
  });
})();
</script>
</body>
</html>
