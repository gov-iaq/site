<script>/* ============================================================================
   خوارزمية العنونة المشتركة — تُحقن حرفيًّا في كل صفحة وفي لوحة التحكّم معًا،
   فلا يمكن أن تتباعد النسختان. أي تغيير هنا يسري على الطرفين عند إعادة البناء.

   المسار = سلسلة وسوم من مرساة معلومة إلى العنصر، ومع كل وسم ترتيبه بين
   أشقّائه من النوع نفسه:   #main/SECTION[3]/DIV[1]/H2[1]

   قرارات مقصودة (كل واحد منها أُثبت على الصفحات الـ18 الفعلية):
   • الترتيب بالنوع (nth-of-type) لا بالموضع: إدراج عنصر من نوع جديد لا يُزحزح
     أي مسار قائم، بخلاف nth-child الذي يُبطل كل مسارات الشقيق الواحد.
   • localName لا tagName: وسوم SVG صغيرة الحروف في DOM بخلاف وسوم HTML.
   • مقارنة namespaceURI أيضًا: <a> في HTML و<a> في SVG نوعان مختلفان.
   • [i] تُكتب دائمًا ولو كانت 1، فلا يعتمد التحليل على قاعدة اختصار.
   • المرساة: أقرب سلف له id فريد. هذا يقصّ عمق المسار (المتوسط 7.3 خطوة)
     فلا يُبطل تغييرٌ في أعلى الصفحة مساراتِ ما تحتها.
   ============================================================================ */
var IAQ_PATH = (function () {
  'use strict';

  function tagOf(el) { return (el.localName || (el.nodeName || '').toLowerCase()); }

  function step(el) {
    var ln = el.localName, ns = el.namespaceURI, i = 1, s = el;
    while ((s = s.previousElementSibling)) {
      if (s.localName === ln && s.namespaceURI === ns) i++;
    }
    return tagOf(el) + '[' + i + ']';
  }

  /* id صالح كمرساة؟ يجب أن يكون فريدًا فعلًا في المستند */
  function anchorId(el) {
    var id = el.id;
    if (!id) return null;
    var doc = el.ownerDocument;
    if (!doc.getElementById) return null;
    if (doc.getElementById(id) !== el) return null;          // مكرّر أو ملتبس
    if (/[\s"'\\]/.test(id)) return null;                     // id غريب — لا نعتمد عليه
    return id;
  }

  /* مسار عنصر — يرجع null لما هو خارج <body> أو غير عنصر */
  function pathOf(el) {
    if (!el || el.nodeType !== 1) return null;
    var doc = el.ownerDocument, body = doc && doc.body;
    if (!body || !body.contains(el)) return null;
    if (el === body) return 'BODY';
    var self = anchorId(el);
    if (self) return '#' + self;
    var parts = [], n = el;
    while (n && n !== body) {
      if (n !== el) {
        var a = anchorId(n);
        if (a) return '#' + a + '/' + parts.reverse().join('/');
      }
      parts.push(step(n));
      n = n.parentElement;
      if (!n) return null;
    }
    return 'BODY/' + parts.reverse().join('/');
  }

  /* العنصر من مساره — null إن لم يوجد (بنية تغيّرت) */
  function nodeAt(doc, path) {
    if (!doc || !path) return null;
    var body = doc.body; if (!body) return null;
    var parts = path.split('/'), cur, i = 0;
    if (parts[0] === 'BODY') { cur = body; i = 1; }
    else if (parts[0].charAt(0) === '#') {
      cur = doc.getElementById(parts[0].slice(1));
      if (!cur) return null;
      i = 1;
    } else return null;
    for (; i < parts.length; i++) {
      var m = /^([A-Za-z0-9_:-]+)\[(\d+)\]$/.exec(parts[i]);
      if (!m) return null;
      var tag = m[1], want = +m[2], seen = 0, found = null;
      for (var c = cur.firstElementChild; c; c = c.nextElementSibling) {
        if (tagOf(c) === tag && ++seen === want) { found = c; break; }
      }
      if (!found) return null;
      cur = found;
    }
    return cur;
  }

  /* هل العنصر في الترويسة/التذييل المشتركين؟ تعديله يجب أن يسري على كل الصفحات. */
  function scopeOf(el) {
    if (!el || el.nodeType !== 1) return 'page';
    var n = el;
    while (n && n.nodeType === 1) {
      var t = tagOf(n);
      if (t === 'header' && n.id === 'siteHeader') return 'global';
      if (t === 'footer') return 'global';
      if (n.classList && (n.classList.contains('site-header') || n.classList.contains('site-footer'))) return 'global';
      if (n.classList && n.classList.contains('skip-link')) return 'global';
      n = n.parentElement;
    }
    return 'page';
  }

  /* تطبيع النص قبل البصمة: توحيد يونيكود (NFC) + المسافات، وحذف المحارف الصفرية.
     يمنع إبطال البصمات عند اختلاف صور الحروف العربية أو المسافات فقط. */
  function norm(str) {
    var s = String(str == null ? '' : str);
    if (s.normalize) { try { s = s.normalize('NFC'); } catch (e) { } }
    return s.replace(/[\u200b-\u200f\u202a-\u202e\ufeff]/g, '').replace(/\s+/g, ' ').trim();
  }

  /* بصمة FNV-1a (32-bit) بالسادس عشري */
  function hash(str) {
    var s = String(str == null ? '' : str), h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ('0000000' + h.toString(16)).slice(-8);
  }

  /* بصمة المحتوى مع سياقه: الوسم + النص + وسم الأب.
     687 عقدة نصّية في الموقع تتشابه نصوصها، فالسياق يقلّل احتمال التطابق الكاذب
     الذي قد يضع نصًّا في موضع خاطئ بعد تغيّر بنيويّ. */
  function fpOf(el, raw) {
    var text = norm(raw == null ? (el ? el.textContent : '') : raw);
    var tag = el ? tagOf(el) : '';
    var par = (el && el.parentElement) ? tagOf(el.parentElement) : '';
    return hash(tag + '\u0001' + text + '\u0001' + par);
  }

  /* بصمة نصّ مجرّد (للمقارنة السريعة) */
  function fp(str) { return hash(norm(str)); }

  function isLeafText(el) {
    if (!el || el.nodeType !== 1) return false;
    if (el.firstElementChild) return false;
    return norm(el.textContent).length > 0;
  }

  /* فهارس عُقد النص المباشرة غير الفارغة — لتحرير نصّ مجاور لعناصر سطرية */
  function textParts(el) {
    var out = [];
    if (!el) return out;
    for (var i = 0; i < el.childNodes.length; i++) {
      var n = el.childNodes[i];
      if (n.nodeType === 3 && norm(n.nodeValue).length) out.push({ i: i, text: n.nodeValue });
    }
    return out;
  }

  return {
    pathOf: pathOf, nodeAt: nodeAt, scopeOf: scopeOf,
    fp: fp, fpOf: fpOf, norm: norm, hash: hash,
    isLeafText: isLeafText, textParts: textParts, tagOf: tagOf
  };
})();
</script>
<script>/* ============================================================================
   نواة لوحة التحكّم — الجلسة، طلبات Supabase، مستودع الملفات، واجهة العرض،
   والمُوجّه (router). كل وحدة (module) تسجّل شاشتها عبر IAQ.views.register.

   قواعد مثبَّتة من وثائق Supabase/PostgREST (كل واحدة أُدرجت لأنها تكسر بصمت):
   • كل طلب يحمل الترويستين معًا: apikey (بوابة المشروع) + Authorization (هوية المدير).
     المفتاح وحده = دور anon (المنشور فقط)، والـBearer وحده يُرفض من البوابة.
   • القراءة الممنوعة بـRLS ترجع 200 ومصفوفة فارغة لا 403 — لذلك نتحقّق من
     صلاحية المدير بطلب مستقلّ على جدول admins قبل إظهار الواجهة.
   • الكتابة الممنوعة ترجع 403 (موثَّق) أو 401 إن كان الرمز منتهيًا.
   • PATCH أو DELETE بلا مُرشِّح يُعيد كتابة الجدول كلّه! نتحقّق أن المعرّف عدد
     صحيح موجب قبل بناء الرابط، ونرفض غير ذلك قبل مغادرة المتصفّح.
   • Prefer: return=representation إلزاميّ وإلا فلا نعرف ما حدث (الافتراضي minimal).
   • الترقيم يرجع 206 Partial Content وهو نجاح — نتحقّق من res.ok لا من status===200.
   • رمز التحديث يُستخدم مرّة واحدة، ومهلة إعادة الاستخدام 10 ثوانٍ؛ تحديثان
     متوازيان يُلغيان الجلسة كلّها — لذلك التحديث مُتسلسل بوعد واحد مشترك.
   • رابط Storage الموقَّع نسبيّ، ويجب أن يُسبق بـ ${url}/storage/v1 لا بـ${url}.
   ============================================================================ */

  function esc(s) {

  var refreshing = null;               // وعد واحد مشترك — لا تحديثين متوازيين أبدًا

  function saveSession(d) {
    S = {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: d.expires_at || (Math.floor(Date.now() / 1000) + (d.expires_in || 3600)),
      email: (d.user && d.user.email) || (S && S.email) || ''
    };
    // كتابة واحدة تحمل الرمزين والمهلة معًا — كتابة جزئية تُخرج المدير عند التحديث التالي
    try { sessionStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) { }
    window.IAQ_SESSION = S;
    return S;
  }

  function logout(msg) {
    try { sessionStorage.removeItem(SKEY); } catch (e) { }
    if (msg) { try { sessionStorage.setItem('iaq_login_msg', msg); } catch (e) { } }
    location.replace(window.IAQ_LOGIN || 'index.html');
  }

  function refreshToken() {
    if (refreshing) return refreshing;
    if (!S || !S.refresh_token) { logout('انتهت الجلسة، يرجى الدخول من جديد.'); return Promise.reject(new Error('no refresh token')); }
    refreshing = fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: CFG.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: S.refresh_token })
    }).then(function (r) {
      if (!r.ok) throw new Error('refresh failed ' + r.status);
      return r.json();
    }).then(function (d) {
      if (!d.access_token) throw new Error('refresh returned no token');
      saveSession(d);
      refreshing = null;
      return S;
    }).catch(function (e) {
      refreshing = null;
      logout('انتهت صلاحية الجلسة، يرجى الدخول من جديد.');
      throw e;
    });
    return refreshing;
  }

  function nearExpiry() { return !S || !S.expires_at || (S.expires_at * 1000 - Date.now() < 60000); }

  /* ------------------------------ طلب أساسي ------------------------------ */
  function headers(extra, json) {
    var h = { apikey: CFG.key, Authorization: 'Bearer ' + (S ? S.access_token : '') };
    if (json) h['Content-Type'] = 'application/json';
    if (extra) for (var k in extra) if (extra.hasOwnProperty(k)) h[k] = extra[k];
    return h;
  }

  var ERR = {
    401: 'انتهت صلاحية الجلسة.',
    403: 'لا تملك صلاحية هذا الإجراء. تأكّد أن بريدك مُسجَّل في جدول المدراء.',
    404: 'الجدول أو المسار غير موجود. تأكّد من تشغيل مخطّط قاعدة البيانات.',
    409: 'تعارض: هذا السجلّ موجود مسبقًا.',
    413: 'الملف أكبر من الحدّ المسموح.',
    422: 'بيانات غير مقبولة.'
  };

  function fail(r, body) {
    var m = ERR[r.status];
    var detail = '';
    try {
      var j = typeof body === 'string' ? JSON.parse(body) : body;
      detail = (j && (j.message || j.msg || j.error_description || j.error || j.hint)) || '';
    } catch (e) { detail = typeof body === 'string' ? body.slice(0, 160) : ''; }
    var err = new Error((m || ('فشل الطلب (' + r.status + ')')) + (detail ? ' — ' + detail : ''));
    err.status = r.status;
    return err;
  }

  /* يُعيد المحاولة مرّة واحدة بعد تحديث الرمز عند 401 */
  function req(url, opt, retried) {
    opt = opt || {};
    var go = function () {
      return fetch(url, opt).then(function (r) {
        if (r.status === 401 && !retried) {
          return refreshToken().then(function () {
            opt.headers = headers(opt.__extra, opt.__json);
            return req(url, opt, true);
          });
        }
        if (!r.ok) return r.text().then(function (b) { throw fail(r, b); });
        return r;
      });
    };
    if (!retried && nearExpiry() && S && S.refresh_token) return refreshToken().then(function () {
      opt.headers = headers(opt.__extra, opt.__json);
      return go();
    });
    return go();
  }

  function jsonOf(r) {
    var ct = r.headers.get('content-type') || '';
    if (r.status === 204 || !ct) return null;
    return r.json();
  }

  /* --------------------------- واجهة قاعدة البيانات --------------------------- */
  function intId(id) {
    var n = Number(id);
    if (!isFinite(n) || n <= 0 || Math.floor(n) !== n) {
      throw new Error('معرّف غير صالح — أُلغي الإجراء حمايةً للبيانات.');
    }
    return n;
  }

  var api = {
    /* q: سلسلة استعلام PostgREST جاهزة، مثال: 'select=*&order=id.desc&limit=50' */
    select: function (table, q, extraHeaders) {
      var o = { method: 'GET', __extra: extraHeaders };
      o.headers = headers(extraHeaders, false);
      return req(CFG.url + '/rest/v1/' + table + '?' + (q || 'select=*'), o).then(jsonOf);
    },
    /* العدد الكلّي من ترويسة Content-Range — بلا جسم استجابة */
    count: function (table, q) {
      var o = { method: 'HEAD', __extra: { Prefer: 'count=exact' } };
      o.headers = headers(o.__extra, false);
      return req(CFG.url + '/rest/v1/' + table + '?' + (q || 'select=id'), o).then(function (r) {
        var cr = r.headers.get('content-range') || '';
        var n = parseInt(cr.split('/')[1], 10);
        return isFinite(n) ? n : 0;
      });
    },
    insert: function (table, rows, sel) {
      var o = { method: 'POST', body: JSON.stringify(rows), __json: true,
                __extra: { Prefer: 'return=representation' } };
      o.headers = headers(o.__extra, true);
      return req(CFG.url + '/rest/v1/' + table + (sel ? '?select=' + sel : ''), o).then(jsonOf);
    },
    update: function (table, id, patch) {
      var n;
      try { n = intId(id); } catch (e) { return Promise.reject(e); }
      var o = { method: 'PATCH', body: JSON.stringify(patch), __json: true,
                __extra: { Prefer: 'return=representation' } };
      o.headers = headers(o.__extra, true);
      return req(CFG.url + '/rest/v1/' + table + '?id=eq.' + n, o).then(jsonOf);
    },
    /* تحديث بمُرشِّح صريح — يجب أن يحتوي المُرشِّح على '=' وإلا رُفض */
    updateWhere: function (table, filter, patch) {
      if (!filter || filter.indexOf('=') < 0) return Promise.reject(new Error('مُرشِّح مفقود — أُلغي التحديث.'));
      var o = { method: 'PATCH', body: JSON.stringify(patch), __json: true,
                __extra: { Prefer: 'return=representation' } };
      o.headers = headers(o.__extra, true);
      return req(CFG.url + '/rest/v1/' + table + '?' + filter, o).then(jsonOf);
    },
    upsert: function (table, rows, onConflict) {
      var q = onConflict ? '?on_conflict=' + encodeURIComponent(onConflict) : '';
      var o = { method: 'POST', body: JSON.stringify(rows), __json: true,
                __extra: { Prefer: 'resolution=merge-duplicates,return=representation' } };
      o.headers = headers(o.__extra, true);
      return req(CFG.url + '/rest/v1/' + table + q, o).then(jsonOf);
    },
    remove: function (table, id) {
      var n;
      try { n = intId(id); } catch (e) { return Promise.reject(e); }
      var o = { method: 'DELETE', __extra: { Prefer: 'return=representation' } };
      o.headers = headers(o.__extra, false);
      return req(CFG.url + '/rest/v1/' + table + '?id=eq.' + n, o).then(jsonOf);
    },
    removeWhere: function (table, filter) {
      if (!filter || filter.indexOf('=') < 0) return Promise.reject(new Error('مُرشِّح مفقود — أُلغي الحذف.'));
      var o = { method: 'DELETE', __extra: { Prefer: 'return=representation' } };
      o.headers = headers(o.__extra, false);
      return req(CFG.url + '/rest/v1/' + table + '?' + filter, o).then(jsonOf);
    }
  };

  /* ----------------------------- مستودع الملفات ----------------------------- */
  var storage = {
    upload: function (bucket, path, file, overwrite) {
      var o = { method: overwrite ? 'PUT' : 'POST', body: file };
      o.__extra = overwrite ? { 'x-upsert': 'true' } : null;
      o.headers = headers(o.__extra, false);        // بلا Content-Type: يُشتقّ من الملف
      return req(CFG.url + '/storage/v1/object/' + bucket + '/' + path.split('/').map(encodeURIComponent).join('/'), o)
        .then(jsonOf);
    },
    list: function (bucket, prefix) {
      var o = { method: 'POST', __json: true,
                body: JSON.stringify({ prefix: prefix || '', limit: 200, offset: 0, sortBy: { column: 'name', order: 'asc' } }) };
      o.headers = headers(null, true);
      return req(CFG.url + '/storage/v1/object/list/' + bucket, o).then(jsonOf);
    },
    remove: function (bucket, paths) {
      var o = { method: 'DELETE', __json: true, body: JSON.stringify({ prefixes: paths }) };
      o.headers = headers(null, true);
      return req(CFG.url + '/storage/v1/object/' + bucket, o).then(jsonOf);
    },
    publicUrl: function (bucket, path, dlName) {
      var u = CFG.url + '/storage/v1/object/public/' + bucket + '/' +
              path.split('/').map(encodeURIComponent).join('/');
      return dlName ? u + '?download=' + encodeURIComponent(dlName) : u;
    }
  };

  /* -------------------------------- الواجهة -------------------------------- */
  var toastEl = null, toastT = null;
  function toast(msg, kind) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.style.background = kind === 'err' ? '#8c3d1c' : (kind === 'warn' ? '#7a5518' : '');
    toastEl.classList.add('show');
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('show'); }, kind === 'err' ? 5200 : 2400);
  }

  function card(title, body, foot) {
    return '<div class="ad-card">' + (title ? '<h3>' + esc(title) + '</h3>' : '') + body +
           (foot ? '<div class="btnbar">' + foot + '</div>' : '') + '</div>';
  }
  function notice(html, kind) {
    return '<div class="notice"' + (kind === 'ok' ? ' style="background:#eef4f3;border-color:#d6e5e3;color:#0c6c6c"' : '') + '>' + html + '</div>';
  }
  function head(title, sub) {
    return '<div class="view-head"><h1>' + esc(title) + '</h1>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
  }
  function iconBtn(act, path, o) {
    o = o || {};
    return '<button class="ib' + (o.danger ? ' danger' : '') + (o.sm ? ' sm' : '') + '" data-act="' + attr(act) + '"' +
      (o.id != null ? ' data-id="' + attr(o.id) + '"' : '') +
      (o.arg != null ? ' data-arg="' + attr(o.arg) + '"' : '') +
      ' title="' + attr(o.label || act) + '" aria-label="' + attr(o.label || act) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg></button>';
  }
  function spinner(msg) {
    return '<div class="ad-card" style="text-align:center;padding:44px"><div class="muted">' + esc(msg || 'جارٍ التحميل…') + '</div></div>';
  }
  function empty(msg) {
    return '<div style="text-align:center;padding:38px 16px" class="muted">' + esc(msg) + '</div>';
  }
  function table(cols, rows) {
    var h = '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
      cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
    h += rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('');
    return h + '</tbody></table></div>';
  }

  /* حوار تأكيد — لا نستخدم confirm() الأصلي كي يبقى المظهر موحّدًا */
  function ask(msg, okLabel) {
    return new Promise(function (res) {
      var ov = document.createElement('div');
      ov.className = 'sub-ov show';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(4,52,44,.42);z-index:200;display:grid;place-items:center;padding:20px';
      ov.innerHTML = '<div class="ad-card" style="max-width:440px;margin:0"><h3>تأكيد</h3><p style="margin-block-end:18px">' +
        esc(msg) + '</p><div class="btnbar"><button class="btn ghost" data-x="0">إلغاء</button>' +
        '<button class="btn danger" data-x="1">' + esc(okLabel || 'تأكيد') + '</button></div></div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) {
        var b = e.target.closest('[data-x]');
        if (b) { ov.remove(); res(b.getAttribute('data-x') === '1'); }
        else if (e.target === ov) { ov.remove(); res(false); }
      });
    });
  }

  /* لوح جانبي */
  function drawer(title, html) {
    var d = $('#iaqDrawer');
    if (!d) {
      d = document.createElement('div');
      d.id = 'iaqDrawer';
      d.className = 'side-drawer';
      document.body.appendChild(d);
      var ov = document.createElement('div');
      ov.className = 'sub-ov'; ov.id = 'iaqDrawerOv';
      ov.addEventListener('click', closeDrawer);
      document.body.appendChild(ov);
    }
    d.innerHTML = '<div class="drawer-head"><div class="dh-name">' + esc(title) + '</div>' +
      '<button class="ib sm" data-act="closeDrawer" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="drawer-body">' + html + '</div>';
    document.body.classList.add('subopen');
    $('#iaqDrawerOv').classList.add('show');
    return d;
  }
  function closeDrawer() {
    document.body.classList.remove('subopen');
    var ov = $('#iaqDrawerOv'); if (ov) ov.classList.remove('show');
  }

  var fmt = {
    date: function (iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      if (isNaN(d)) return String(iso);
      return d.toLocaleDateString('ar-SA-u-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' }) +
        ' ' + d.toLocaleTimeString('ar-SA-u-nu-latn', { hour: '2-digit', minute: '2-digit' });
    },
    day: function (iso) {
      if (!iso) return '—';
      var d = new Date(iso); if (isNaN(d)) return String(iso);
      return d.toISOString().slice(0, 10);
    },
    num: function (n) { return (Number(n) || 0).toLocaleString('en-US'); },
    bytes: function (n) {
      n = Number(n) || 0;
      if (n < 1024) return n + ' بايت';
      if (n < 1048576) return (n / 1024).toFixed(0) + ' ك.ب';
      return (n / 1048576).toFixed(1) + ' م.ب';
    },
    cut: function (s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n) + '…' : s; }
  };

  /* --------------------------- سجلّ التدقيق --------------------------- */
  function audit(action, entity, entityId) {
    return api.insert('audit_log', {
      actor_email: (S && S.email) || '', action: action,
      entity: entity || null, entity_id: entityId == null ? null : String(entityId)
    }).catch(function () { /* السجلّ لا يُفشل الإجراء */ });
  }

  /* ------------------------------ المُوجّه ------------------------------ */
  var views = {}, order = [], current = null;

  var registry = {
    register: function (key, def) {
      if (views[key]) return;
      views[key] = def; order.push(key);
    }
  };

  function renderSidebar() {
    var nav = $('#sidebarNav'); if (!nav) return;
    var groups = [], byGroup = {};
    order.forEach(function (k) {
      var g = views[k].group || 'عام';
      if (!byGroup[g]) { byGroup[g] = []; groups.push(g); }
      byGroup[g].push(k);
    });
    nav.innerHTML = groups.map(function (g) {
      return '<div class="nav-group">' + esc(g) + '</div>' + byGroup[g].map(function (k) {
        var v = views[k];
        return '<button class="nav-item' + (k === current ? ' active' : '') + '" data-view="' + attr(k) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          (v.icon || '<circle cx="12" cy="12" r="8"/>') + '</svg><span>' + esc(v.label || k) + '</span>' +
          (v.badge ? '<span class="right chip">' + esc(v.badge) + '</span>' : '') + '</button>';
      }).join('');
    }).join('');
  }

  function go(key) {
    if (!views[key]) key = order[0];
    current = key;
    try { location.hash = '#' + key; } catch (e) { }
    renderSidebar();
    document.body.classList.remove('drawer');
    closeDrawer();
    var mount = $('#viewArea');
    mount.innerHTML = spinner();
    var t0 = Date.now();
    Promise.resolve()
      .then(function () { return views[key].render(mount); })
      .catch(function (e) {
        mount.innerHTML = head(views[key].label || key) +
          notice('<b>تعذّر تحميل هذه الشاشة.</b><br>' + esc(e && e.message ? e.message : e));
        if (e && e.status === 403) toast(ERR[403], 'err');
      })
      .then(function () { if (Date.now() - t0 > 8000) toast('اكتمل التحميل', 'ok'); });
  }

  /* تفويض الأحداث: كل زرّ داخل الشاشة يُعالَج عبر data-act */
  var acts = {};
  function on(act, fn) { acts[act] = fn; }
  document.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-view]');
    if (nav) { go(nav.getAttribute('data-view')); return; }
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'closeDrawer') { closeDrawer(); return; }
    if (acts[a]) { e.preventDefault(); acts[a](b, e); }
  });

  /* ------------------------------- الإقلاع ------------------------------- */
  function boot() {
    var hamb = $('#hamb'), ov = $('#drawerOv');
    if (hamb) hamb.addEventListener('click', function () { document.body.classList.toggle('drawer'); });
    if (ov) ov.addEventListener('click', function () { document.body.classList.remove('drawer'); });
    window.addEventListener('hashchange', function () {
      var k = location.hash.replace('#', '');
      if (k && k !== current && views[k]) go(k);
    });

    var badge = $('#whoBadge');
    if (badge) badge.textContent = (S && S.email) || '';

    // التحقّق من الصلاحية: القراءة الممنوعة ترجع مصفوفة فارغة لا خطأ،
    // وسياسة «admins read self» ترجع صفّ المدير نفسه فقط.
    api.select('admins', 'select=email,name,role&limit=1').then(function (rows) {
      var mount = $('#viewArea');
      if (!rows || !rows.length) {
        if (badge) badge.textContent = 'غير مخوّل';
        mount.innerHTML = head('حساب غير مخوّل') + notice(
          '<b>بريدك ليس مُسجَّلًا في جدول المدراء.</b><br>' +
          'الدخول نجح، لكن قاعدة البيانات لا تعترف بهذا الحساب كمدير، فكل قراءة وكتابة ستُرفض.<br>' +
          'شغّل هذا في Supabase → SQL Editor ثم أعد الدخول:<br>' +
          '<code class="mono" style="display:block;margin-block-start:8px;white-space:pre-wrap">insert into public.admins (email, name, role)\nvalues (' + "'" + esc((S && S.email) || '') + "'" + ', \'مدير النظام\', \'admin\')\non conflict (email) do nothing;</code>');
        $('#sidebarNav').innerHTML = '';
        return;
      }
      IAQ.me = rows[0];
      if (badge) badge.textContent = (rows[0].name || rows[0].email) + ' · ' + (rows[0].role === 'admin' ? 'مدير' : rows[0].role);
      var k = location.hash.replace('#', '');
      go(views[k] ? k : order[0]);
    }).catch(function (e) {
      $('#viewArea').innerHTML = head('تعذّر الاتصال') + notice(
        '<b>تعذّر التحقّق من الحساب.</b><br>' + esc(e && e.message ? e.message : e) +
        '<br>إن كان الخطأ 404 فلم يُشغّل مخطّط قاعدة البيانات بعد.');
    });
  }

  return {
    cfg: CFG, session: function () { return S; }, me: null,
    api: api, storage: storage, audit: audit,
    views: registry, go: go, on: on, boot: boot,
    ui: { toast: toast, card: card, notice: notice, head: head, iconBtn: iconBtn,
          spinner: spinner, empty: empty, table: table, ask: ask,
          drawer: drawer, closeDrawer: closeDrawer, esc: esc, attr: attr, $: $, $$: $$ },
    fmt: fmt
  };
})();
</script>
<script>/* ===== 15-data.js ===== */
/* ============================================================================
   إدارة البيانات — صفحة واحدة تتحكّم بكل جداول الموقع.

   مسار كود واحد لكل الجداول: جدول واحد يُرسم، ودالة حفظ واحدة، ودالة حذف
   واحدة، وسجلّ أعمدة يوصف فيه كل جدول. فأيّ عيب يُصلح مرّة واحدة لا إحدى
   عشرة مرّة، وهذا سبب استبدال الشاشات المنفصلة بهذه.

   قواعد ثابتة هنا:
   • كل الحقول قابلة للتحرير مباشرةً في الجدول — لا نقر ثم تحويل.
   • الترتيب يُضبط بكتابة رقم في عمود «الترتيب»، لا بأزرار أعلى/أسفل:
     أزرار الإزاحة تُفسد القيم عند تساويها، والرقم المباشر لا يُفسد شيئًا.
   • كل خطأ يُكتب في لوحة ثابتة أعلى الجدول ولا يختفي، مع اسم الجدول
     والإجراء ونصّ الخدمة. لا رسائل عابرة تضيع قبل أن تُقرأ.
   ============================================================================ */
(function () {
  'use strict';
  var U = IAQ.ui, F = IAQ.fmt, A = IAQ.api;
  var KEY = 'data';

  /* ------------------------------ أنواع الحقول ------------------------------
     text | area | int | select | json (jsonb) | lines (text[]) | facts | ro   */

  var ST_PUB = { published: 'ظاهر', hidden: 'مخفي', draft: 'مسودّة' };
  var ST_NEWS = { published: 'منشور', draft: 'مسودّة' };

  var TABLES = [

  /* ------------------------------- الحالة ------------------------------- */
  var cur = 'people';       // الجدول المعروض
  var rows = [];            // الصفوف المقروءة
  var news = [];            // صفوف جديدة لم تُحفظ بعد

  function tbl(id) {
    for (var i = 0; i < TABLES.length; i++) if (TABLES[i].id === id) return TABLES[i];
    return TABLES[0];
  }
  function pkOf(t) { return t.pk || 'id'; }

  function note(action, e) {
    errs.push({ t: cur, a: action, m: (e && e.message) ? e.message : String(e) });
  }

  /* ------------------------------ قراءة القيم ------------------------------ */
  function toInput(col, v) {
    if (v === null || v === undefined) return '';
    if (col.t === 'json') { try { return JSON.stringify(v); } catch (e) { return String(v); } }
    if (col.t === 'lines') return (v && v.join) ? v.join('\n') : String(v);
    if (col.t === 'facts') {
      if (!v || !v.length) return '';
      var out = [];
      for (var i = 0; i < v.length; i++) {
        var f = v[i];
        if (f && f.label !== undefined) out.push(f.label + ' | ' + (f.value === undefined ? '' : f.value));
        else if (f && f.length === 2) out.push(f[0] + ' | ' + f[1]);
      }
      return out.join('\n');
    }
    if (col.t === 'select' && (v === true || v === false)) return v ? 'true' : 'false';
    return String(v);
  }

  /* يرجع {ok, value} — القيمة جاهزة للإرسال إلى القاعدة */
  function fromInput(col, raw) {
    var s = raw === null || raw === undefined ? '' : String(raw);
    if (col.t === 'int') {
      if (s.trim() === '') return { ok: true, value: null };
      var n = Number(s);
      if (!isFinite(n) || Math.floor(n) !== n) return { ok: false, why: 'يجب أن يكون عددًا صحيحًا' };
      return { ok: true, value: n };
    }
    if (col.t === 'json') {
      if (s.trim() === '') return { ok: true, value: null };
      try { return { ok: true, value: JSON.parse(s) }; }
      catch (e) { return { ok: false, why: 'قيمة JSON غير صحيحة — النصّ يُكتب بين علامتَي تنصيص' }; }
    }
    if (col.t === 'lines') {
      var ls = s.split('\n');
      var keep = [];
      for (var i = 0; i < ls.length; i++) if (ls[i].trim() !== '') keep.push(ls[i].trim());
      return { ok: true, value: keep };
    }
    if (col.t === 'facts') {
      var out = [], L = s.split('\n');
      for (var j = 0; j < L.length; j++) {
        var line = L[j].trim();
        if (!line) continue;
        var p = line.split('|');
        out.push({ label: (p[0] || '').trim(), value: (p.slice(1).join('|') || '').trim() });
      }
      return { ok: true, value: out };
    }
    if (col.t === 'select' && col.o && (col.o['true'] || col.o['false'])) {
      return { ok: true, value: s === 'true' };
    }
    return { ok: true, value: s };
  }

  /* ------------------------------- العرض ------------------------------- */
  function cellRO(col, row) {
    var v = row[col.k];
    if (col.fmt === 'date') return '<span class="mono small">' + U.esc(F.date(v)) + '</span>';
    if (col.fmt === 'bytes') return U.esc(F.bytes(v));
    if (col.fmt === 'thumb') {
      var url = IAQ.storage.publicUrl(row.bucket || 'iaq-media', v || '');
      return '<div style="display:flex;align-items:center;gap:8px">' +
        '<img src="' + U.attr(url) + '" alt="" style="width:38px;height:38px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">' +
        '<span class="mono small">' + U.esc(F.cut(v, 34)) + '</span></div>';
    }
    if (col.fmt === 'kv') {
      if (!v || typeof v !== 'object') return '<span class="muted">—</span>';
      var ks = [], n = 0;
      for (var k in v) {
        if (!v.hasOwnProperty(k)) continue;
        n++; if (n > 8) { ks.push('<div class="muted small">…</div>'); break; }
        ks.push('<div><span class="muted small">' + U.esc(k) + ':</span> ' + U.esc(F.cut(String(v[k]), 70)) + '</div>');
      }
      return ks.join('') || '<span class="muted">—</span>';
    }
    if (col.map) return U.esc(col.map[v] || v || '—');
    if (v === null || v === undefined || v === '') return '<span class="muted">—</span>';
    return '<span' + (col.mono ? ' class="mono small"' : '') + '>' + U.esc(F.cut(String(v), 90)) + '</span>';
  }

  function cellEdit(col, row, rid) {
    var id = 'dt-' + rid + '-' + col.k;
    var val = toInput(col, row[col.k]);
    var style = 'width:100%;min-width:' + (col.w || 120) + 'px;padding:7px 9px;border:1px solid var(--line);' +
      'border-radius:8px;font-family:' + (col.mono ? 'var(--mono, monospace)' : 'var(--ui)') + ';font-size:13.5px;background:#fff;color:var(--ink)';
    if (col.t === 'select') {
      var h = '<select id="' + id + '" data-col="' + U.attr(col.k) + '" style="' + style + '">';
      for (var k in col.o) {
        if (!col.o.hasOwnProperty(k)) continue;
        h += '<option value="' + U.attr(k) + '"' + (String(val) === k ? ' selected' : '') + '>' + U.esc(col.o[k]) + '</option>';
      }
      return h + '</select>';
    }
    if (col.t === 'area' || col.t === 'lines' || col.t === 'facts') {
      return '<textarea id="' + id + '" data-col="' + U.attr(col.k) + '" rows="3" style="' + style + ';resize:vertical">' + U.esc(val) + '</textarea>';
    }
    return '<input id="' + id + '" data-col="' + U.attr(col.k) + '" type="text" value="' + U.attr(val) + '" style="' + style + '">';
  }

  function rowHtml(t, row, isNew) {
    var pk = pkOf(t);
    var rid = isNew ? ('n' + row.__tmp) : String(row[pk]);
    var tds = t.cols.map(function (c) {
      var editable = (c.t !== 'ro') && (t.mode === 'crud' || t.mode === 'del');
      return '<td>' + (editable ? cellEdit(c, row, rid) : cellRO(c, row)) + '</td>';
    }).join('');
    var acts = '';
    var anyEditable = false;
    for (var z = 0; z < t.cols.length; z++) if (t.cols[z].t !== 'ro') anyEditable = true;
    if (anyEditable && (t.mode === 'crud' || t.mode === 'del')) {
      acts += '<button class="btn sm ok" data-act="dt-save" data-id="' + U.attr(rid) + '">حفظ</button> ';
    }
    if (t.mode !== 'ro') {
      acts += '<button class="ib danger sm" data-act="dt-del" data-id="' + U.attr(rid) + '" title="حذف" aria-label="حذف">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>';
    }
    if (isNew) {
      acts += ' <button class="ib sm" data-act="dt-drop" data-id="' + U.attr(rid) + '" title="إلغاء" aria-label="إلغاء">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    }
    return '<tr' + (isNew ? ' style="background:#f8fbfa"' : '') + '>' +
      '<td class="mono small" style="white-space:nowrap">' + (isNew ? '<span class="chip">جديد</span>' : U.esc(String(row[pk]))) + '</td>' +
      tds + '<td style="white-space:nowrap">' + acts + '</td></tr>';
  }

  function matches(row, t) {
    if (!q) return true;
    var s = q.toLowerCase();
    for (var i = 0; i < t.cols.length; i++) {
      var v = row[t.cols[i].k];
      if (v === null || v === undefined) continue;
      var str = (typeof v === 'object') ? JSON.stringify(v) : String(v);
      if (str.toLowerCase().indexOf(s) > -1) return true;
    }
    return String(row[pkOf(t)] || '').indexOf(s) > -1;
  }

  function errPanel() {
    if (!errs.length) return '';
    var h = '<div class="notice" style="background:#fdf1ec;border-color:#f0cdbc;color:#8c3d1c">' +
      '<b>أخطاء لم تُنفَّذ (' + errs.length + ')</b>' +
      '<button class="btn sm ghost right" data-act="dt-clearerr" style="margin-inline-start:10px">إخفاء</button>';
    for (var i = 0; i < errs.length; i++) {
      h += '<div style="margin-block-start:8px"><b>' + U.esc(errs[i].a) + '</b> — <span class="mono small">' +
        U.esc(errs[i].t) + '</span><br>' + U.esc(errs[i].m) + '</div>';
    }
    return h + '</div>';
  }

  function draw(mount) {
    var t = tbl(cur);
    var chips = '<div class="filterbar">' + TABLES.map(function (x) {
      return '<button class="btn sm' + (x.id === cur ? ' ok' : ' ghost') + '" data-act="dt-tab" data-arg="' +
        U.attr(x.id) + '">' + U.esc(x.label) + '</button>';
    }).join('') + '</div>';

    var shown = rows.filter(function (r) { return matches(r, t); });
    var head = '<tr><th>#</th>' + t.cols.map(function (c) {
      return '<th style="white-space:nowrap">' + U.esc(c.l) +
        (c.req ? ' <span style="color:#c0603a">*</span>' : '') +
        (c.hint ? '<div class="muted small" style="font-weight:400">' + U.esc(c.hint) + '</div>' : '') + '</th>';
    }).join('') + '<th></th></tr>';

    var body = news.map(function (r) { return rowHtml(t, r, true); }).join('') +
      shown.map(function (r) { return rowHtml(t, r, false); }).join('');

    var tools = '<div class="addrow" style="margin-block-end:12px">' +
      '<input id="dt-q" type="text" value="' + U.attr(q) + '" placeholder="بحث في كل الأعمدة…" style="flex:2;min-width:180px">' +
      '<button class="btn ghost" data-act="dt-search">بحث</button>' +
      (t.mode === 'crud' ? '<button class="btn" data-act="dt-new">+ صفّ جديد</button>' : '') +
      '<button class="btn ghost" data-act="dt-reload">تحديث من القاعدة</button>' +
      '</div>';

    var count = '<span class="chip">' + U.esc(F.num(rows.length)) + ' صفًّا' +
      (shown.length !== rows.length ? ' · ' + U.esc(F.num(shown.length)) + ' مطابق' : '') + '</span>';

    mount.innerHTML =
      U.head('إدارة البيانات', 'كل جداول الموقع في مكان واحد — تعديل وإضافة وحذف.') +
      chips + errPanel() +
      '<div class="ad-card">' +
        '<h3>' + U.esc(t.label) + ' ' + count + '</h3>' +
        '<p class="muted small" style="margin-block-end:14px">' + U.esc(t.reach) + '</p>' +
        tools +
        (body ? '<div style="overflow-x:auto"><table class="tbl"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
              : U.empty('لا صفوف في هذا الجدول.')) +
        (t.mode === 'crud' && t.cols.length ? '<p class="muted small" style="margin-block-start:12px">الترتيب يُضبط بكتابة رقم في عمود «الترتيب» — الأصغر أوّلًا.</p>' : '') +
      '</div>';
  }

  /* ------------------------------- التحميل ------------------------------- */
  function load(mount) {
    var t = tbl(cur);
    return A.select(t.id, 'select=*&order=' + t.order + '&limit=' + LIMIT).then(function (r) {
      rows = r || [];
      draw(mount);
    }, function (e) {
      rows = [];
      note('قراءة الجدول', e);
      draw(mount);
    });
  }

  function render(mount) {
    news = [];
    return load(mount);      // الوعد يُعاد كي تلتقط النواة أي فشل ولا يُكتم
  }

  /* -------------------------------- الحفظ -------------------------------- */
  function readRow(t, rid) {
    var patch = {}, bad = null;
    for (var i = 0; i < t.cols.length; i++) {
      var c = t.cols[i];
      if (c.t === 'ro') continue;
      var el = U.$('#dt-' + rid + '-' + c.k);
      if (!el) continue;                       // الحقل غير معروض — لا نلمس العمود
      var res = fromInput(c, el.value);
      if (!res.ok) { bad = c.l + ': ' + res.why; break; }
      if (c.req && (res.value === null || res.value === '' )) { bad = c.l + ': مطلوب'; break; }
      patch[c.k] = res.value;
    }

  function afterWrite(mount, action, id) {

  });
  IAQ.on('dt-drop', function (b) {
    var id = b.getAttribute('data-id');

  });

  IAQ.on('dt-save', function (b) {
    var t = tbl(cur), rid = b.getAttribute('data-id'), mount = U.$('#viewArea');

    b.disabled = true; b.textContent = '…';
    var isNew = rid.charAt(0) === 'n';
    var p;
    if (isNew) {
      p = A.insert(t.id, r.patch, pkOf(t)).then(function (out) {
        var id = out && out[0] ? out[0][pkOf(t)] : null;

      p = A.updateWhere(t.id, 'key=eq.' + encodeURIComponent(rid), r.patch).then(function (out) {

        U.toast('حُفظ'); afterWrite(mount, 'update', rid);
      });
    }
    p.catch(function (e) {
      note(isNew ? 'إضافة صفّ' : 'حفظ الصفّ ' + rid, e);
      U.toast((e && e.message) ? e.message : 'فشل الحفظ', 'err');
      draw(mount);
    });
  });

  IAQ.on('dt-del', function (b) {
    var t = tbl(cur), rid = b.getAttribute('data-id'), mount = U.$('#viewArea');

        } else { U.toast('حُذف الصفّ'); }

      });

      note('حذف الصفّ ' + rid, e);
      U.toast((e && e.message) ? e.message : 'فشل الحذف', 'err');
      draw(mount);
    });
  });

  IAQ.views.register(KEY, {
    label: 'إدارة البيانات',
    group: 'الإدارة',
    icon: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.5h18M9 4v16"/>',
    render: render
  });
})();

  var SVG_OK = { path: 1, circle: 1, rect: 1, line: 1, polyline: 1, polygon: 1, ellipse: 1, g: 1, title: 1 };

  function cleanSvg(html) {
    var box = document.createElement('div');
    box.innerHTML = '<svg>' + String(html || '') + '</svg>';
    var svg = box.firstChild;
    (function walk(node) {
      var kids = Array.prototype.slice.call(node.children || []);
      kids.forEach(function (c) {
        var n = (c.localName || '').toLowerCase();
        if (!SVG_OK[n]) { c.parentNode.removeChild(c); return; }
        Array.prototype.slice.call(c.attributes || []).forEach(function (at) {
          var an = at.name.toLowerCase();
          if (an.indexOf('on') === 0 || an === 'href' || an === 'xlink:href' || an === 'style') c.removeAttribute(at.name);

        walk(c);

    return svg.innerHTML;

  /* --------------------------- تحميل البيانات --------------------------- */

  }

    var q = 'select=*&or=(page.eq.' + encodeURIComponent(slug) + ',page.eq.*)&order=id.desc';
    return A.select(TABLE, q).then(function (r) { rows = r || []; return rows; });
  }

  function rowFor(path, op, attr, part) {
    for (var i = 0; i < rows.length; i++) {

          (r.attr || '') === (attr || '') && (r.part == null ? -1 : r.part) === (part == null ? -1 : part)) return r;

  }

  /* ------------------------------ العرض ------------------------------ */

    } else if (kind === 'icon') {

          '<div class="mi-img" style="height:56px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#007878" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ic[1] + '</svg></div>' +

        '<div class="btnbar"><button class="btn" data-act="ct-save" data-arg="icon">حفظ الأيقونة</button></div></div>';
    } else if (kind === 'image') {
      h += attrSec(el, path, [['src', 'مسار الصورة'], ['alt', 'الوصف البديل']]);
    }

    var t = P.tagOf(el);
    if (t === 'a') h += attrSec(el, path, [['href', 'الرابط'], ['title', 'التلميح']]);
    if (t === 'button' || t === 'a') h += attrSec(el, path, [['aria-label', 'الوصف لقارئ الشاشة']]);

    // الإخفاء والحذف متاحان لأي عنصر
    var hid = rowFor(path, 'hide', '', -1), del = rowFor(path, 'delete', '', -1);
    h += '<div class="drawer-sec"><h4>الظهور</h4>' +
      '<p class="muted small">الإخفاء يُبقي العنصر في الصفحة ويمنع ظهوره — قابل للتراجع. الحذف يُزيله تمامًا.</p>' +
      '<div class="btnbar">' +
      (hid ? '<button class="btn ghost" data-act="ct-restore" data-id="' + hid.id + '">إلغاء الإخفاء</button>'
           : '<button class="btn ghost" data-act="ct-save" data-arg="hide">إخفاء العنصر</button>') +
      (del ? '<button class="btn ghost" data-act="ct-restore" data-id="' + del.id + '">إلغاء الحذف</button>'
           : '<button class="btn danger" data-act="ct-save" data-arg="delete">حذف العنصر</button>') +
      '</div></div>';

    U.drawer('تعديل عنصر · ' + (page === '*' ? 'كل الصفحات' : page), h);
  }

  function attrSec(el, path, list) {
    var h = '<div class="drawer-sec"><h4>الخصائص</h4>';
    list.forEach(function (pair) {
      var name = pair[0], lbl = pair[1];
      var r = rowFor(path, 'attr', name, -1);
      var cur = r ? r.value : (el.getAttribute(name) || '');
      h += '<div class="fld"><label for="ct-a-' + name + '">' + U.esc(lbl) + ' <span class="mono small">' + name + '</span></label>' +
        '<input type="text" id="ct-a-' + name + '" dir="ltr" value="' + U.attr(cur) + '"></div>' +
        '<div class="btnbar" style="margin-block-end:10px"><button class="btn sm" data-act="ct-save" data-arg="attr:' + name + '">حفظ</button></div>';
    });
    return h + '</div>';
  }

  /* ------------------------------ الحفظ ------------------------------ */
  function save(kindArg) {
    if (!picked) return;
    var el = picked.el, path = picked.path;
    var page = picked.scope === 'global' ? '*' : slug;
    var op = kindArg, attr = '', part = -1, value = null, fp = null, orig = null;

    if (kindArg.indexOf('attr:') === 0) {
      op = 'attr'; attr = kindArg.slice(5);
      var inp = U.$('#ct-a-' + attr);
      value = inp ? inp.value : '';
      orig = el.getAttribute(attr) || '';
      fp = P.fpOf(el, orig);
    } else if (kindArg.indexOf('tnode:') === 0) {
      op = 'tnode'; part = parseInt(kindArg.slice(6), 10);
      var pi = U.$('#ct-p' + part);
      value = pi ? pi.value : '';
      var n = el.childNodes[part];
      orig = n ? n.nodeValue : '';
      fp = P.fpOf(el, orig);
    } else if (kindArg === 'text') {
      var ta = U.$('#ct-val');
      value = ta ? ta.value : '';
      orig = el.textContent;
      fp = P.fpOf(el);
    } else if (kindArg === 'icon') {
      var iv = U.$('#ct-val');
      value = cleanSvg(iv ? iv.value : '');
      orig = el.innerHTML;
      fp = P.fpOf(el, orig);
    } else if (kindArg === 'hide' || kindArg === 'delete') {
      value = null; orig = F.cut(el.textContent || P.tagOf(el), 90);
      fp = P.fpOf(el);
    } else { return; }

    if ((op === 'text' || op === 'tnode') && P.norm(value) === P.norm(orig)) {
      U.toast('لا تغيير — النصّ كما هو', 'warn'); return;
    }

    var row = {
      page: page, path: path, op: op, attr: attr, part: part,
      value: value, orig_fp: fp, orig_text: F.cut(orig, 300),
      label: F.cut(P.norm(el.textContent) || P.tagOf(el), 90),
      status: 'published', updated_by: (IAQ.me && IAQ.me.email) || ''
    };

    A.upsert(TABLE, [row], 'page,path,op,attr,part').then(function (res) {
      IAQ.audit('content.' + op, 'content_overrides', res && res[0] && res[0].id);
      U.toast(op === 'delete' ? 'حُذف العنصر' : (op === 'hide' ? 'أُخفي العنصر' : 'تم الحفظ — سيظهر للزوّار خلال دقائق'));
      U.closeDrawer();
      IAQ.go('content');
    }).catch(function (e) {
      U.toast(e && e.message ? e.message : 'فشل الحفظ', 'err');
    });
  }

  /* ------------------------------ الأحداث ------------------------------ */
  IAQ.on('ct-tab', function (b) { tab = b.getAttribute('data-arg'); IAQ.go('content'); });
  IAQ.on('ct-load', function () {
    var s = U.$('#ct-page');
    if (s) slug = s.value;
    mountFrame();
  });
  IAQ.on('ct-refresh', function () { mountFrame(); });
  IAQ.on('ct-save', function (b) { save(b.getAttribute('data-arg')); });
  IAQ.on('ct-icon', function (b) {
    var i = parseInt(b.getAttribute('data-arg'), 10);
    var ta = U.$('#ct-val');
    if (ta && ICONS[i]) { ta.value = ICONS[i][1]; U.toast('اخترت «' + ICONS[i][0] + '» — اضغط حفظ الأيقونة'); }
  });
  IAQ.on('ct-restore', function (b) {
    var id = b.getAttribute('data-id');
    U.ask('استرجاع المحتوى الأصليّ وحذف هذا التعديل؟').then(function (ok) {
      if (!ok) return;
      return A.remove(TABLE, id).then(function (res) {
        if (!res || !res.length) { U.toast('لم يُحذف شيء — قد يكون التعديل محذوفًا مسبقًا', 'warn'); }
        else { IAQ.audit('content.restore', 'content_overrides', id); U.toast('استُرجع الأصل'); }
        U.closeDrawer();
        IAQ.go('content');
      });
    }).catch(function (e) { U.toast(e && e.message ? e.message : 'فشل الاسترجاع', 'err'); });
  });

  IAQ.views.register('content', {
    label: 'المحتوى',
    group: 'المحتوى',
    icon: '<path d="M4 5h16M4 12h10M4 19h7"/><path d="M15.5 19l5-5 2 2-5 5h-2z"/>',
    render: render
  });
})();
</script>
<script>IAQ.boot();</script>
</body>
</html>
