    { v: 'published', t: 'ظاهر' },
    { v: 'hidden',    t: 'مخفي' },
    { v: 'draft',     t: 'مسودّة' }
  ];

  /* حالة الشاشة — تُقرأ عند كل رسم لأن الشاشة تُعاد بالكامل */
  var grp = 'assembly';     // المجموعة المعروضة: تنقّل الشاشة الأساسي
  var mode = 'list';        // 'list' أو 'form'
  var editId = null;        // معرّف العضو عند التعديل، أو null للإضافة
  var internal = false;     // هل جاء الرسم من تنقّل داخليّ لهذه الوحدة؟

  /* عدد كل مجموعة كما تقرؤه القاعدة. null = لم يُقرأ — لا يُعرض صفرًا مكانه */
  var counts = { assembly: null, board: null, team: null };

  var IC_EDIT = '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14.5 5.5l4 4"/>';
  var IC_UP = '<path d="M12 16V6"/><path d="M8 10l4-4 4 4"/><path d="M5 19h14"/>';
  var IC_DOWN = '<path d="M12 6v10"/><path d="M8 12l4 4 4-4"/><path d="M5 19h14"/>';
  var IC_DEL = '<path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/>';
  var IC_EYE = '<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/>';
  var IC_EYEOFF = '<path d="M4 4l16 16"/>' +
    '<path d="M9.8 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17.5 17.5 0 0 1-2.7 3.3"/>' +
    '<path d="M6.4 7.5A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4-.8"/>';

  /* --------------------------- أدوات مساعدة صغيرة --------------------------- */

  /* معرّف صحيح موجب أو null — نتحقّق قبل بناء أي استعلام يحمل معرّفًا */
  function toInt(v) {
    var n = Number(v);
    if (!isFinite(n) || n <= 0 || Math.floor(n) !== n) return null;
    return n;
  }

  function gOf(id) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === id) return GROUPS[i];
    return null;
  }
  function labelOf(list, v) {
    for (var i = 0; i < list.length; i++) if (list[i].v === v) return list[i].t;
    return '';
  }

  function val(sel) {
    var el = U.$(sel);
    return el ? String(el.value == null ? '' : el.value) : '';
  }
  function trimmed(sel) { return val(sel).replace(/^\s+|\s+$/g, ''); }
  function txt(v) { return String(v == null ? '' : v).replace(/^\s+|\s+$/g, ''); }
  function who() { return (IAQ.me && IAQ.me.email) || ''; }

  function statusBadge(s) {
    var cls = s === 'published' ? 'rp' : (s === 'hidden' ? 'cl' : 'nw');
    var t = labelOf(STATUS, s);
    return '<span class="stbadge ' + cls + '">' + U.esc(t || (s || '—')) + '</span>';
  }

  function boom(e) { U.toast((e && e.message) || 'فشل الإجراء', 'err'); }

  /* لاحقة رسالة الحفظ تتبع الحالة المحفوظة فعلًا: صفحات الموقع تقرأ «ظاهر» وحدها،
     فقول «يراه الزائر» عن مسودّة أو صفٍّ مخفيّ كذب صريح. */
  function reachMsg(st) {
    if (st === 'published') return ' — يراه الزائر في أوّل تحميل للصفحة';
    return ' — حالته «' + (labelOf(STATUS, st) || st) + '» ولا تقرؤها صفحات الموقع، فلا يظهر للزائر';
  }

  /* التنبيه الإلزاميّ عن المدى — مقروء من طبقة القوائم الحيّة نفسها */
  function reachNotice() {
    return U.notice(
      '<b>ما تحفظه هنا يصل إلى الموقع فعلًا، وبلا إعادة بناء.</b><br>' +
      'طبقة القوائم الحيّة (<span class="mono">src/templates/iaq-lists.js</span>) المحقونة في صفحات ' +
      'الموقع تقرأ هذا الجدول عند تحميل الصفحة وتُعيد بناء البطاقات منه: ' +
      '<span class="mono">assembly.html</span> للجمعية العمومية، و<span class="mono">board.html</span> ' +
      'لمجلس الإدارة، و<span class="mono">team.html</span> لفريق العمل. ' +
      'فالإضافة والتعديل والإظهار والإخفاء والحذف وإعادة الترتيب يراها الزائر في أوّل تحميل للصفحة ' +
      'بعد الحفظ — بلا إعادة بناء ولا نشر. تقرأ الطبقة الصفوف ذات الحالة «ظاهر» وحدها، ' +
      'مرتّبةً بـ<span class="mono">sort</span> ثم بالمعرّف كما في هذه الشاشة — إلا في مجلس ' +
      'الإدارة، فرتبتا «رئيس المجلس» و«نائب الرئيس» تُنقلان إلى بطاقات الصدارة أوّلًا ثم يأتي ' +
      'الباقون بهذا الترتيب، أي أنّ ترتيب جدول المجلس هنا ليس هو ترتيب البطاقات عند الزائر حرفيًّا. ' +
      'وصفحة مفتوحة أمام الزائر الآن لا تتبدّل من نفسها، لأنّ القراءة تحدث عند التحميل فقط.' +
      '<br><b>وحدّان لا نُخفيهما:</b> ' +
      '(١) إن لم تُعِد القاعدة أي صفّ «ظاهر» — أخفيتَ الكلّ أو حذفتَه، أو سقطت الشبكة، أو منعت ' +
      'سياسات الحماية القراءة — فالطبقة تُبقي البطاقات المبنيّة من ملفات ' +
      '<span class="mono">src/data/*-members.json</span> كما هي. أي أنّك لا تستطيع تفريغ قسم من هذه ' +
      'الشاشة: الزائر سيرى القائمة المبنيّة القديمة لا قسمًا فارغًا. ' +
      '(٢) في مجلس الإدارة تُستبدل بطاقات الصدارة (رئيس المجلس ونائبه) وبطاقات الشبكة كلٌّ على حدة، ' +
      'فإن لم يكن في القاعدة صفٌّ برتبة «رئيس المجلس» أو «نائب الرئيس» بقيت بطاقات الصدارة المبنيّة ' +
      'على حالها بجانب بطاقاتك الجديدة.',
      'ok'
    );
  }

  /* نصّ ثابت عن الصور — الوحدة تخزّن الاسم فقط ولا ترفع ملفًا */
  var PHOTO_NOTE =
    'يُخزَّن اسم الملف فقط، وهذه الشاشة لا ترفع صورًا. يجب أن يكون الملف موجودًا مسبقًا في ' +
    '<span class="mono">site/img/board/</span> أو <span class="mono">site/img/team/</span> — ' +
    'طبقة القوائم الحيّة تضع المسار <span class="mono">img/&lt;المجموعة&gt;/&lt;اسم الملف&gt;</span> ' +
    'كما هو بلا أي تحقّق، فاسم يشير إلى ملف مفقود يُنتج صورة مكسورة عند الزائر لا أيقونة بديلة. ' +
    'أمّا الحقل الفارغ فيُظهر الأيقونة الرمزية سليمةً — فاتركه فارغًا إن لم تكن الصورة جاهزة.';

  /* ------------------------------ شاشة القائمة ------------------------------ */

  /* عدّ فعليّ لكل مجموعة. فشل العدّ وحده لا يُسقط الشاشة — يبقى «غير معروف» */
  function loadCounts() {
    var jobs = GROUPS.map(function (g) {
      return A.count('people', 'select=id&grp=eq.' + g.id).then(function (n) {
        counts[g.id] = n;
      }).catch(function () { counts[g.id] = null; });
    });
    return Promise.all(jobs);
  }

  function grpBtn(g) {
    var n = counts[g.id];
    return '<button class="btn sm' + (grp === g.id ? ' ok' : ' ghost') + '" data-act="people-grp" ' +
      'data-arg="' + U.esc(g.id) + '">' + U.esc(g.name) + ' (' +
      (n == null ? '—' : U.esc(F.num(n))) + ')</button>';
  }

  function photoCell(r) {
    var p = txt(r.photo);
    if (!p) return '<span class="muted">—</span>';
    return '<img src="' + U.esc('img/' + r.grp + '/' + p) + '" alt="' + U.esc(r.name) +
      '" width="34" height="34" style="border-radius:8px;object-fit:cover;background:#f3f6f7">';
  }

  function nameCell(g, r) {
    var t = txt(r.title);
    var h = '<b>' + (t ? U.esc(t) + ' ' : '') + U.esc(r.name || '(بلا اسم)') + '</b>';
    if (g.contact) {
      var bits = [];
      if (txt(r.phone)) bits.push(txt(r.phone));
      if (txt(r.email)) bits.push(txt(r.email));
      if (bits.length) {
        h += '<br><span class="mono small">' + U.esc(bits.join(' · ')) + '</span>';
      }
    }
    return h;
  }

  function rowActs(g, r, first, last) {
    var pub = r.status === 'published';
    var h = '<div class="acts">' +
      U.iconBtn('people-edit', IC_EDIT, { id: r.id, sm: true, label: 'تعديل' });
    /* حراسة أولى: لا نرسم زرًّا لا معنى له في طرفَي القائمة */
    if (!first) h += U.iconBtn('people-up', IC_UP, { id: r.id, sm: true, label: 'تحريك لأعلى' });
    if (!last) h += U.iconBtn('people-down', IC_DOWN, { id: r.id, sm: true, label: 'تحريك لأسفل' });
    h += U.iconBtn('people-toggle', pub ? IC_EYEOFF : IC_EYE,
      { id: r.id, arg: pub ? 'hidden' : 'published', sm: true,
        label: pub ? 'إخفاء' : 'إظهار' }) +
      U.iconBtn('people-del', IC_DEL, { id: r.id, sm: true, danger: true, label: 'حذف' }) +
      '</div>';
    return h;
  }

  function renderList(mount) {
    var g = gOf(grp) || GROUPS[0];
    grp = g.id;
    var q = 'select=*&grp=eq.' + g.id + '&order=sort.asc,id.asc';

    return Promise.all([loadCounts(), A.select('people', q)]).then(function (res) {
      var rows = res[1] || [];
      var last = rows.length - 1;

      var bar = '<div class="filterbar">' + GROUPS.map(grpBtn).join('') + '</div>';

      var body;
      if (!rows.length) {
        body = U.empty('لا توجد صفوف في هذه المجموعة، أو أنّ سياسات الحماية لا تسمح لحسابك ' +
          'بقراءتها — القراءة الممنوعة ترجع نتيجة فارغة بلا رسالة خطأ.');
      } else if (g.cat) {
        body = U.table(
          ['الترتيب', 'الاسم', 'التصنيف', 'الحالة', 'إجراءات'],
          rows.map(function (r, i) {
            var c = labelOf(CATS, txt(r.cat));
            return [
              '<span class="mono small">' + U.esc(F.num(r.sort)) + '</span>',
              nameCell(g, r),
              c ? '<span class="chip">' + U.esc(c) + '</span>'
                : (txt(r.cat) ? '<span class="chip">' + U.esc(txt(r.cat)) + '</span>'
                              : '<span class="muted">—</span>'),
              statusBadge(r.status),
              rowActs(g, r, i === 0, i === last)
            ];
          })
        );
      } else {
        body = U.table(
          ['الترتيب', 'الصورة', 'الاسم', 'المنصب', 'الرتبة', 'الحالة', 'إجراءات'],
          rows.map(function (r, i) {
            var rk = labelOf(RANKS, txt(r.rank));
            return [
              '<span class="mono small">' + U.esc(F.num(r.sort)) + '</span>',
              photoCell(r),
              nameCell(g, r),
              txt(r.role) ? U.esc(F.cut(txt(r.role), 46)) : '<span class="muted">—</span>',
              rk ? '<span class="chip">' + U.esc(rk) + '</span>'
                 : (txt(r.rank) ? '<span class="mono small">' + U.esc(txt(r.rank)) + '</span>'
                                : '<span class="muted">—</span>'),
              statusBadge(r.status),
              rowActs(g, r, i === 0, i === last)
            ];
          })
        );
      }

      var foot = '<button class="btn" data-act="people-new">إضافة ' + U.esc(g.one) + '</button>';

      var tail = '<p class="muted small">الأعداد بين قوسَي أزرار المجموعات مقروءة من القاعدة بعدٍّ ' +
        'فعليّ لكل مجموعة، والشرطة تعني «تعذّر العدّ» لا صفرًا. ' +
        'الترتيب المعروض هو العمود <span class="mono">sort</span> تصاعديًّا ثم المعرّف، ' +
        'وهو الترتيب نفسه الذي تحرّكه أسهم الصفوف. وإن كانت قيم ' +
        '<span class="mono">sort</span> في المجموعة متساوية فتحريك صفٍّ واحد يقتضي إعادة ترقيم ' +
        'الصفوف بقيم متمايزة — تُسأل قبل ذلك ولا يُكتب شيء بلا موافقتك.</p>';

      /* لا نُخفي تعارضًا بين العدّ الكلّي وما حُمِّل فعلًا */
      var cn = counts[g.id];
      if (cn != null && cn !== rows.length) {
        tail += U.notice('<b>تنبيه:</b> العدّ الكلّي لهذه المجموعة ' + U.esc(F.num(cn)) +
          ' بينما حُمِّل ' + U.esc(F.num(rows.length)) + ' صفًّا فقط. ' +
          'قد تكون الخدمة تُرقّم النتائج، أو أنّ سياسات الحماية تمنع قراءة بعض الصفوف. ' +
          'ما تراه في الجدول هو ما أعادته القاعدة، لا أكثر.');
      }
      if (g.photo) {
        tail += '<p class="muted small">' + PHOTO_NOTE + '</p>';
      }

      mount.innerHTML =
        U.head('الأعضاء والفريق', 'الجمعية العمومية ومجلس الإدارة وفريق العمل — جدول واحد بثلاث مجموعات') +
        reachNotice() + bar +
        U.card(g.name + ' — الصفوف المُحمَّلة (' + F.num(rows.length) + ')', body, foot) +
        tail;
    });
  }

  /* ------------------------------ شاشة النموذج ------------------------------ */

  /* قائمة اختيار. blankLabel يُستخدم حين تكون القيمة المخزَّنة خارج القائمة،
     كي لا يختار المتصفّح أوّل خيار فيُبدّل بيانات لم يمسّها المدير. */
  function selHtml(id, list, cur, blankLabel) {
    var found = false, i;
    for (i = 0; i < list.length; i++) if (list[i].v === cur) found = true;
    var h = '<select id="' + id + '">';
    if (!found && blankLabel) {
      h += '<option value="" selected>' + U.esc(blankLabel) + '</option>';
    }
    h += list.map(function (o) {
      return '<option value="' + U.esc(o.v) + '"' + (o.v === cur ? ' selected' : '') + '>' +
        U.esc(o.t) + '</option>';
    }).join('');
    return h + '</select>';
  }

  function formHtml(g, r, nextSort) {
    r = r || {};
    var isEdit = !!r.id;

    var h = '<div class="prow" style="margin-block-end:14px">' +
      '<span class="muted">المجموعة:</span><b>' + U.esc(g.name) + '</b>' +
      '<span class="mono small">' + U.esc(g.id) + '</span>' +
      '<span class="muted small">المجموعة مثبَّتة في هذا النموذج؛ نقل شخص من مجموعة إلى أخرى ' +
      'غير متاح من هذه الشاشة.</span></div>';

    h += '<div class="grid2">' +
      '<div class="fld"><label for="people-title">اللقب</label>' +
        '<input type="text" id="people-title" value="' + U.esc(txt(r.title)) +
        '" placeholder="أ. أو م. أو د."><span class="muted small">اختياري، ويُخزَّن نصًّا فارغًا ' +
        'إن تُرك خاليًا.</span></div>' +
      '<div class="fld"><label for="people-name">الاسم</label>' +
        '<input type="text" id="people-name" value="' + U.esc(txt(r.name)) +
        '" placeholder="الاسم الثلاثي"><span class="muted small">مطلوب، وفريد داخل المجموعة — ' +
        'اسم مكرّر في المجموعة نفسها ترفضه القاعدة.</span></div>' +
      '</div>';

    if (g.role) {
      h += '<div class="fld"><label for="people-role">المنصب</label>' +
        '<input type="text" id="people-role" value="' + U.esc(txt(r.role)) +
        '" placeholder="' + (g.id === 'board' ? 'عضو مجلس إدارة' : 'المدير التنفيذي') + '"></div>';
    }

    if (g.rank) {
      h += '<div class="fld"><label for="people-rank">الرتبة</label>' +
        selHtml('people-rank', RANKS, isEdit ? txt(r.rank) : 'member') +
        '<span class="muted small">الرتبة تُرتّب البطاقات في الموقع (الرئيس ونائبه في الصدارة) ' +
        'ولا تقبل القاعدة غير هذه القيم الأربع.</span></div>';
    } else if (isEdit && txt(r.rank)) {
      /* لا نُحرّر الرتبة هنا، ولا نمسحها: نُخبر بها ونحفظها كما هي */
      h += '<p class="muted small">الرتبة المخزَّنة لهذا الصفّ: <b>' +
        U.esc(labelOf(RANKS, txt(r.rank)) || txt(r.rank)) + '</b> — لا تُحرَّر من نموذج ' +
        U.esc(g.name) + '، وتُحفظ كما هي بلا تغيير.</p>';
    }

    if (g.cat) {
      h += '<div class="fld"><label for="people-cat">التصنيف</label>' +
        selHtml('people-cat', CATS, isEdit ? txt(r.cat) : 'working',
          'كما هي في القاعدة (غير محدّدة)') +
        '</div>';
    }

    if (g.contact) {
      h += '<div class="grid2">' +
        '<div class="fld"><label for="people-phone">الهاتف</label>' +
          '<input type="text" id="people-phone" value="' + U.esc(txt(r.phone)) +
          '" placeholder="05XXXXXXXX" dir="ltr"></div>' +
        '<div class="fld"><label for="people-email">البريد</label>' +
          '<input type="text" id="people-email" value="' + U.esc(txt(r.email)) +
          '" placeholder="name@iaq.org.sa" dir="ltr"></div>' +
        '</div>';
    }

    if (g.photo) {
      var p = txt(r.photo);
      h += '<div class="fld"><label for="people-photo">اسم ملف الصورة</label>' +
        '<input type="text" id="people-photo" value="' + U.esc(p) +
        '" placeholder="' + U.esc(g.id) + '-01.jpg" dir="ltr">' +
        '<span class="muted small">' + PHOTO_NOTE + '</span></div>';
      if (p) {
        h += '<div class="prow"><span class="muted small">المخزَّن الآن:</span>' +
          '<img src="' + U.esc('img/' + g.id + '/' + p) + '" alt="' + U.esc(txt(r.name)) +
          '" width="34" height="34" style="border-radius:8px;object-fit:cover;background:#f3f6f7">' +
          '<span class="mono small">' + U.esc('img/' + g.id + '/' + p) + '</span>' +
          '<span class="muted small">إن ظهرت الصورة مكسورة فالملف غير موجود بهذا الاسم.</span></div>';
      }
    }

    var sortVal = isEdit ? String(r.sort == null ? '' : r.sort) : String(nextSort);
    h += '<div class="grid2">' +
      '<div class="fld"><label for="people-sort">الترتيب</label>' +
        '<input type="number" id="people-sort" step="1" value="' + U.esc(sortVal) + '" dir="ltr">' +
        '<span class="muted small">' +
        (isEdit
          ? 'الأصغر يظهر أولًا. أسهم الصفوف في القائمة تبدّل هذه القيمة تلقائيًّا، وإن كانت قيم ' +
            'المجموعة متساوية سألتك أوّلًا قبل إعادة ترقيمها كلّها بقيم متمايزة.'
          : 'القيمة المقترحة = أكبر ترتيب مقروء في هذه المجموعة + 10، أو 10 إن لم تُعِد القاعدة صفًّا.') +
        '</span></div>' +
      '<div class="fld"><label for="people-status">الحالة</label>' +
        selHtml('people-status', STATUS, isEdit ? txt(r.status) : 'published') +
        '<span class="muted small">«ظاهر» هي الحالة الوحيدة التي تقرؤها صفحات الموقع؛ ' +
        'و«مخفي» و«مسودّة» لا تظهران للزائر — مع مراعاة الحدّ الأول في التنبيه أعلى الشاشة.' +
        '</span></div>' +
      '</div>';

    var foot = '<button class="btn ghost" data-act="people-cancel">إلغاء</button>' +
      '<button class="btn" data-act="people-save" data-arg="' + U.esc(g.id) + '"' +
      (isEdit ? ' data-id="' + U.esc(r.id) + '"' : '') + '>' +
      (isEdit ? 'حفظ التعديلات' : 'إضافة إلى ' + U.esc(g.name)) + '</button>';

    var meta = isEdit
      ? '<p class="muted small mono">#' + U.esc(r.id) + ' · أُنشئ: ' + U.esc(F.date(r.created_at)) +
        (r.updated_at ? ' · آخر تعديل: ' + U.esc(F.date(r.updated_at)) : '') +
        (txt(r.updated_by) ? ' · ' + U.esc(txt(r.updated_by)) : '') + '</p>'
      : '';

    return U.head(isEdit ? 'تعديل بيانات شخص' : 'إضافة ' + g.one,
      isEdit ? 'تحديث صفّ موجود في جدول الأشخاص' : 'إضافة صفّ جديد إلى جدول الأشخاص') +
      reachNotice() + meta +
      U.card(isEdit ? 'البيانات' : 'بيانات الصفّ الجديد', h, foot);
  }

  function backCard(title, body) {
    return U.head(title) + U.notice(body) +
      '<div class="right"><button class="btn ghost" data-act="people-cancel">رجوع إلى القائمة</button></div>';
  }

  function renderForm(mount) {
    var g = gOf(grp) || GROUPS[0];

    if (editId == null) {
      /* الترتيب المقترح مقروء من القاعدة لا مُخترع: أكبر sort في المجموعة + 10 */
      return A.select('people', 'select=sort&grp=eq.' + g.id + '&order=sort.desc&limit=1')
        .then(function (rows) {
          var next = 10;
          if (rows && rows.length) {
            var m = Math.round(Number(rows[0].sort));
            if (isFinite(m)) next = m + 10;
          }
          mount.innerHTML = formHtml(g, null, next);
        });
    }

    var n = toInt(editId);
    if (n == null) {
      // نُعيد الحالة إلى القائمة كي لا يتحوّل هذا المخرج بصمت إلى نموذج «إضافة»
      editId = null; mode = 'list';
      mount.innerHTML = backCard('تعديل بيانات شخص',
        '<b>معرّف غير صالح — أُلغي التحميل حمايةً للبيانات.</b><br>' +
        'عد إلى القائمة واختر الصفّ من جديد.');
      return Promise.resolve();
    }

    return A.select('people', 'select=*&id=eq.' + n + '&limit=1').then(function (rows) {
      if (!rows || !rows.length) {
        editId = null; mode = 'list';
        mount.innerHTML = backCard('تعديل بيانات شخص',
          '<b>لم يُعَد أي صفّ بهذا المعرّف (#' + U.esc(n) + ').</b><br>' +
          'قد يكون السجلّ محذوفًا، أو أن سياسات الحماية لا تسمح لحسابك بقراءته — ' +
          'القراءة الممنوعة ترجع نتيجة فارغة لا رسالة خطأ.');
        return;
      }
      var r = rows[0];
      /* مجموعة الصفّ هي المرجع، لا المرشِّح المعروض — كي لا نرسم حقولًا لا تخصّه */
      var rg = gOf(txt(r.grp));
      if (!rg) {
        editId = null; mode = 'list';
        mount.innerHTML = backCard('تعديل بيانات شخص',
          '<b>مجموعة هذا الصفّ غير معروفة:</b> <span class="mono">' + U.esc(txt(r.grp) || 'فارغة') +
          '</span><br>هذه الشاشة تعرف ثلاث مجموعات فقط (assembly, board, team)، ' +
          'ولن تحرّر صفًّا خارجها كي لا تُتلف بياناته.');
        return;
      }
      grp = rg.id;
      mount.innerHTML = formHtml(rg, r, 0);
    });
  }

  /* -------------------------- قراءة النموذج وحفظه -------------------------- */

  /* لا نرسل null لأي عمود نصّي، ولا نرسل updated_at (مُطلِق people_touch يضبطه) */
  function collect(g) {
    var name = trimmed('#people-name');
    if (!name) { U.toast('الاسم مطلوب', 'warn'); return null; }

    var sortRaw = trimmed('#people-sort');
    var sortN = Math.round(Number(sortRaw));
    if (sortRaw === '' || !isFinite(sortN)) {
      U.toast('الترتيب مطلوب ويجب أن يكون عددًا صحيحًا', 'warn');
      return null;
    }

    /* حقل مفقود = لا نعرف ما يريده المدير. الاستبدال الصامت بقيمة افتراضية
       يمحو حالةً منشورةً أو رتبةً مخزَّنةً بلا أن يرى أحد، فنتوقّف بدلًا من ذلك. */
    var stEl = U.$('#people-status');
    if (!stEl) {
      U.toast('حقل الحالة غير موجود في الشاشة — أُلغي الحفظ كي لا تتبدّل الحالة بصمت.', 'err');
      return null;
    }
    var st = String(stEl.value == null ? '' : stEl.value);
    if (!labelOf(STATUS, st)) {   // قيد CHECK لا يقبل غير draft|published|hidden
      U.toast('حالة غير معروفة — أُلغي الحفظ.', 'err');
      return null;
    }

    var rec = {
      title: trimmed('#people-title'),
      name: name,
      sort: sortN,
      status: st,
      updated_by: who()
    };

    if (g.role) rec.role = trimmed('#people-role');
    if (g.rank) {
      var rkEl = U.$('#people-rank');
      if (!rkEl) {
        U.toast('حقل الرتبة غير موجود في الشاشة — أُلغي الحفظ كي لا تُمحى الرتبة المخزَّنة.', 'err');
        return null;
      }
      var rk = String(rkEl.value == null ? '' : rkEl.value);
      if (!labelOf(RANKS, rk)) {   // قيد CHECK لا يقبل غير chair|vice|lead|member
        U.toast('رتبة غير معروفة — أُلغي الحفظ.', 'err');
        return null;
      }
      rec.rank = rk;
    }
    if (g.cat) {
      var ctEl = U.$('#people-cat');
      if (!ctEl) {
        U.toast('حقل التصنيف غير موجود في الشاشة — أُلغي الحفظ كي لا يُمحى التصنيف المخزَّن.', 'err');
        return null;
      }
      var ct = String(ctEl.value == null ? '' : ctEl.value);
      rec.cat = labelOf(CATS, ct) ? ct : '';      // '' مقبولة في cat (بلا قيد CHECK)
    }
    if (g.contact) {
      rec.phone = trimmed('#people-phone');
      rec.email = trimmed('#people-email');
    }
    if (g.photo) rec.photo = trimmed('#people-photo');

    return rec;
  }

  /* تنقّل داخليّ — نُعلم دالة الرسم أن الطلب منّا لا من الشريط الجانبي */
  function goSelf() { internal = true; IAQ.go(KEY); }

  function backToList() { mode = 'list'; editId = null; goSelf(); }

  /* ------------------------------- التسجيل ------------------------------- */

  IAQ.views.register(KEY, {
    label: 'الأعضاء والفريق',
    group: 'المحتوى',
    icon: '<circle cx="9.2" cy="8" r="3.3"/>' +
          '<path d="M3.4 19.2c0-3.3 2.6-5.6 5.8-5.6s5.8 2.3 5.8 5.6"/>' +
          '<path d="M16.2 5.4a3.3 3.3 0 0 1 0 6.4"/>' +
          '<path d="M17.6 13.9c1.9.6 3 2.2 3 4.3"/>',
    render: function (mount) {
      // الدخول من الشريط الجانبي يعيدنا دائمًا إلى القائمة، لا إلى نموذج قديم
      var self = internal; internal = false;
      if (mode === 'form' && !self) { mode = 'list'; editId = null; }
      return mode === 'form' ? renderForm(mount) : renderList(mount);
    }
  });

  /* ------------------------------- الإجراءات ------------------------------- */

  IAQ.on('people-grp', function (btn) {
    var g = gOf(btn.getAttribute('data-arg'));
    if (!g) { U.toast('مجموعة غير معروفة', 'err'); return; }
    grp = g.id; mode = 'list'; editId = null;
    goSelf();
  });

  IAQ.on('people-new', function () {
    mode = 'form'; editId = null; goSelf();
  });

  IAQ.on('people-edit', function (btn) {
    mode = 'form'; editId = btn.getAttribute('data-id'); goSelf();
  });

  IAQ.on('people-cancel', function () { backToList(); });

  IAQ.on('people-save', function (btn) {
    var g = gOf(btn.getAttribute('data-arg'));
    if (!g) { U.toast('مجموعة غير معروفة — أُلغي الحفظ.', 'err'); return; }

    // نفرّق بين «لا يوجد معرّف» (إضافة) و«معرّف موجود لكنه غير صالح» (نتوقّف).
    // بلا هذا التفريق يتحوّل التعديل إلى إضافة صفّ مكرّر بصمت.
    var id = btn.getAttribute('data-id');
    var n = null;
    if (id != null && id !== '') {
      n = toInt(id);
      if (n == null) { U.toast('معرّف غير صالح — أُلغي الحفظ.', 'err'); return; }
    }

    var rec = collect(g);
    if (!rec) return;

    if (n != null) {
      A.update('people', n, rec).then(function (rows) {
        if (!rows || !rows.length) {
          U.toast('لم يُحدَّث أي صفّ — تحقّق من صلاحياتك أو من وجود السجلّ.', 'warn');
          return;
        }
        return IAQ.audit('people.update', 'people', n).then(function () {
          U.toast('تم الحفظ' + reachMsg(rec.status));
          backToList();
        });
      }).catch(boom);
      return;
    }

    rec.grp = g.id;
    // قيد CHECK على rank لا يقبل '' — والمجموعات التي لا تحرّر الرتبة تأخذ 'member'
    if (!rec.rank) rec.rank = 'member';

    A.insert('people', rec, '*').then(function (rows) {
      var nid = rows && rows.length ? rows[0].id : null;
      if (nid == null) {
        // لا نعرف إن نجحت الإضافة: نُبقي النموذج ونحذّر من تكرار الحفظ
        U.toast('لم يُعَد سجلّ جديد — راجع القائمة قبل إعادة الحفظ كي لا يتكرّر الصفّ.', 'warn');
        return;
      }
      return IAQ.audit('people.create', 'people', nid).then(function () {
        U.toast('أُضيف الصفّ' + reachMsg(rec.status));
        backToList();
      });
    }).catch(boom);
  });

  IAQ.on('people-toggle', function (btn) {
    var n = toInt(btn.getAttribute('data-id'));
    if (n == null) { U.toast('معرّف غير صالح', 'err'); return; }
    var to = btn.getAttribute('data-arg') === 'published' ? 'published' : 'hidden';
    A.update('people', n, { status: to, updated_by: who() }).then(function (rows) {
      if (!rows || !rows.length) {
        U.toast('لم يُحدَّث أي صفّ — تحقّق من صلاحياتك.', 'warn');
        return;
      }
      return IAQ.audit('people.update', 'people', n).then(function () {
        // الإخفاء لا يعني الغياب دائمًا: مجموعة بلا صفٍّ «ظاهر» تُبقي البطاقات
        // المبنيّة من ملفات JSON كما هي (الحدّ الأول في تنبيه الشاشة).
        U.toast(to === 'published'
          ? 'صار الصفّ ظاهرًا — يراه الزائر في أوّل تحميل للصفحة'
          : 'أُخفي الصفّ في القاعدة — يغيب عن الزائر في أوّل تحميل ما لم تخلُ المجموعة من ' +
            'الصفوف «الظاهرة» (انظر الحدّين في تنبيه الشاشة)');
        IAQ.go(KEY);
      });
    }).catch(boom);
  });

  /* -------------------------------- الترتيب --------------------------------
     الترتيب هنا وعند الزائر واحد: order by sort asc, id asc. ولذلك تبديل
     قيمتَي جارَين لا يصحّ إلا إذا كانت كل القيم المقروءة متمايزة؛ فمع أي تساوٍ:
       • التبديل الحرفيّ بين متساويين لا يغيّر شيئًا (المعرّف هو الذي يحسم)،
       • وكتابة «قيمة الجار ± ١» تُقفز الصفّ فوق كل الصفوف المتساوية معه لا
         خطوةً واحدة، وقد تُنشئ قيمة مكرّرة جديدة مع الجار الأبعد فتُفسد ما بعدها.
     والتساوي ليس نادرًا: عمود sort افتراضه 100، فكل صفٍّ يُدخَل من خارج هذه
     الشاشة بلا قيمة صريحة يقع في التساوي نفسه.
     فالحلّ: إن كانت القيم متمايزة بدّلنا قيمتين فقط؛ وإلا سألنا المدير ثم
     أعدنا ترقيم الصفوف المقروءة بقيم متمايزة بخطوة STEP وفق الترتيب المطلوب.
     كل الكتابات متسلسلة (كتابة واحدة في كل مرّة) فلا تتسابق، وإن انقطعت
     أخبرنا بعدد ما كُتب فعلًا لا بعدد مُفترَض. ونقرأ من القاعدة قبل الحساب كي
     لا نحسب على نسخة قديمة عدّلها مديرٌ آخر. */

  var STEP = 10;

  /* قيمة ترتيب رقمية أو null. العمود not null default 100، لكن لا نفترض ذلك عند القراءة */
  function sortOf(r) {
    if (r == null || r.sort == null || r.sort === '') return null;
    var n = Number(r.sort);
    return isFinite(n) ? n : null;
  }
  function allDistinct(list) {
    var seen = {}, i, v;
    for (i = 0; i < list.length; i++) {
      v = sortOf(list[i]);
      if (v == null) return false;
      if (seen['v' + v]) return false;
      seen['v' + v] = true;
    }
    return true;
  }
  function nameOf(r) { return txt(r && r.name) || ('#' + (r && r.id)); }

  /* كتابة الخطّة صفًّا صفًّا — الوعد يُرجع عدد الصفوف التي كُتبت فعلًا */
  function writeSeq(plan, w, k, ok) {
    if (k >= plan.length) return Promise.resolve(ok);
    var it = plan[k];
    return A.update('people', it.id, { sort: it.sort, updated_by: w }).then(function (rs) {
      if (!rs || !rs.length) {
        throw new Error('كُتب ' + F.num(ok) + ' من ' + F.num(plan.length) + ' صفًّا ثم توقّف ' +
          'الترتيب عند «' + F.cut(it.name, 24) + '» — لم يُحدَّث ذلك الصفّ، تحقّق من صلاحية ' +
          'الكتابة ثم راجع القائمة المقروءة من القاعدة.');
      }
      return writeSeq(plan, w, k + 1, ok + 1);
    });
  }

  function applyPlan(plan, anchorId, w) {
    var total = plan.length;
    return writeSeq(plan, w, 0, 0).then(function (done) {
      IAQ.audit('people.reorder', 'people', anchorId);
      U.toast('تغيّر الترتيب في القاعدة (' + F.num(done) + ' من ' + F.num(total) +
        ' صفًّا كُتبت) — ويظهر بترتيبه الجديد للزائر عند أوّل تحميل للصفحة');
      mode = 'list'; editId = null;
      IAQ.go(KEY);
    }, function (e) {
      /* فشل جزئيّ: نُعيد القراءة كي يرى المدير ما استقرّ فعلًا، ثم نُظهر الخطأ */
      mode = 'list'; editId = null;
      IAQ.go(KEY);
      throw e;
    });
  }

  function move(id, dir) {
    var n = toInt(id);
    if (n == null) { U.toast('معرّف غير صالح', 'err'); return; }
    var g = gOf(grp) || GROUPS[0];
    var w = who();

    A.select('people', 'select=id,sort,name&grp=eq.' + g.id + '&order=sort.asc,id.asc')
      .then(function (rows) {
        rows = rows || [];
        var i = -1, k;
        for (k = 0; k < rows.length; k++) {
          if (Number(rows[k].id) === n) { i = k; break; }
        }
        if (i < 0) {
          U.toast('لم يُعَد هذا الصفّ في هذه المجموعة — حدّث الشاشة ثم أعد المحاولة.', 'warn');
          return null;
        }
        var j = i + dir;
        /* حراسة ثانية عند التنفيذ: الشاشة قد تكون رُسمت قبل تغيير غيرك */
        if (j < 0) { U.toast('هذا الصفّ في أوّل القائمة المقروءة', 'warn'); return null; }
        if (j >= rows.length) { U.toast('هذا الصفّ في آخر القائمة المقروءة', 'warn'); return null; }

        var a = rows[i], b = rows[j], plan = [];

        /* القيم متمايزة: تبديل قيمتين يكفي، وكتابتان متسلسلتان لا متوازيتان */
        if (allDistinct(rows)) {
          plan.push({ id: a.id, name: nameOf(a), sort: sortOf(b) });
          plan.push({ id: b.id, name: nameOf(b), sort: sortOf(a) });
          return applyPlan(plan, a.id, w);
        }

        /* الترتيب المطلوب: نفس القائمة وقد تبادل الصفّان موضعيهما */
        var ord = rows.slice(0);
        ord[i] = b; ord[j] = a;
        for (k = 0; k < ord.length; k++) {
          if (sortOf(ord[k]) !== STEP * (k + 1)) {
            plan.push({ id: ord[k].id, name: nameOf(ord[k]), sort: STEP * (k + 1) });
          }
        }
        if (!plan.length) {
          U.toast('لا شيء يُكتب — ترتيب القاعدة مطابق للمطلوب أصلًا.', 'warn');
          return null;
        }
        return U.ask('قيم الترتيب في هذه المجموعة متساوية أو ناقصة، فتحريك صفٍّ واحد يقتضي ' +
          'إعادة ترقيم ' + F.num(plan.length) + ' صفًّا من ' + F.num(rows.length) +
          ' صفًّا مقروءًا، بقيم متمايزة بخطوة ' + F.num(STEP) + '، كتابةً بعد كتابة. ' +
          'هذا يغيّر عمود sort في تلك الصفوف ولا يمسّ بياناتها الأخرى. أتابع؟',
          'أعد الترقيم').then(function (okAsk) {
          if (!okAsk) return null;
          return applyPlan(plan, a.id, w);
        });
      }).catch(boom);
  }

  IAQ.on('people-up', function (btn) { move(btn.getAttribute('data-id'), -1); });
  IAQ.on('people-down', function (btn) { move(btn.getAttribute('data-id'), 1); });

  IAQ.on('people-del', function (btn) {
    var n = toInt(btn.getAttribute('data-id'));
    if (n == null) { U.toast('معرّف غير صالح', 'err'); return; }
    U.ask('سيُحذف هذا الشخص من قاعدة البيانات نهائيًا. هل تريد المتابعة؟', 'حذف')
      .then(function (ok) {
        if (!ok) return;
        return A.remove('people', n).then(function (rows) {
          if (!rows || !rows.length) {
            U.toast('لم يُحذف أي صفّ — قد لا تملك صلاحية الحذف أو السجلّ غير موجود.', 'warn');
            return;
          }
          return IAQ.audit('people.delete', 'people', n).then(function () {
            U.toast('حُذف الصفّ من القاعدة — يتحدّث القسم عند أوّل تحميل ما لم تخلُ المجموعة من ' +
              'الصفوف «الظاهرة» (انظر الحدّين في تنبيه الشاشة)');
            mode = 'list'; editId = null;
            IAQ.go(KEY);
          });
        });
      }).catch(boom);
  });

})();

/* ===== 30-partners.js ===== */
/* ============================================================================
   شريط الشركاء — نمط حركة شريط الشعارات في الصفحة الرئيسة، وسرعة دورته.

   الحالة المخزَّنة صفّان فقط في جدول settings:
     partners_strip_mode   : "auto" | "manual" | "fade"
     partners_strip_speed  : عدد ثوانٍ (الافتراضي 34)
   العمود value من نوع jsonb، فالقيمة تصل مُفكَّكة أصلًا (نصّ أو عدد) وتُرسل خامًا.

   حقائق تحقّقتُ منها من مصدر الموقع نفسه — الواجهة تقولها كما هي بلا مبالغة:
   • src/templates/iaq-runtime.js يقرأ settings?select=key,value&is_public=is.true
     وfooter.html يطبّق partners_strip_mode فعليًّا وقت العرض — بلا إعادة بناء.
   • التوقيت الحقيقي: الطبقة تسأل الخدمة عند كل تحميل صفحة (فورًا إن تجاوز عمر
     النسخة المحليّة خمس دقائق، وإلا بعد 1.5 ثانية من التحميل)، ولا يوجد
     استقصاء دوريّ بعد ذلك — فالصفحة المفتوحة بلا إعادة تحميل لا تتبدّل أبدًا.
     لذلك نقول «عند أوّل تحميل» لا «خلال خمس دقائق».
   • النسخة المحليّة (localStorage، TTL = 300000) تُطبَّق قبل وصول الجواب، فقد
     يلمح زائر عائد النمط السابق لجزء من الثانية ثم يُصحَّح في التحميل نفسه.
   • partners_strip_speed لا تقرؤه صفحات الموقع بعد: مدّة الدورة مثبَّتة على
     ‎--mq-speed:34s‎ في src/templates/head.html. نقولها صريحةً بدل الإيهام.
   • الشريط موجود في قسم «شركاء النجاح» بالصفحة الرئيسة فقط (id=partnersMarquee
     في index.html وحدها).
   • الشعارات نفسها تُبنى من src/data/partners.json وقت التوليد — غير قابلة
     للتعديل من هنا بعد.
   • updated_at يُحدَّث تلقائيًّا بمُطلِق settings_touch، فتاريخ «آخر تحديث»

(function () {
  'use strict';
  var U = IAQ.ui, F = IAQ.fmt, A = IAQ.api;

  var K_MODE = 'partners_strip_mode';
  var K_SPEED = 'partners_strip_speed';
  /* الوصفان مطابقان لما زُرع في مخطّط قاعدة البيانات كي لا يُستبدل بنصّ آخر */
  var L_MODE = 'نمط حركة شريط الشركاء: auto متصل | manual يدوي | fade تلاشي';
  var L_SPEED = 'مدّة دورة الشريط المتصل بالثواني (أكبر = أبطأ)';

  var DEF_SPEED = 34, MIN_SPEED = 18, MAX_SPEED = 70;
  var CSS_SPEED = 34;                 // القيمة المثبَّتة فعلًا في تنسيقات البناء

  var MODES = [
    { id: 'auto',   name: 'شريط متصل',      desc: 'تدفّق دائري لا ينقطع، يتوقّف عند مرور المؤشّر' },
    { id: 'manual', name: 'تحريك يدوي',     desc: 'يسحبه الزائر بإصبعه أو بالأسهم، بلا حركة تلقائية' },
    { id: 'fade',   name: 'تبديل بالتلاشي', desc: 'مجموعات تتبدّل بهدوء كل أربع ثوانٍ ونصف' }
  ];

  function modeById(id) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i];
    return null;
  }
  function clamp(n) {
    n = Math.round(Number(n));
    if (!isFinite(n)) return DEF_SPEED;
    if (n < MIN_SPEED) return MIN_SPEED;
    if (n > MAX_SPEED) return MAX_SPEED;
    return n;
  }

  /* عدد فقط: jsonb قد يصل null أو نصًّا فارغًا، و Number(null) = 0 وهو ليس صفرًا
     مقصودًا — لو قبلناه لعرضنا 18 ث وادّعينا أنها المخزَّنة. */
  function numOf(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (typeof v === 'string' && v.replace(/\s+/g, '') !== '') {
      var n = Number(v);
      return isFinite(n) ? n : null;
    }
    return null;
  }

  /* المقروء من القاعدة (db) مقابل اختيار المدير قبل الحفظ (sel).
     hasMode/hasSpeed = وُجد الصفّ فعلًا، تمييزًا عن صفّ موجود بقيمة فارغة. */
  function blank() {
    return { any: false, hasMode: false, hasSpeed: false, mode: null, speed: null, at: null, by: '' };
  }
  var db = blank();
  var sel = { mode: null, speed: DEF_SPEED };

  /* ------------------------------ قراءة الحالة ------------------------------ */
  function load() {
    return A.select('settings',
      'select=key,value,updated_at,updated_by&key=in.(' + K_MODE + ',' + K_SPEED + ')'
    ).then(function (rows) {
      db = blank();
      (rows || []).forEach(function (r) {
        if (r.key === K_MODE) {
          db.any = true; db.hasMode = true;
          db.mode = (r.value === null || r.value === undefined || r.value === '') ? null : String(r.value);
          db.at = r.updated_at || null;
          db.by = r.updated_by || '';
        } else if (r.key === K_SPEED) {
          db.any = true; db.hasSpeed = true;
          db.speed = numOf(r.value);
        }
      });
      /* المزامنة عند كل دخول للشاشة: ما نعرضه مبدئيًّا هو المخزَّن لا التخمين */
      sel.mode = modeById(db.mode) ? db.mode : null;
      sel.speed = db.speed == null ? DEF_SPEED : clamp(db.speed);
    });
  }

  function isDirty() {
    if (!db.any) return true;
    /* صفّ ناقص أو قيمة لا يعرفها الموقع = لا يزال بحاجة حفظ، فلا ندّعي أنّه محفوظ */
    if (!modeById(db.mode)) return true;
    if (sel.mode !== db.mode) return true;
    if (db.speed == null) return true;
    return clamp(db.speed) !== clamp(sel.speed);
  }
  function dirtyText() {
    if (!db.any) return 'لا شيء محفوظ في قاعدة البيانات بعد';
    if (!modeById(db.mode)) return 'المخزَّن غير صالح — يحتاج حفظًا';
    return isDirty() ? 'تغييرات لم تُحفظ' : 'كل التغييرات محفوظة';
  }

  /* -------------------------------- الرسم -------------------------------- */
  function optCard(m) {
    var picked = sel.mode === m.id;
    var live = db.any && db.mode === m.id;
    return '<div class="stat-box' + (picked ? ' accent' : '') + '" data-act="partnersPick" data-arg="' +
      U.esc(m.id) + '" role="button" tabindex="0" aria-pressed="' + (picked ? 'true' : 'false') +
      '" style="cursor:pointer">' +
      '<div class="sb-top"><div class="sb-val" style="font-size:1.12rem">' + U.esc(m.name) + '</div>' +
      (live ? '<span class="chip">مُطبَّق الآن</span>' : '') + '</div>' +
      '<div class="sb-label" style="margin-top:6px;line-height:1.75">' + U.esc(m.desc) + '</div>' +
      '<div class="mono small" style="margin-top:8px">' + U.esc(m.id) + '</div></div>';
  }

  function markup() {
    var h = U.head('شريط الشركاء', 'طريقة حركة شريط شعارات الشركاء في قسم «شركاء النجاح» بالصفحة الرئيسة');

    if (!db.any) {
      h += U.notice('<b>لم تُقرأ أي قيمة مخزَّنة لشريط الشركاء.</b><br>' +
        'إمّا أنّ الصفّين غير موجودين في جدول <span class="mono">settings</span>، أو أنّ سياسات الحماية ' +
        'لا تسمح لحسابك بقراءتهما — القراءة الممنوعة ترجع فارغة بلا خطأ، فلا نستطيع التمييز بينهما. ' +
        'الصفحات في هذه الحالة تعمل بالنمط الابتدائي المبنيّ من ' +
        '<span class="mono">partners.json → strip_mode</span> (وهو «شريط متصل» ما لم يُغيَّر). ' +
        'الحفظ من هنا سيُنشئ الصفّين إن كانت لديك صلاحية الكتابة.');
    } else if (!db.hasMode) {
      h += U.notice('<b>صفّ النمط غير موجود</b> — قرأنا صفّ السرعة وحده من جدول ' +
        '<span class="mono">settings</span>. الصفحة الرئيسة تعمل الآن بالنمط الابتدائي المبنيّ من ' +
        '<span class="mono">partners.json → strip_mode</span> («شريط متصل»). ' +
        'اختر نمطًا واحفظ لإنشاء الصفّ.');
    } else if (!modeById(db.mode)) {
      h += U.notice('<b>الصفّ موجود لكن قيمته لا يعرفها الموقع:</b> <span class="mono">' +
        U.esc(db.mode === null ? 'null' : db.mode) + '</span> — ' +
        'صفحات الموقع تتجاهلها وتعود إلى «شريط متصل». اختر نمطًا صحيحًا واحفظ لتصحيح الصفّ.');
    }

    /* ما يحدث فعلًا عند الحفظ — مطابق لسلوك iaq-runtime.js، بلا وعد بأكثر منه */
    h += U.notice('<b>ما يحدث عند الحفظ:</b> النمط يُخزَّن في جدول <span class="mono">settings</span>، ' +
      'وطبقة التشغيل في صفحات الموقع تقرأ الإعدادات العلنية من قاعدة البيانات وتطبّق النمط ' +
      'عند العرض — بلا إعادة بناء ولا نشر. ' +
      'يراه الزائر في أوّل تحميل للصفحة الرئيسة بعد الحفظ؛ أمّا صفحة مفتوحة أمامه الآن فلا تتبدّل ' +
      'من نفسها، لأنّ الطبقة تسأل الخدمة عند التحميل فقط ولا تستقصيها بعده. ' +
      'وزائر عائد قد يلمح النمط السابق لجزء من الثانية (نسخة محليّة عمرها خمس دقائق تُطبَّق قبل ' +
      'وصول الجواب) ثم يُصحَّح تلقائيًّا في التحميل نفسه.', 'ok');

    var live = modeById(db.mode);
    var meta = '<div class="prow"><span class="muted">النمط المخزَّن الآن:</span>' +
      '<b>' + U.esc(live ? live.name : 'غير محدّد') + '</b>' +
      (db.at ? '<span class="muted small">آخر تحديث ' + U.esc(F.date(db.at)) +
        (db.by ? ' — ' + U.esc(db.by) : '') + '</span>' : '') + '</div>';

    h += U.card('اختر نمط الحركة',
      '<div class="qa-grid">' + MODES.map(optCard).join('') + '</div>' + meta);

    h += U.card('سرعة الشريط المتصل',
      '<div class="fld"><label for="partners-speed">مدّة الدورة الكاملة بالثواني ' +
      '(' + U.esc(String(MIN_SPEED)) + '–' + U.esc(String(MAX_SPEED)) + ')</label>' +
      '<input type="range" id="partners-speed" min="' + MIN_SPEED + '" max="' + MAX_SPEED +
      '" step="2" value="' + clamp(sel.speed) + '"></div>' +
      '<div class="prow"><b class="mono" id="partners-speed-val">' + clamp(sel.speed) + ' ث</b>' +
      '<span class="muted small">القيمة الأكبر = حركة أبطأ. تخصّ نمط «شريط متصل» وحده، ' +
      'ولا أثر لها في «تحريك يدوي» أو «تبديل بالتلاشي».</span></div>' +
      U.notice('<b>بصراحة:</b> هذه القيمة تُحفظ في قاعدة البيانات، لكنّ صفحات الموقع ' +
        '<u>لا تقرؤها بعد</u>: مدّة الدورة مثبَّتة على ' + U.esc(String(CSS_SPEED)) + ' ثانية داخل تنسيقات ' +
        'البناء (<span class="mono">--mq-speed</span>). حفظها اليوم لا يغيّر سرعة الشريط عند الزائر، ' +
        'وستعمل حين تُربط الصفحات بها. أمّا النمط أعلاه فيُطبَّق فعليًّا.'));

    h += '<div class="btnbar"><span class="muted small" id="partners-dirty" style="margin-inline-end:auto">' +
      U.esc(dirtyText()) + '</span>' +
      '<button class="btn ghost" data-act="partnersReload">إعادة القراءة من القاعدة</button>' +
      '<button class="btn ghost" data-act="partnersUndo">تراجع</button>' +
      '<button class="btn ok" data-act="partnersSave">حفظ الإعداد</button></div>';

    h += U.card('شعارات الشركاء',
      '<p class="muted" style="line-height:1.9">أسماء الشركاء وشعاراتهم وروابطهم تُبنى من الملف ' +
      '<span class="mono">src/data/partners.json</span> عند توليد الموقع، والصور في ' +
      '<span class="mono">site/img/partners/</span>. لا يمكن إضافة شريك أو حذفه أو تبديل شعاره من هذه ' +
      'اللوحة بعد — يُعدَّل الملف ثم يُعاد البناء والنشر. هذه الشاشة تتحكّم في طريقة الحركة فقط.</p>');

    return h;
  }

  /* قراءة المنزلقة وقت الحاجة: متصفّحات قديمة لا تُطلق input على input[type=range]
     بل change وحده، فلا نعتمد على الحدث لمعرفة القيمة الحالية. */
  function readSpeedInput() {
    var el = U.$('#partners-speed');
    if (el) sel.speed = clamp(el.value);
    return sel.speed;
  }

  function repaint() {
    var m = U.$('#viewArea');
    if (!m) return;
    readSpeedInput();                 // كي لا يُمحى ما سحبه المدير عند إعادة الرسم
    m.innerHTML = markup();
  }

  /* ------------------------------- التسجيل ------------------------------- */
  IAQ.views.register('partners', {
    label: 'شريط الشركاء',
    group: 'الموقع',
    icon: '<rect x="2.5" y="8" width="5.5" height="8" rx="1.6"/>' +
          '<rect x="10.5" y="8" width="5.5" height="8" rx="1.6"/>' +
          '<path d="M19 8v8M22 10.5v3"/>',
    render: function (mount) {
      return load().then(function () {
        mount.innerHTML = markup();
      });
    }
  });

  /* ------------------------------- الإجراءات ------------------------------- */
  IAQ.on('partnersPick', function (btn) {
    var id = btn.getAttribute('data-arg');
    if (!modeById(id)) { U.toast('نمط غير معروف', 'err'); return; }
    sel.mode = id;
    repaint();
  });

  IAQ.on('partnersUndo', function () {
    var had = db.any && (modeById(db.mode) || db.speed != null);
    sel.mode = modeById(db.mode) ? db.mode : null;
    sel.speed = db.speed == null ? DEF_SPEED : clamp(db.speed);
    var m = U.$('#viewArea');
    if (m) m.innerHTML = markup();   // بلا readSpeedInput: التراجع يتخلّص من قيمة المنزلقة
    U.toast(had ? 'أُعيدت القيم المخزَّنة' : 'لا شيء مخزَّن — أُعيدت القيم الابتدائية');
  });

  IAQ.on('partnersReload', function () { IAQ.go('partners'); });

  IAQ.on('partnersSave', function (btn) {
    if (!sel.mode) { U.toast('اختر أحد الأنماط الثلاثة أولًا', 'warn'); return; }
    var sp = clamp(readSpeedInput());
    var who = (IAQ.me && IAQ.me.email) || null;

    btn.disabled = true;
    A.upsert('settings', [
      { key: K_MODE,  value: sel.mode, label: L_MODE,  is_public: true, updated_by: who },
      { key: K_SPEED, value: sp,       label: L_SPEED, is_public: true, updated_by: who }
    ], 'key').then(function (rows) {
      if (!rows || !rows.length) {
        throw new Error('لم تُرجع القاعدة أي صفّ — لم يُحفظ شيء. تأكّد من صلاحية الكتابة.');
      }
      IAQ.audit('settings.update', 'settings', K_MODE);
      U.toast('حُفظ النمط — يظهر للزائر عند أوّل تحميل للصفحة الرئيسة', 'ok');
      IAQ.go('partners');
    })['catch'](function (e) {
      btn.disabled = false;
      U.toast(e.message || 'فشل الإجراء', 'err');
    });
  });

  /* مستمعون على مستوى المستند فقط — لا نربط شيئًا بعناصر نرسمها ثم نمحوها.
     input و change معًا: المتصفّحات القديمة تُطلق change وحده على المنزلقة. */
  function onSpeed(e) {
    var t = e.target;
    if (!t || t.id !== 'partners-speed') return;
    sel.speed = clamp(t.value);
    var v = U.$('#partners-speed-val');
    if (v) v.textContent = sel.speed + ' ث';
    var d = U.$('#partners-dirty');
    if (d) d.textContent = dirtyText();
  }
  document.addEventListener('input', onSpeed);
  document.addEventListener('change', onSpeed);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    var t = (e.target && e.target.closest) ? e.target.closest('[data-act="partnersPick"]') : null;
    if (!t) return;
    e.preventDefault();
    t.click();
  });
})();

/* ============================================================================

     الطلب بلا صفوف أو سقطت الشبكة بقي الشريط الثابت كما هو — الطبقة لا تُفرّغ
     الشريط أبدًا؛ والعنصر #partnersTrack موجود في site/index.html وحدها.
   • النسخة الثابتة تُبنى وقت التوليد من src/data/partners.json عبر build.py،

   • شاشة «شريط الشركاء» (30-partners.js) تضبط نمط حركة الشريط في جدول settings
     (والسرعة تُخزَّن هناك لكن صفحات الموقع لا تقرؤها بعد) — شأن آخر لا يخصّ
     محتوى هذه القائمة.

     فنُرسل نصًّا فارغًا لا null. و sort من نوع int not null default 100،

(function () {

  /* ------------------------------ أدوات صغيرة ------------------------------ */

  /* معرّف صحيح موجب أو null — لا نبني استعلامًا بمعرّف لم يُتحقّق منه */
  function toInt(v) {
    var n = Number(v);
    if (!isFinite(n) || n <= 0 || Math.floor(n) !== n) return null;
    return n;
  }
  function val(sel) {
    var el = U.$(sel);
    return el ? String(el.value == null ? '' : el.value) : '';
  }
  function trimmed(sel) { return val(sel).replace(/^\s+|\s+$/g, ''); }
  function msg(e) { return (e && e.message) ? e.message : 'فشل الإجراء'; }
  function boom(e) { U.toast(msg(e), 'err'); }
  function who() { return (IAQ.me && IAQ.me.email) || null; }
  function nameOf(r) { return String((r && r.name) || ''); }

  function statusText(s) {
    for (var i = 0; i < STATUS.length; i++) if (STATUS[i].v === s) return STATUS[i].t;
    return String(s == null ? '—' : s);
  }
  function statusOk(s) {
    for (var i = 0; i < STATUS.length; i++) if (STATUS[i].v === s) return true;
    return false;
  }

  /* الشعار يقبل شكلين: اسم ملف مجرّد يُحلّ على img/partners/، أو رابطًا كاملًا */
  function isUrl(s) { return /^(?:https?:)?\/\//i.test(String(s || '')); }
  function logoSrc(logo) { return isUrl(logo) ? String(logo) : DIR + String(logo); }

  /* اسم لاتينيّ آمن لمفتاح الكائن — الاسم العربيّ يصبح فارغًا بعد التنقية
     فنستعمل بديلًا محايدًا بدل مفتاح مكوّن من نسب مئوية طويلة */
  function asciiSlug(name) {
    var base = String(name == null ? '' : name).replace(/\.[A-Za-z0-9]{1,6}$/, '');
    var s = base.replace(/[^A-Za-z0-9]+/g, '-').replace(/-+/g, '-')
                .replace(/^-/, '').replace(/-$/, '').toLowerCase();
    if (s.length > 48) s = s.slice(0, 48).replace(/-$/, '');
    if (s.length < 2) s = 'logo';
    return s;
  }
  function extOf(f) {
    var m = /\.([A-Za-z0-9]{1,6})$/.exec(String(f.name || ''));
    var e = m ? m[1].toLowerCase() : '';
    if (e === 'jpeg') e = 'jpg';
    if (IMG_EXT[e]) return e;
    return MIME_EXT[String(f.type || '').toLowerCase()] || '';
  }

  function idxIn(list, id) {
    var s = String(id);
    for (var i = 0; i < list.length; i++) if (String(list[i].id) === s) return i;
    return -1;
  }
  /* قيمة ترتيب رقمية أو null. المخطّط يجعل sort not null default 100،
     فالفرع الفارغ دفاعيّ فقط لقاعدة أُنشئت بمخطّط أقدم. */
  function sortOf(r) {
    if (r == null || r.sort == null || r.sort === '') return null;
    var n = Number(r.sort);
    return isFinite(n) ? Math.round(n) : null;
  }
  /* هل كل قيم الترتيب في النافذة موجودة ومتمايزة؟ إن كانت كذلك فالترتيب محسومٌ
     بالقيمة وحدها، ويكفي تبديل قيمتَي جارين. */
  function allDistinct(list) {
    var seen = {}, i, v, k;
    for (i = 0; i < list.length; i++) {
      v = sortOf(list[i]);
      if (v == null) return false;
      k = 'k' + v;
      if (seen[k]) return false;
      seen[k] = 1;
    }
    return true;
  }

          'القراءة الممنوعة ترجع نتيجة فارغة لا رسالة خطأ.') +

  IAQ.on('partnerlist-save', function (btn) {
    /* نفرّق بين «لا يوجد معرّف» (إضافة) و«معرّف موجود لكنه غير صالح» (نتوقّف)،
       فبلا هذا التفريق يتحوّل التعديل إلى إضافة صفّ مكرّر بصمت. */
    var id = btn.getAttribute('data-id');
    var n = null;
    if (id != null && id !== '') {

    }

    var name = trimmed('#partnerlist-name');

      inlineErr('اسم الشريك مطلوب.',
        'اكتب اسم الشريك كما يظهر في تلميح الشعار على الموقع ثم أعد الحفظ. ' +
        'لم يُكتب شيء في قاعدة البيانات.');

    var st = val('#partnerlist-status');

        'أعد اختيار الحالة — لم يُحفظ شيء.');

      return;
    }
    /* الطبقة الحيّة تضع قيمة url في خاصية href على الصفحة الرئيسة، فلا نمرّر
       مخطّطًا آخر (مثل javascript:) إلى صفحة يراها الزائر. */
    var link = trimmed('#partnerlist-url');
    if (link && !/^https?:\/\//i.test(link)) {
      inlineErr('رابط الشريك غير مقبول.',
        'يجب أن يبدأ بـ https:// أو http://، أو يُترك فارغًا. ' +
        'هذه القيمة تُوضع كما هي في وصلة الشعار على الصفحة الرئيسة، ' +
        'فلا نقبل غير هذين المخطّطين. لم يُكتب شيء في قاعدة البيانات.');
      U.toast('رابط الشريك يجب أن يبدأ بـ https:// أو http://', 'err');
      return;
    }
    inlineErr('', '');                       // نمحو خطأ محاولة سابقة

    /* logo و url من نوع text not null default '' — نُرسل نصًّا فارغًا لا null */
    var rec = {
      name: name,
      logo: trimmed('#partnerlist-logo'),
      url: link,
      status: st,
      updated_by: who()
    };
    var live = (st === 'published');

    if (n != null) {
      /* updated_at يضعه مُطلِق partners_touch — لا نرسله كي لا نكتب وقتًا من المتصفّح */
      A.update(TBL, n, rec).then(function (rs) {
        if (!rs || !rs.length) {
          U.toast('لم يُحدَّث أي صفّ — تحقّق من صلاحياتك أو من وجود السجلّ.', 'warn');

        return IAQ.audit('partners.update', TBL, n).then(function () {
          U.toast(live
            ? 'حُفظت التعديلات — وتظهر في شريط الصفحة الرئيسة عند أوّل تحميل لها'

          ? 'أُضيف الشريك — ويظهر في شريط الصفحة الرئيسة عند أوّل تحميل لها'
          : 'أُضيف الشريك — وحالته غير منشورة فلا يراه الزائر');
        backToList();

  /* -------------------------------- الترتيب --------------------------------
     الترتيب في الشريط الحيّ وفي هذه الشاشة واحد: order by sort asc, id asc.
     ولذلك تبديل قيمتَي جارين لا يكون صحيحًا إلا إذا كانت كل القيم المُحمَّلة
     موجودة ومتمايزة؛ فمع أي تساوٍ:
       • التبديل الحرفيّ بين متساويين لا يغيّر شيئًا،
       • وكتابة «قيمة الجار ± ١» تقفز بالبطاقة فوق كل الصفوف المتساوية معها
         (بل فوق جار مختلف القيمة أيضًا)، وتُنشئ قيمًا مكرّرة تُفسد ما بعدها.
     فالحلّ: إن كانت القيم متمايزة بدّلنا قيمتين فقط؛ وإلا سألنا المدير ثم
     أعدنا ترقيم الصفوف المُحمَّلة بقيم متمايزة بخطوة STEP وفق الترتيب المطلوب.
     كل الكتابات متسلسلة (كتابة واحدة في كل مرّة) فلا تتسابق، وإن انقطعت
     أخبرنا بعدد ما كُتب فعلًا لا بعدد مُفترَض. ونقرأ الصفوف من القاعدة قبل
     الحساب كي لا نحسب على نسخة قديمة عدّلها مديرٌ آخر. */

  /* كتابة الخطّة صفًّا صفًّا — الوعد يُرجع عدد الصفوف التي كُتبت فعلًا */
  function writeSeq(plan, w, k, ok) {
    if (k >= plan.length) return Promise.resolve(ok);
    var it = plan[k];
    return A.update(TBL, it.id, { sort: it.sort, updated_by: w }).then(function (rs) {
      if (!rs || !rs.length) {
        throw new Error(stopMsg(ok, plan.length, it) +
          ' لم يُحدَّث ذلك الصفّ — تحقّق من صلاحية الكتابة، ثم أعد القراءة من القاعدة.');
      }
      return writeSeq(plan, w, k + 1, ok + 1);
    }, function (e) {
      /* حتى الخطأ القادم من الخدمة يُنسب إلى موضعه: كم صفًّا كُتب قبله وأين توقّف */
      var err = new Error(stopMsg(ok, plan.length, it) + ' ' + msg(e));
      if (e && e.status) err.status = e.status;
      throw err;
    });
  }
  function stopMsg(ok, total, it) {
    return (ok ? ('كُتب ' + F.num(ok) + ' من ' + F.num(total) + ' صفًّا')
               : 'لم يُكتب أي صفّ') +
      ' ثم توقّف الترتيب عند «' + F.cut(it.name || ('#' + it.id), 24) + '».';
  }

  function applyPlan(plan, anchorId, w) {
    var total = plan.length;
    return writeSeq(plan, w, 0, 0).then(function (done) {
      IAQ.audit('partners.reorder', TBL, anchorId);
      U.toast('تغيّر الترتيب في القاعدة (' + F.num(done) + ' من ' + F.num(total) +
        ' صفًّا كُتبت) — ويظهر بترتيبه الجديد في شريط الصفحة الرئيسة عند أوّل تحميل لها');
      backToList();
    }, function (e) {
      /* فشل جزئيّ: نُعيد القراءة كي يرى المدير ما استقرّ فعلًا، ثم نُظهر الخطأ */
      backToList();
      throw e;
    });
  }

  IAQ.on('partnerlist-move', function (btn) {
    var n = toInt(btn.getAttribute('data-id'));
    if (n == null) { U.toast('معرّف غير صالح', 'err'); return; }
    var dir = btn.getAttribute('data-arg') === 'up' ? -1 : 1;
    var w = who();

    A.select(TBL, 'select=id,name,sort&order=sort.asc,id.asc&limit=' + LIM).then(function (rs) {
      var list = rs || [];
      var i = idxIn(list, n);
      if (i < 0) {
        U.toast('هذا الصفّ لم يعد في الصفوف المقروءة — أعد القراءة من القاعدة.', 'warn');
        return null;
      }
      var j = i + dir;
      if (j < 0 || j >= list.length) {
        U.toast(dir < 0 ? 'البطاقة في أوّل القائمة المقروءة' : 'البطاقة في آخر القائمة المقروءة', 'warn');
        return null;
      }
      var a = list[i], b = list[j], k, plan = [];

      if (allDistinct(list)) {
        plan.push({ id: a.id, name: nameOf(a), sort: sortOf(b) });
        plan.push({ id: b.id, name: nameOf(b), sort: sortOf(a) });
        return applyPlan(plan, a.id, w);
      }

      /* الترتيب المطلوب: نفس القائمة وقد تبادل الصفّان موضعيهما */
      var ord = list.slice(0);
      ord[i] = b; ord[j] = a;

      /* نمشي على الترتيب المطلوب فنجعل القيم متزايدة تمامًا، محتفظين بكل قيمة
         تصلح كما هي — فلا نكتب إلا أقلّ عدد ممكن من الصفوف. والقيم المتزايدة
         تمامًا تجعل الترتيب صريحًا في العمود بلا اعتماد على فكّ التشابه بالمعرّف. */
      var prev = null, v;
      for (k = 0; k < ord.length; k++) {
        v = sortOf(ord[k]);
        if (v == null || (prev != null && v <= prev)) {
          v = (prev == null) ? STEP : prev + 1;
          plan.push({ id: ord[k].id, name: nameOf(ord[k]), sort: v });
        }
        prev = v;
      }
      if (!plan.length) {
        U.toast('لا شيء يُكتب — ترتيب القاعدة مطابق للمطلوب أصلًا.', 'warn');
        return null;
      }
      /* كتابة صفّين أو أقلّ تمضي مباشرة؛ وما زاد على ذلك يُسأل عنه أوّلًا كي لا
         يُفاجَأ المدير بكتابة في صفوف لم يلمسها */
      if (plan.length <= 2) return applyPlan(plan, a.id, w);
      return U.ask('قيم الترتيب في هذه القائمة متساوية أو ناقصة، فتحريك بطاقة واحدة يقتضي ' +
        'كتابة قيمة ترتيب جديدة في ' + F.num(plan.length) + ' صفًّا من ' + F.num(list.length) +
        ' صفًّا مقروءًا، واحدًا تلو الآخر، حتى تصير القيم متمايزة ويصير الترتيب صريحًا. ' +
        'هذا يغيّر العمود sort في تلك الصفوف ولا يمسّ بياناتها الأخرى. أتابع؟',
        'اكتب الترتيب').then(function (okAsk) {
        if (!okAsk) return null;
        return applyPlan(plan, a.id, w);
      });
    }).catch(boom);
  });

  /* ------------------------------ رفع الشعار ------------------------------
     لا معاملة (transaction) بين المستودع وقاعدة البيانات: نرفع أوّلًا، وإن فشل
     إدخال صفّ الوسائط أعدنا المستودع كما كان وقلنا بدقّة ما حدث. */
  function startUpload(input) {
    var f = (input.files && input.files.length) ? input.files[0] : null;
    if (!f) return;
    if (busy) {
      U.toast('هناك رفع جارٍ — انتظر انتهاءه ثم اختر الملف من جديد', 'warn');
      try { input.value = ''; } catch (eb) { }
      return;
    }

    var ext = extOf(f);
    if (!ext) {
      setUp('<span class="muted small">صيغة غير مدعومة — لم يُرفع شيء.</span>');
      U.toast('صيغة الصورة غير مدعومة. المسموح: png, jpg, webp, gif, svg, avif', 'err');
      try { input.value = ''; } catch (e0) { }
      return;
    }

    var path = 'partners/' + Date.now() + '-' + asciiSlug(f.name) + '.' + ext;
    busy = true;

    function done() {
      busy = false;
      try { input.value = ''; } catch (e1) { }   // كي يُطلق اختيار الملف نفسه الحدث مرّة أخرى
    }

    setUp('<span class="small">جارٍ رفع ' + U.esc(F.cut(String(f.name || ''), 40)) + ' …</span>' +
      '<span class="muted small">' + U.esc(F.bytes(f.size)) + '</span>');

    IAQ.storage.upload(BUCKET, path, f).then(function () {
      return A.insert('media', {
        bucket: BUCKET, storage_path: path, kind: 'image',
        title: String(f.name || path), alt: null, bytes: f.size
      }, '*').catch(function (err) {
        return IAQ.storage.remove(BUCKET, [path]).then(
          function (del) {
            throw new Error('رُفع الشعار لكن فشل حفظ سجلّه في جدول الوسائط (' + msg(err) + '). ' +
              ((del && del.length)
                ? 'وحُذف الملف المرفوع من المستودع، فلم يبقَ شيء معلّق.'
                : 'ولم يُحذف أي ملف من المستودع — تحقّق من المسار: ' + path));
          },
          function (e2) {
            throw new Error('رُفع الشعار وفشل حفظ سجلّه (' + msg(err) +
              ')، وتعذّر أيضًا حذف الملف المرفوع (' + msg(e2) + '). المسار: ' + path);
          }
        );
      });
    }).then(function (mrows) {
      if (!mrows || !mrows.length) {
        throw new Error('رُفع الشعار لكن القاعدة لم تُرجع صفّ وسائط، فلا يمكن تأكيد حفظ سجلّه. ' +
          'مسار الملف في المستودع: ' + path);
      }
      IAQ.audit('media.create', 'media', mrows[0].id);
      var url = IAQ.storage.publicUrl(BUCKET, path);
      var fld = U.$('#partnerlist-logo');
      if (!fld) {
        /* غادر المدير النموذج قبل انتهاء الرفع — لا نُخفي الرابط عنه */
        setUp('');
        U.toast('رُفع الشعار لكن حقل الشعار لم يعد معروضًا. الرابط: ' + url, 'warn');
        done();
        return;
      }
      fld.value = url;
      paintPrev(url);
      setUp('<span class="small">رُفع الشعار ووُضع رابطه الكامل في حقل الشعار.</span>' +
        '<span class="mono">' + U.esc(F.cut(url, 48)) + '</span>');
      U.toast('رُفع الشعار — اضغط الحفظ لتثبيت الرابط في صفّ الشريك');
      done();
    }).catch(function (e) {
      setUp('<span class="muted small">تعذّر الرفع — لم يتغيّر حقل الشعار.</span>');
      U.toast(msg(e), 'err');
      done();
    });
  }

  /* مستمع واحد على المستند: الشاشة تُعاد بالكامل، فلا نربط شيئًا بعنصر نرسمه */
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (!t || !t.tagName || String(t.tagName).toLowerCase() !== 'input') return;
    if (t.type !== 'file' || t.id !== 'partnerlist-file') return;
    startUpload(t);
  });

})();

/* ===== 40-news.js ===== */
/* ============================================================================
   وحدة الأخبار — إدارة كاملة لجدول public.news (إضافة، تعديل، نشر، حذف).

   ملاحظات مثبَّتة تخصّ هذا الجدول:
   • body عمود text[] — نُرسل مصفوفة JS حقيقية من النصوص (سطر = فقرة).
   • facts عمود jsonb — نُرسله مصفوفة كائنات {label, value}. عند القراءة قد يأتي
     null أو [] أو (في بيانات الموقع القديمة) مصفوفة أزواج [التسمية, القيمة]،
     والثلاثة مُعالَجة هنا.
   • القراءة الممنوعة بـRLS ترجع 200 ومصفوفة فارغة — لذلك لا نُسمّي غياب الصفوف
     خطأً، بل نعرض «لا توجد بيانات».
   • الحذف يمرّ عبر IAQ.api.remove (يتحقّق من المعرّف) وبعد تأكيد IAQ.ui.ask.
   • صفحة الأخبار في الموقع صفحة ثابتة تُبنى من src/data/news.json، فأيّ صفّ هنا
     لا يظهر للزوّار إلا بعد إعادة البناء والنشر — وهذا مُصرَّح به في الواجهة.
   ============================================================================ */
(function () {
  'use strict';

  var U = IAQ.ui, F = IAQ.fmt, A = IAQ.api;
  var KEY = 'news';

  /* حالة الشاشة داخل الوحدة — تُقرأ عند كل رسم لأن الشاشة تُعاد بالكامل */
  var mode = 'list';        // 'list' أو 'form'
  var flt = 'all';          // 'all' أو 'published' أو 'draft'
  var editId = null;        // معرّف الخبر عند التعديل، أو null للإضافة
  var internal = false;     // هل جاء الرسم من تنقّل داخليّ لهذه الوحدة؟

  var STATUS = [
    { v: 'draft', t: 'مسودّة' },
    { v: 'published', t: 'منشور' }
  ];

  var IC_EDIT = '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14.5 5.5l4 4"/>';
  var IC_UP = '<path d="M12 16V6"/><path d="M8 10l4-4 4 4"/><path d="M5 19h14"/>';
  var IC_DOWN = '<path d="M12 6v10"/><path d="M8 12l4 4 4-4"/><path d="M5 19h14"/>';
  var IC_DEL = '<path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/>';
  var IC_EYE = '<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/>';

  /* --------------------------- أدوات مساعدة صغيرة --------------------------- */

  /* معرّف صحيح موجب أو null — نتحقّق قبل بناء أي استعلام يحمل معرّفًا */
  function toInt(v) {
    var n = Number(v);
    if (!isFinite(n) || n <= 0 || Math.floor(n) !== n) return null;
    return n;
  }

  /* تاريخ بصيغة YYYY-MM-DD صالحة لحقل input[type=date] بلا انزلاق منطقة زمنية.
     يُعيد '' إن تعذّر التحليل — لأن قيمة غير قياسية في input[type=date] يتجاهلها
     المتصفّح بصمت (F.day تُعيد النصّ كما هو عند فشل التحليل). */
  function ymd(v) {
    if (!v) return '';
    var s = String(v);
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var d = F.day(s);
    return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : '';
  }

  /* للعرض فقط: لا نُخفي قيمة غير قياسية، نُظهرها كما جاءت من القاعدة */
  function dateText(v) {
    if (v == null || v === '') return '—';
    return ymd(v) || String(v);
  }

  function val(sel) {
    var el = U.$(sel);
    return el ? String(el.value == null ? '' : el.value) : '';
  }
  function trimmed(sel) { return val(sel).replace(/^\s+|\s+$/g, ''); }
  function orNull(s) { return s ? s : null; }

  function statusText(s) { return s === 'published' ? 'منشور' : 'مسودّة'; }
  function statusBadge(s) {
    return '<span class="stbadge ' + (s === 'published' ? 'rp' : 'nw') + '">' +
      U.esc(statusText(s)) + '</span>';
  }

  /* نصّ متعدّد الأسطر ← مصفوفة نصوص (عمود body من نوع text[]) */
  function linesToArray(t) {
    var parts = String(t || '').split(/\r?\n/), out = [], i, s;
    for (i = 0; i < parts.length; i++) {
      s = parts[i].replace(/^\s+|\s+$/g, '');
      if (s) out.push(s);
    }
    return out;
  }
  function arrayToLines(v) {
    if (v == null) return '';
    if (Object.prototype.toString.call(v) === '[object Array]') return v.join('\n');
    return String(v);
  }

  /* facts: من قاعدة البيانات ← أسطر «التسمية | القيمة» */
  function factsToLines(f) {
    if (!f || Object.prototype.toString.call(f) !== '[object Array]' || !f.length) return '';
    var out = [], i, it, l, v;
    for (i = 0; i < f.length; i++) {
      it = f[i];
      if (it == null) continue;
      l = ''; v = '';
      if (Object.prototype.toString.call(it) === '[object Array]') {
        l = it[0]; v = it[1];                       // شكل قديم: زوج [تسمية, قيمة]
      } else if (typeof it === 'object') {
        l = it.label; v = it.value;
      } else {
        l = it;
      }
      out.push(String(l == null ? '' : l) + ' | ' + String(v == null ? '' : v));
    }
    return out.join('\n');
  }
  /* أسطر «التسمية | القيمة» ← مصفوفة كائنات jsonb */
  function linesToFacts(t) {
    var parts = String(t || '').split(/\r?\n/), out = [], i, s, p;
    for (i = 0; i < parts.length; i++) {
      s = parts[i].replace(/^\s+|\s+$/g, '');
      if (!s) continue;
      p = s.indexOf('|');
      if (p < 0) out.push({ label: s, value: '' });
      else out.push({
        label: s.slice(0, p).replace(/^\s+|\s+$/g, ''),
        value: s.slice(p + 1).replace(/^\s+|\s+$/g, '')
      });
    }
    return out;
  }

  function boom(e) { U.toast((e && e.message) || 'فشل الإجراء', 'err'); }

  /* التنبيه الإلزاميّ: القاعدة ليست هي الموقع */
  function staticNotice() {
    return U.notice(
      '<b>هذه السجلّات تُخزَّن في قاعدة البيانات، ولا تظهر على الموقع فورًا.</b><br>' +
      'صفحة الأخبار في الموقع صفحة HTML ثابتة تُبنى من الملف <span class="mono">src/data/news.json</span> ' +
      'عبر <span class="mono">build.py</span>. إضافة خبر أو تعديله أو نشره هنا يغيّر القاعدة فقط، ' +
      'ويظهر للزوّار بعد إعادة البناء والنشر التاليَين. لا يوجد حتى الآن ربط تلقائي بين الجدول والملف.'
    );
  }

  /* ------------------------------ شاشة القائمة ------------------------------ */

  function fltBtn(v, t) {
    return '<button class="btn sm' + (flt === v ? ' ok' : '') + '" data-act="news-flt" data-arg="' +
      U.esc(v) + '">' + U.esc(t) + '</button>';
  }

  function renderList(mount) {
    var q = 'select=*&order=date.desc,id.desc&limit=100';
    if (flt === 'published' || flt === 'draft') q += '&status=eq.' + flt;

    return A.select('news', q).then(function (rows) {
      rows = rows || [];

      var bar = '<div class="filterbar">' +
        fltBtn('all', 'الكل') + fltBtn('published', 'منشور') + fltBtn('draft', 'مسودّة') +
        '</div>';

      var body;
      if (!rows.length) {
        body = U.empty(flt === 'all'
          ? 'لا توجد بيانات'
          : 'لا توجد بيانات بهذا التصنيف');
      } else {
        body = U.table(
          ['التاريخ', 'العنوان', 'التصنيف', 'الحالة', 'إجراءات'],
          rows.map(function (r) {
            var pub = r.status === 'published';
            var acts = '<div class="acts">' +
              U.iconBtn('news-view', IC_EYE, { id: r.id, sm: true, label: 'استعراض' }) +
              U.iconBtn('news-edit', IC_EDIT, { id: r.id, sm: true, label: 'تعديل' }) +
              U.iconBtn('news-toggle', pub ? IC_DOWN : IC_UP,
                { id: r.id, arg: pub ? 'draft' : 'published', sm: true,
                  label: pub ? 'إرجاع إلى مسودّة' : 'نشر' }) +
              U.iconBtn('news-del', IC_DEL, { id: r.id, sm: true, danger: true, label: 'حذف' }) +
              '</div>';
            return [
              '<span class="mono small">' + U.esc(dateText(r.date)) + '</span>',
              '<b>' + U.esc(F.cut(r.title, 72) || '(بلا عنوان)') + '</b>' +
                (r.lead ? '<br><span class="muted small">' + U.esc(F.cut(r.lead, 90)) + '</span>' : ''),
              r.tag ? '<span class="chip">' + U.esc(r.tag) + '</span>' : '<span class="muted">—</span>',
              statusBadge(r.status),
              acts
            ];
          })
        );
      }

      var foot = '<button class="btn" data-act="news-new">خبر جديد</button>';

      mount.innerHTML =
        U.head('الأخبار', 'إدارة أخبار الجمعية المخزَّنة في قاعدة البيانات') +
        staticNotice() + bar +
        U.card('السجلّات (' + F.num(rows.length) + ')', body, foot) +
        '<p class="muted small">يُعرض حتى 100 سجلّ مرتّبة من الأحدث تاريخًا. ' +
        'العدد أعلاه هو عدد الصفوف المُحمَّلة فعليًا، لا العدد الكلّي في الجدول.</p>';
    });
  }

  /* ------------------------------ شاشة النموذج ------------------------------ */

  function statusSelect(cur) {
    return '<select id="news-status">' + STATUS.map(function (s) {
      return '<option value="' + U.esc(s.v) + '"' + (cur === s.v ? ' selected' : '') + '>' +
        U.esc(s.t) + '</option>';
    }).join('') + '</select>';
  }

  function formHtml(r) {
    r = r || {};
    var isEdit = !!r.id;

    var g1 = '<div class="grid2">' +
      '<div class="fld"><label for="news-date">التاريخ</label>' +
        '<input type="date" id="news-date" value="' + U.esc(ymd(r.date)) + '"></div>' +
      '<div class="fld"><label for="news-tag">التصنيف</label>' +
        '<input type="text" id="news-tag" value="' + U.esc(r.tag || (isEdit ? '' : 'أخبار')) +
        '" placeholder="أخبار"></div>' +
      '</div>';

    var g2 = '<div class="fld"><label for="news-title">العنوان</label>' +
      '<input type="text" id="news-title" value="' + U.esc(r.title || '') +
      '" placeholder="عنوان الخبر"></div>' +
      '<div class="fld"><label for="news-lead">المقدّمة</label>' +
      '<textarea id="news-lead" placeholder="سطر تعريفي قصير يظهر تحت العنوان">' +
      U.esc(r.lead || '') + '</textarea></div>' +
      '<div class="fld"><label for="news-body">النصّ — فقرة في كل سطر</label>' +
      '<textarea id="news-body" style="min-height:200px" placeholder="فقرة أولى&#10;فقرة ثانية">' +
      U.esc(arrayToLines(r.body)) + '</textarea>' +
      '<span class="muted small">كل سطر يُخزَّن فقرة مستقلّة في العمود body، والأسطر الفارغة تُحذف.</span></div>' +
      '<div class="fld"><label for="news-facts">حقائق سريعة — سطر لكل عنصر بصيغة: التسمية | القيمة</label>' +
      '<textarea id="news-facts" placeholder="المدرب | اسم المدرب&#10;المدة | 5 أيام">' +
      U.esc(factsToLines(r.facts)) + '</textarea>' +
      '<span class="muted small">اتركه فارغًا إن لم تكن هناك حقائق؛ يُخزَّن حينها مصفوفة فارغة.</span></div>';

    var g3 = '<div class="grid2">' +
      '<div class="fld"><label for="news-cta_label">نصّ زرّ الإجراء</label>' +

        '" placeholder="https://…" dir="ltr"></div>' +
      '</div>' +
      '<div class="grid2">' +
      '<div class="fld"><label for="news-image">اسم ملف الصورة</label>' +
        '<input type="text" id="news-image" value="' + U.esc(r.image || '') +

        '<span class="muted small">اسم الملف فقط كما هو في مجلّد صور الأخبار داخل الموقع. ' +
        'هذه الوحدة لا ترفع صورًا.</span></div>' +
      '<div class="fld"><label for="news-status">الحالة</label>' + statusSelect(r.status || 'draft') +

    var foot = '<button class="btn ghost" data-act="news-cancel">إلغاء</button>' +
      '<button class="btn" data-act="news-save"' + (isEdit ? ' data-id="' + U.esc(r.id) + '"' : '') + '>' +
      (isEdit ? 'حفظ التعديلات' : 'إضافة الخبر') + '</button>';

    var meta = isEdit
      ? '<p class="muted small mono">#' + U.esc(r.id) + ' · أُنشئ: ' + U.esc(F.date(r.created_at)) +
        (r.updated_at ? ' · آخر تعديل: ' + U.esc(F.date(r.updated_at)) : '') + '</p>'
      : '';

    return U.head(isEdit ? 'تعديل خبر' : 'خبر جديد',
      isEdit ? 'تحديث سجلّ موجود في جدول الأخبار' : 'إضافة سجلّ جديد إلى جدول الأخبار') +
      staticNotice() + meta +
      U.card(isEdit ? 'بيانات الخبر' : 'بيانات الخبر الجديد', g1 + g2 + g3, foot);
  }

  function renderForm(mount) {
    if (editId == null) {
      mount.innerHTML = formHtml(null);
      return Promise.resolve();
    }
    var n = toInt(editId);
    if (n == null) {
      // نُعيد الحالة إلى القائمة كي لا يتحوّل هذا المخرج بصمت إلى نموذج «خبر جديد»
      editId = null; mode = 'list';
      mount.innerHTML = U.head('تعديل خبر') +
        U.notice('<b>معرّف غير صالح — أُلغي التحميل حمايةً للبيانات.</b><br>' +
          'عد إلى القائمة واختر الخبر من جديد.') +
        '<div class="right"><button class="btn ghost" data-act="news-cancel">رجوع إلى القائمة</button></div>';
      return Promise.resolve();
    }
    return A.select('news', 'select=*&id=eq.' + n + '&limit=1').then(function (rows) {
      if (!rows || !rows.length) {
        editId = null; mode = 'list';
        mount.innerHTML = U.head('تعديل خبر') + U.notice(
          '<b>لم يُعَد أي صفّ بهذا المعرّف (#' + U.esc(n) + ').</b><br>' +
          'قد يكون السجلّ محذوفًا، أو أن سياسات الحماية لا تسمح لحسابك بقراءته — ' +
          'القراءة الممنوعة ترجع نتيجة فارغة لا رسالة خطأ.') +
          '<div class="right"><button class="btn ghost" data-act="news-cancel">رجوع إلى القائمة</button></div>';
        return;
      }
      mount.innerHTML = formHtml(rows[0]);
    });
  }

  /* -------------------------- قراءة النموذج وحفظه -------------------------- */

  function collect() {
    var title = trimmed('#news-title');
    var date = trimmed('#news-date');
    if (!title) { U.toast('العنوان مطلوب', 'warn'); return null; }
    if (!date) { U.toast('التاريخ مطلوب', 'warn'); return null; }
    return {
      date: date,
      tag: orNull(trimmed('#news-tag')),
      title: title,
      lead: orNull(trimmed('#news-lead')),
      body: linesToArray(val('#news-body')),
      facts: linesToFacts(val('#news-facts')),
      cta_label: orNull(trimmed('#news-cta_label')),
      cta_url: orNull(trimmed('#news-cta_url')),
      image: orNull(trimmed('#news-image')),
      status: val('#news-status') === 'published' ? 'published' : 'draft'
    };
  }

  /* تنقّل داخليّ — نُعلم دالة الرسم أن الطلب منّا لا من الشريط الجانبي */
  function goSelf() { internal = true; IAQ.go(KEY); }

  function backToList() {
    mode = 'list'; editId = null; goSelf();
  }

  /* ------------------------------- التسجيل ------------------------------- */

  IAQ.views.register(KEY, {
    label: 'الأخبار',
    group: 'المحتوى',
    icon: '<path d="M4 5h11a1 1 0 0 1 1 1v13H5a1 1 0 0 1-1-1V5z"/>' +
          '<path d="M16 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-3"/>' +
          '<path d="M7 9h6M7 12h6M7 15h4"/>',
    render: function (mount) {
      // الدخول من الشريط الجانبي يعيدنا دائمًا إلى القائمة، لا إلى نموذج قديم
      var self = internal; internal = false;
      if (mode === 'form' && !self) { mode = 'list'; editId = null; }
      return mode === 'form' ? renderForm(mount) : renderList(mount);
    }
  });

  IAQ.on('news-flt', function (btn) {
    flt = btn.getAttribute('data-arg') || 'all';
    mode = 'list'; editId = null;
    goSelf();
  });

  IAQ.on('news-new', function () {
    mode = 'form'; editId = null; goSelf();
  });

  IAQ.on('news-edit', function (btn) {

  });

  IAQ.on('news-cancel', function () { backToList(); });

  /* استعراض سريع في اللوح الجانبي — قراءة فقط */
  IAQ.on('news-view', function (btn) {
