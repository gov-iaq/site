    var html = meta + msgHtml +
      '<div class="drawer-sec"><h4>بيانات النموذج كما وصلت</h4>' +
      '<p class="small muted">مُدخَلات زائر غير موثوقة؛ تُعرض كنصّ فقط.</p>' + form + '</div>' +
      '<div class="drawer-sec"><h4>تحديث الحالة والأولوية</h4>' +
      '<div class="cfld"><label for="subs-st-sel">الحالة</label>' +
      '<select class="dsel" id="subs-st-sel">' + opts(ST, ST_ORDER, row.status) + '</select></div>' +
      '<div class="cfld"><label for="subs-pr-sel">الأولوية</label>' +
      '<select class="dsel" id="subs-pr-sel">' + opts(PR, PR_ORDER, row.priority || 'normal') + '</select></div>' +
      '<div class="btnbar">' +
      U.iconBtn('subsDel', IC_DEL, { id: row.id, danger: true, label: 'حذف الطلب' }) +
      '<button class="btn ok" data-act="subsSave" data-id="' + esc(row.id) + '">حفظ التغييرات</button>' +
      '</div></div>' +
      '<div class="drawer-sec"><h4>الردّ على المُرسِل</h4>' +
      U.notice('لا توجد في اللوحة قدرة إرسال بريد إلكتروني. اكتب الردّ وأرسله يدويًا من بريد الجمعية، ' +
        'ثم غيّر الحالة هنا إلى «قيد المعالجة» أو «مُغلق» لتوثيق ما تمّ.') +
      '</div>';

    U.drawer('طلب رقم ' + row.id + ' · ' + kindLabel(row.kind), html);
  });

  /* -------------------------------- الحفظ -------------------------------- */
  IAQ.on('subsSave', function (btn) {
    var id = btn.getAttribute('data-id');
    var sEl = U.$('#subs-st-sel'), pEl = U.$('#subs-pr-sel');
    if (!sEl || !pEl) { U.toast('حقول التحديث غير متاحة', 'err'); return; }
    var patch = { status: sEl.value, priority: pEl.value };
    btn.disabled = true;

    A.update('submissions', id, patch).then(function (rows) {
      if (!rows || !rows.length) {
        // 200 ومصفوفة فارغة = لم يُطابق أيّ صفّ سياسة الكتابة — لا نُعلن نجاحًا
        U.toast('لم يُحدَّث أيّ سجلّ — قد لا تملك صلاحية التعديل', 'warn');
        return null;
      }
      return IAQ.audit('submission.status', 'submissions', id).then(function () {
        U.toast('تم الحفظ');
        U.closeDrawer();
        IAQ.go(KEY);
      });
    }).catch(function (e) {
      U.toast((e && e.message) || 'فشل الإجراء', 'err');
    }).then(function () {
      try { btn.disabled = false; } catch (e2) { }
    });
  });

  /* -------------------------------- الحذف -------------------------------- */
  IAQ.on('subsDel', function (btn) {
    var id = btn.getAttribute('data-id');
    var row = cache[String(id)];
    var who = row ? firstOf(row.payload, ['name', 'full_name', 'email']) : '';

    U.ask('حذف الطلب رقم ' + id + (who ? ' («' + F.cut(who, 40) + '»)' : '') +
      ' نهائيًا من قاعدة البيانات؟ لا يمكن التراجع.', 'حذف نهائي').then(function (ok) {
        if (!ok) return null;
        return A.remove('submissions', id).then(function (rows) {
          if (!rows || !rows.length) {
            U.toast('لم يُحذف أيّ سجلّ — قد لا تملك صلاحية الحذف', 'warn');
            return null;
          }
          return IAQ.audit('submission.delete', 'submissions', id).then(function () {
            U.toast('تم الحذف');
            U.closeDrawer();
            IAQ.go(KEY);
          });
        });
      }).catch(function (e) {
        U.toast((e && e.message) || 'فشل الإجراء', 'err');
      });
  });

  /* ------------------------------ المُرشِّحات ------------------------------ */
  IAQ.on('subsSt', function (btn) { fSt = btn.getAttribute('data-arg') || 'all'; IAQ.go(KEY); });
  IAQ.on('subsKind', function (btn) { fKind = btn.getAttribute('data-arg') || 'all'; IAQ.go(KEY); });

  IAQ.views.register(KEY, {
    label: 'الطلبات والرسائل',
    group: 'التفاعل',
    icon: '<path d="M6 4h12l3 9v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5l3-9z"/><path d="M3 13h5l2 3h4l2-3h5"/>',
    render: render
  });
})();

/* ===== 70-surveys.js ===== */
/* ============================================================================
   وحدة: نتائج قياس الرضا  (المفتاح: surveys)
   تقرأ public.survey_responses كما هي وتحسب المتوسطات الحقيقية لكل سؤال.
   لا تُخترع أي أرقام: كل رقم هنا مشتقّ من صفوف قرأناها فعلًا من قاعدة البيانات.
   الردود مجهولة المصدر بالتصميم (لا اسم ولا بريد ولا IP) — لذلك لا يوجد أي
   ربط بشخص، والحذف نهائي لأنه لا توجد نسخة أخرى من الردّ.
   ============================================================================ */
(function () {
  'use strict';

  var U = IAQ.ui, F = IAQ.fmt, A = IAQ.api;

  var LIMIT = 500;          // أقصى عدد ردود نقرؤها في الطلب الواحد
  var TBL_MAX = 200;        // أقصى عدد صفوف نعرضها في جدول الملاحظات
  var TYPE = 'visitors';    // التصنيف المعروض حاليًا
  var CACHE = null;         // الصفوف المقروءة (كل التصنيفات) — تُفرَّغ بعد كل حذف
  var LOADED = 0;           // وقت آخر قراءة فعلية من قاعدة البيانات

  var TYPES = [
    { k: 'visitors', t: 'رضا الزوّار' },
    { k: 'beneficiaries', t: 'رضا المستفيدين' },
    { k: 'donors', t: 'رضا الداعمين' }
  ];

  /* مفاتيح ratings كما يخزّنها الموقع العام فعلًا: نموذج قياس الرضا يقرأ نصّ
     السؤال من عنصر .qt ويستعمله مفتاحًا (انظر templates/footer.html)، فالمفتاح
     هو جملة السؤال بالعربية لا رمزًا مختصرًا مثل vq0. لذلك الأصل أن نعرض
     المفتاح كما ورد في قاعدة البيانات، والخريطة أدناه احتياط لصفوف قديمة أو
     مُدرَجة يدويًا بالرموز المختصرة فقط. */
  var QLABEL = {
    vq0: 'سهولة تصفّح الموقع والوصول للمعلومة',
    vq1: 'وضوح المحتوى وكفايته',
    vq2: 'سرعة الموقع وأداؤه',
    vq3: 'تجربتك العامة مع الموقع',
    bq0: 'جودة البرامج والخدمات المقدّمة',
    bq1: 'مدى تلبية البرامج لاحتياجاتك',
    bq2: 'احترافية فريق العمل والتعامل',
    bq3: 'الأثر الذي لمسته على جمعيتك',
    dq0: 'وضوح التواصل والتقارير المرسلة إليك',
    dq1: 'شفافية الجمعية في صرف التبرعات وتوثيق الأثر',
    dq2: 'سرعة الاستجابة لملاحظاتك واستفساراتك',
    dq3: 'ثقتك العامة في الجمعية ورضاك عن الشراكة'
  };

  function typeName(k) {
    var i;
    for (i = 0; i < TYPES.length; i++) if (TYPES[i].k === k) return TYPES[i].t;
    return k;
  }
  function qLabel(k) {
    var s = String(k == null ? '' : k);
    if (Object.prototype.hasOwnProperty.call(QLABEL, s)) return QLABEL[s];
    if (s.replace(/\s/g, '') === '') return 'سؤال بلا نصّ في قاعدة البيانات';
    return s;
  }

  function isObj(v) {
    return !!v && typeof v === 'object' &&
           Object.prototype.toString.call(v) !== '[object Array]';
  }

  /* --------------------------- حساب المتوسطات --------------------------- */
  /* يمرّ على الصفوف مرّة واحدة: مجموع وعدد لكل مفتاح سؤال على حدة، حتى لا
     يتأثّر متوسط سؤال بردّ لم يُجب عليه. */
  /* القيمة المقبولة درجة على مقياس 1..5؛ أي شيء آخر (نصّ، فراغ، أو رقم خارج
     المدى) يُستثنى من الحساب ويُعدّ ويُعلَن عنه بدل تشويه المتوسط. */
  function grade(raw) {
    if (raw === null || raw === undefined || raw === '' || typeof raw === 'boolean') return null;
    var v = Number(raw);
    if (!isFinite(v) || v < 1 || v > 5) return null;
    return v;
  }

  function collect(rows) {
    var keys = [], sums = {}, cnts = {};
    var total = 0, answers = 0, sumAll = 0, noRating = 0, bad = 0;
    var i, r, rt, k, v, used;
    for (i = 0; i < rows.length; i++) {
      r = rows[i];
      total++;
      rt = r ? r.ratings : null;
      if (!isObj(rt)) { noRating++; continue; }
      used = 0;
      for (k in rt) {
        if (!Object.prototype.hasOwnProperty.call(rt, k)) continue;
        v = grade(rt[k]);
        if (v === null) { bad++; continue; }
        if (cnts[k] === undefined) { cnts[k] = 0; sums[k] = 0; keys.push(k); }
        cnts[k] += 1; sums[k] += v;
        answers++; sumAll += v; used++;
      }
      if (!used) noRating++;
    }
    keys.sort();
    return { keys: keys, sums: sums, cnts: cnts, total: total,
             answers: answers, sumAll: sumAll, noRating: noRating, bad: bad };
  }

  function rowAvg(r) {
    var rt = r ? r.ratings : null, k, v, s = 0, n = 0;
    if (!isObj(rt)) return null;
    for (k in rt) {
      if (!Object.prototype.hasOwnProperty.call(rt, k)) continue;
      v = grade(rt[k]);
      if (v === null) continue;
      s += v; n++;
    }
    return n ? (s / n) : null;
  }

  function barColor(avg) {
    if (avg >= 4) return '#007878';
    if (avg >= 3) return '#c09048';
    return '#c0563a';
  }

  /* ------------------------------ التحميل ------------------------------ */
  function load() {
    if (CACHE) return Promise.resolve(CACHE);
    return A.select('survey_responses',
      'select=id,survey_type,ratings,program,comment,created_at' +
      '&order=created_at.desc&limit=' + LIMIT
    ).then(function (rows) {
      CACHE = rows || [];
      LOADED = Date.now();
      return CACHE;
    });
  }

  /* ------------------------------ الرسم ------------------------------ */
  function filterbar(all) {
    var counts = {}, i, t;
    for (i = 0; i < all.length; i++) {
      t = all[i] && all[i].survey_type ? String(all[i].survey_type) : '—';
      counts[t] = (counts[t] || 0) + 1;
    }
    var h = '<div class="filterbar">';
    for (i = 0; i < TYPES.length; i++) {
      h += '<button class="btn sm ' + (TYPES[i].k === TYPE ? 'ok' : 'ghost') +
           '" data-act="svType" data-arg="' + U.esc(TYPES[i].k) + '">' +
           U.esc(TYPES[i].t) + ' (' + F.num(counts[TYPES[i].k] || 0) + ')</button>';
    }
    h += '<button class="btn sm ghost" data-act="svReload">إعادة القراءة من القاعدة</button>';
    h += '</div>';
    return h;
  }

  function metrics(st) {
    var avg = st.answers ? (st.sumAll / st.answers) : 0;
    var cls = st.answers ? (avg >= 4 ? ' ok' : (avg < 3 ? ' warn' : '')) : '';
    var pct = st.answers ? (avg / 5 * 100) : 0;
    return '<div class="metric-grid">' +
      '<div class="metric' + cls + '"><div class="mv">' +
        (st.answers ? avg.toFixed(2) + ' / 5' : '—') +
        '</div><div class="ml">المتوسط العام لكل الإجابات</div></div>' +
      '<div class="metric"><div class="mv">' +
        (st.answers ? pct.toFixed(0) + '%' : '—') +
        '</div><div class="ml">نسبة الرضا (المتوسط ÷ 5)</div></div>' +
      '<div class="metric"><div class="mv">' + F.num(st.total) +
        '</div><div class="ml">عدد ردود هذا التصنيف</div></div>' +
      '<div class="metric"><div class="mv">' + F.num(st.answers) +
        '</div><div class="ml">عدد الإجابات الرقمية فيها</div></div>' +
    '</div>';
  }

  function hbars(st) {
    if (!st.keys.length) {
      return U.empty('لا توجد إجابات رقمية صالحة في هذه الردود.');
    }
    var h = '<div class="hbars">', i, k, avg, pct, lbl;
    for (i = 0; i < st.keys.length; i++) {
      k = st.keys[i];
      avg = st.sums[k] / st.cnts[k];
      pct = avg / 5 * 100;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      /* المفتاح جملة سؤال كاملة وعمود العنوان ضيّق — نقصّه للعرض ونضع النصّ
         الكامل في تلميح، بلا حذف أي معلومة. */
      lbl = qLabel(k);
      h += '<div class="hbar">' +
        '<div class="hb-label" title="' + U.esc(lbl) + '">' + U.esc(F.cut(lbl, 44)) +
          ' <span class="muted small">(' + F.num(st.cnts[k]) + ')</span></div>' +
        '<div class="hb-track"><div class="hb-fill" style="width:' + pct.toFixed(1) +
          '%;background:' + barColor(avg) + '"></div></div>' +
        '<div class="hb-val">' + avg.toFixed(2) + '</div>' +
      '</div>';
    }
    h += '</div>';
    h += '<p class="muted small" style="margin-block-start:14px">' +
      'الرقم بين القوسين = عدد الردود التي أجابت على هذا السؤال تحديدًا، ' +
      'وطول الشريط = المتوسط ÷ 5. عدد الأسئلة المقاسة: ' + F.num(st.keys.length) + '. ' +
      'وتنبيه لازم لقراءة الأرقام: نموذج الموقع يخزّن كل سؤال بمفتاح هو نصّ ' +
      'السؤال كما كان مكتوبًا لحظة الإرسال، فإن عُدِّلت صياغة سؤال لاحقًا ظهرت ' +
      'الصياغة الجديدة سؤالًا منفصلًا بردوده وحدها، وبقيت ردود الصياغة القديمة ' +
      'في سطر آخر — فلا تُجمع المتوسطات بينهما تلقائيًا.' +
      '</p>';
    return h;
  }

  var DEL_ICON = '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>';

  function commentsTable(list) {
    var withText = 0, i, shown, cols, body = [], r, av, cells;
    for (i = 0; i < list.length; i++) {
      if (list[i] && list[i].comment && String(list[i].comment).replace(/\s/g, '') !== '') withText++;
    }
    shown = list.length > TBL_MAX ? list.slice(0, TBL_MAX) : list;

    cols = ['التاريخ'];
    if (TYPE === 'beneficiaries') cols.push('البرنامج');
    cols.push('الملاحظة النصّية', 'متوسط الردّ', 'حذف');

    for (i = 0; i < shown.length; i++) {
      r = shown[i];
      av = rowAvg(r);
      cells = ['<span class="small">' + U.esc(F.date(r.created_at)) + '</span>'];
      if (TYPE === 'beneficiaries') {
        cells.push(r.program ? U.esc(F.cut(String(r.program), 60))
                             : '<span class="muted">—</span>');
      }
      cells.push(r.comment && String(r.comment).replace(/\s/g, '') !== ''
        ? U.esc(F.cut(String(r.comment), 260))
        : '<span class="muted">لا ملاحظة</span>');
      cells.push(av === null ? '<span class="muted">—</span>'
                             : '<b class="mono">' + av.toFixed(2) + '</b>');
      cells.push('<div class="acts">' + U.iconBtn('svDel', DEL_ICON,
        { id: r.id, danger: true, sm: true, label: 'حذف هذا الردّ نهائيًا' }) + '</div>');
      body.push(cells);
    }

    var h = '<p class="muted small" style="margin-block-end:12px">' +
      'ردود تحتوي ملاحظة نصّية: ' + F.num(withText) + ' من ' + F.num(list.length) + '.' +
      (list.length > TBL_MAX ? ' يُعرض أحدث ' + F.num(TBL_MAX) + ' ردّ فقط في الجدول.' : '') +
      '</p>' + U.table(cols, body);
    return h;
  }

  /* ------------------------------ الشاشة ------------------------------ */
  IAQ.views.register('surveys', {
    label: 'نتائج قياس الرضا',
    group: 'التفاعل',
    icon: '<path d="M3 20h18M7 20v-8M12 20V5M17 20v-6"/>',
    render: function (mount) {
      return load().then(function (all) {
        var i, list = [], r;
        for (i = 0; i < all.length; i++) {
          r = all[i];
          if (r && String(r.survey_type) === TYPE) list.push(r);
        }
        var st = collect(list);

        var h = U.head('نتائج قياس الرضا',
          'متوسطات محسوبة من ردود الاستبانات المخزّنة في قاعدة البيانات.');

        h += U.notice(
          '<b>الردود مجهولة المصدر بالتصميم.</b><br>' +
          'جدول الردود لا يحتوي اسمًا ولا بريدًا ولا رقم هاتف ولا عنوان IP — لا يُخزَّن ' +
          'سوى التقييمات الرقمية والملاحظة النصّية وتاريخ الإرسال، فلا يمكن ربط أي ردّ ' +
          'بشخص معيّن ولا التحقّق من مُرسِله ولا التواصل معه.');

        h += U.notice(
          '<b>هذه الأرقام لا تظهر على الموقع العام.</b><br>' +
          'صفحة «قياس الرضا» في الموقع صفحة HTML ثابتة يولّدها build.py، والنِّسب ' +
          'المعروضة فيها مكتوبة داخل المصدر ومُعلَّم عليها أنها بيانات توضيحية. ' +
          'لعرض النتائج الحقيقية على الموقع يجب تحديث مصدر البناء ثم إعادة البناء والنشر.');

        if (!all.length) {
          h += U.card('الردود',
            U.empty('لا توجد بيانات') +
            '<p class="muted small" style="text-align:center">القراءة الفارغة قد تعني ' +
            'عدم وجود ردود، أو أن سياسة الصلاحيات لا تسمح لحسابك بقراءة هذا الجدول — ' +
            'الاستجابة واحدة في الحالتين فلا نستطيع التمييز بينهما.</p>');
          mount.innerHTML = h;
          return;
        }

        if (all.length >= LIMIT) {
          h += U.notice('قُرئ أحدث ' + F.num(LIMIT) + ' ردّ فقط (حدّ الطلب الواحد)، ' +
            'فالمتوسطات والأعداد أدناه تخصّ هذه الدفعة لا كل تاريخ الجدول.');
        }

        h += filterbar(all);

        if (!list.length) {
          h += U.card('نتائج ' + typeName(TYPE),
            U.empty('لا توجد بيانات') +
            '<p class="muted small" style="text-align:center">لا يوجد أي ردّ من نوع «' +
            U.esc(typeName(TYPE)) + '» ضمن الردود المقروءة.</p>');
          mount.innerHTML = h;
          return;
        }

        h += metrics(st);
        h += U.card('متوسط كل سؤال — ' + typeName(TYPE), hbars(st));

        if (st.noRating || st.bad) {
          h += U.notice(
            (st.noRating ? 'عدد الردود بلا أي تقييم صالح: ' + F.num(st.noRating) +
                           ' (استُثنيت من المتوسطات). ' : '') +
            (st.bad ? 'عدد القيم المستثناة لأنها ليست درجة بين 1 و5: ' +
                      F.num(st.bad) + '.' : ''));
        }

        h += U.card('الردود والملاحظات النصّية — ' + typeName(TYPE),
          commentsTable(list),
          '<span class="muted small">' +
          'الحذف يزيل الردّ من قاعدة البيانات نهائيًا: لا سلّة محذوفات ولا نسخة ' +
          'احتياطية داخل اللوحة، وبما أن الردّ مجهول المصدر فلا يمكن إعادة تجميعه.' +
          '</span>');

        h += '<p class="muted small">آخر قراءة للبيانات من قاعدة البيانات: ' +
          U.esc(F.date(new Date(LOADED).toISOString())) + '.</p>';

        mount.innerHTML = h;
      }).catch(function (e) {
        mount.innerHTML = U.head('نتائج قياس الرضا') +
          U.notice('<b>تعذّر قراءة الردود.</b><br>' +
                   U.esc(e && e.message ? e.message : String(e)));
        U.toast((e && e.message) || 'فشل الإجراء', 'err');
      });
    }
  });

  /* ------------------------------ الأحداث ------------------------------ */
  IAQ.on('svType', function (btn) {
    var k = btn.getAttribute('data-arg');
    if (!k) return;
    TYPE = k;
    IAQ.go('surveys');
  });

  IAQ.on('svReload', function () {
    CACHE = null;
    IAQ.go('surveys');
  });

  IAQ.on('svDel', function (btn) {
    var id = btn.getAttribute('data-id');
    U.ask('سيُحذف هذا الردّ من قاعدة البيانات نهائيًا. الحذف غير قابل للتراجع، ' +
          'ولا توجد نسخة أخرى منه لأن الردّ مجهول المصدر. متابعة؟', 'حذف نهائي')
      .then(function (ok) {
        if (!ok) return null;
        return A.remove('survey_responses', id).then(function (rows) {
          if (!rows || !rows.length) {
            U.toast('لم يُحذف أي صفّ — تحقّق من صلاحيتك أو من وجود الردّ.', 'warn');
            return null;
          }
          IAQ.audit('delete_survey_response', 'survey_responses', id);
          CACHE = null;
          U.toast('حُذف الردّ نهائيًا', 'ok');
          IAQ.go('surveys');
          return null;
        });
      })
      .catch(function (e) {
        U.toast((e && e.message) || 'فشل الإجراء', 'err');
      });
  });
})();

/* ===== 80-settings.js ===== */
/* ============================================================================
   شاشة «الإعدادات» — محرّر عامّ لجدول public.settings.
   القيمة (value) من نوع jsonb، لذلك يُبنى عنصر التحكّم حسب نوع القيمة الفعليّ:
   منطقيّ ← مفتاح تشغيل، رقم ← حقل رقميّ، نصّ ← حقل نصّيّ، فارغة (null) ← حقل نصّيّ
   خالٍ، كائن/مصفوفة ← مساحة نصّ تحمل JSON ويُشترط أن يُحلَّل قبل الحفظ.
   الحفظ يرسل الصفوف المتغيّرة فقط عبر upsert على المفتاح key.
   ملاحظة مثبَّتة: القراءة الممنوعة بـRLS ترجع مصفوفة فارغة لا خطأ، فلا ندّعي فشلًا.
   ============================================================================ */
(function () {
  'use strict';
  var U = IAQ.ui, F = IAQ.fmt, A = IAQ.api;

  /* الحقول المرسومة حاليًا — يُعاد بناؤها مع كل رسم، ويقرؤها زرّ الحفظ عند الضغط */
  var FIELDS = [];

  /* نوع القيمة كما وصلت من jsonb */
  function kindOf(v) {
    if (v === null || typeof v === 'undefined') return 'null';
    if (typeof v === 'boolean') return 'bool';
    if (typeof v === 'number') return 'num';
    if (typeof v === 'string') return 'str';
    return 'json';                       // كائن أو مصفوفة
  }

  var KIND_AR = { bool: 'منطقيّة (نعم/لا)', num: 'رقم', str: 'نصّ', 'null': 'فارغة', json: 'JSON' };

  /* عنصر تحكّم واحد + سطر خطأ فارغ يُملأ عند فشل التحقّق */
  function fieldHtml(r, i, t) {
    var vid = 'settings-v-' + i;
    var lab = r.label ? U.esc(r.label) + ' <span class="mono">' + U.esc(r.key) + '</span>'
                      : '<span class="mono">' + U.esc(r.key) + '</span>';
    var chip = '<span class="chip">' + (r.is_public ? 'علنيّ (يقرؤه الزوّار)' : 'داخليّ') + '</span>';
    var ctl = '', hint = '';

    if (t === 'bool') {
      ctl = '<div class="prow">' +
        '<button type="button" class="switch' + (r.value ? ' on' : '') + '" id="' + vid + '"' +
        ' data-act="settingsToggle" data-arg="' + i + '" role="switch" aria-checked="' +
        (r.value ? 'true' : 'false') + '" aria-label="' + U.esc(r.label || r.key) + '"><span></span></button>' +
        '<span class="small" id="settings-bl-' + i + '">' + (r.value ? 'مُفعَّل' : 'معطَّل') + '</span></div>';
    } else if (t === 'num') {
      ctl = '<input type="number" step="any" id="' + vid + '" value="' + U.esc(r.value) + '">';
    } else if (t === 'json') {
      ctl = '<textarea id="' + vid + '" rows="8" dir="ltr" spellcheck="false">' +
        U.esc(JSON.stringify(r.value, null, 2)) + '</textarea>';
      hint = '<div class="small muted">قيمة JSON — لن تُحفظ إن كانت الصيغة غير صحيحة.</div>';
    } else if (t === 'null') {
      ctl = '<input type="text" id="' + vid + '" value="">';
      hint = '<div class="small muted">القيمة الحالية فارغة (null). اتركها فارغة لتبقى كذلك، أو اكتب نصًّا ليُحفظ كنصّ.</div>';
    } else {
      ctl = '<input type="text" id="' + vid + '" value="' + U.esc(r.value) + '">';
    }

    var meta = '<div class="small muted">النوع: ' + U.esc(KIND_AR[t] || t) +
      (r.updated_at ? ' · آخر تحديث: ' + U.esc(F.date(r.updated_at)) : '') +
      (r.updated_by ? ' · بواسطة ' + U.esc(r.updated_by) : '') + '</div>';

    return '<div class="fld"><label>' + lab + ' ' + chip + '</label>' + ctl + hint +
      '<div id="settings-err-' + i + '"></div>' + meta + '</div>';
  }

  /* بطاقة صريحة: ما لا يمكن تعديله من هنا لأنه يُدمج في الصفحات وقت البناء */
  function staticCard() {
    var f = '<span class="mono">src/data/contact.json</span>';
    return U.card('ما لا يُعدَّل من هذه الشاشة',
      '<p class="small">صفحات الموقع صفحات HTML ثابتة تُبنى مسبقًا من ملفات المصدر، فالقيم التالية ' +
      'ليست مخزَّنة في قاعدة البيانات ولا يمكن لهذه الشاشة تغييرها — ولذلك لا نعرض لها أزرارًا ' +
      'لأنّها لن تعمل:</p>' +
      U.table(['العنصر', 'من أين يُعدَّل فعلًا'], [
        ['بيانات التواصل: الهاتف، البريد، العنوان', f + ' ثم إعادة البناء والنشر'],
        ['رقم الترخيص', f + ' ثم إعادة البناء والنشر'],
        ['روابط التواصل الاجتماعي', f + ' ثم إعادة البناء والنشر'],
        ['رابط التبرّع ومتجر التبرعات', f + ' ثم إعادة البناء والنشر'],
        ['النصوص الظاهرة في الصفحات',
          'شاشة «المحتوى» في هذه اللوحة — وهي أيضًا تُخزِّن التعديل في قاعدة البيانات ' +
          'ولا يظهر على الموقع إلا بعد إعادة البناء والنشر']
      ]));
  }

  IAQ.views.register('settings', {
    label: 'الإعدادات',
    group: 'الموقع',
    icon: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    render: function (mount) {
      FIELDS = [];
      return A.select('settings', 'select=key,value,label,is_public,updated_at,updated_by&order=key.asc')
        .then(function (rows) {
          rows = rows || [];
          var h = U.head('الإعدادات', 'قيم عامة مخزَّنة في جدول settings بقاعدة البيانات');

          h += U.notice('<b>هذه القيم تُخزَّن في قاعدة البيانات فقط.</b><br>' +
            'صفحات الموقع ثابتة ومبنيّة مسبقًا، فتعديل قيمة هنا لا يُغيّر ما يراه الزوّار حتى ' +
            'إعادة بناء الموقع ونشره. ووسم «علنيّ» يعني أنّ القيمة قابلة للقراءة من واجهة ' +
            'البيانات دون تسجيل دخول، لا أنّها ظاهرة في صفحة ما.');

          if (!rows.length) {
            h += U.card('قيم الموقع',
              U.empty('لا توجد بيانات') +
              '<p class="small muted">جدول settings لا يحتوي صفوفًا، أو أنّ دورك الحالي لا يسمح ' +
              'بقراءته — القراءة الممنوعة تُرجع نتيجة فارغة لا رسالة خطأ، فلا يمكن التمييز بينهما ' +
              'من هنا.</p>');
            h += staticCard();
            mount.innerHTML = h;
            return;
          }

          var body = '';
          rows.forEach(function (r, i) {
            var t = kindOf(r.value);
            FIELDS.push({ key: r.key, type: t, orig: typeof r.value === 'undefined' ? null : r.value });
            body += fieldHtml(r, i, t);
          });

          h += U.card('قيم الموقع (' + F.num(rows.length) + ')', body,
            '<button class="btn ghost" data-act="settingsReset">تجاهل التغييرات</button>' +
            '<button class="btn ok" data-act="settingsSave">حفظ الإعدادات</button>');

          h += U.card('سجلّ الإجراء',
            '<p class="small muted">لا تُرسَل إلى قاعدة البيانات إلا الحقول التي غيّرتها فعلًا، ' +
            'ويُسجَّل بريدك في خانة «بواسطة» لكل قيمة حفظتها. وتُحاول اللوحة كذلك تسجيل ' +
            'العملية في سجلّ التدقيق؛ وإن مُنع هذا التسجيل فلن يُلغى الحفظ ولن تظهر رسالة خطأ.</p>');

          h += staticCard();
          mount.innerHTML = h;
        });
    }
  });

  /* تبديل المفتاح المنطقيّ — تعديل عنصر قائم، بلا مستمعين جديدة */
  IAQ.on('settingsToggle', function (btn) {
    var on = !btn.classList.contains('on');
    if (on) btn.classList.add('on'); else btn.classList.remove('on');
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    var lbl = U.$('#settings-bl-' + btn.getAttribute('data-arg'));
    if (lbl) lbl.textContent = on ? 'مُفعَّل' : 'معطَّل';
  });

  /* تجاهل التغييرات يفقد ما كتبه المستخدم ولم يُحفظ — نسأل أولًا */
  IAQ.on('settingsReset', function () {
    U.ask('تجاهل كل التعديلات التي لم تُحفظ، وإعادة تحميل القيم من قاعدة البيانات؟', 'تجاهل التعديلات')
      .then(function (yes) { if (yes) IAQ.go('settings'); })['catch'](function (e) {
        U.toast(e.message || 'فشل الإجراء', 'err');
      });
  });

  IAQ.on('settingsSave', function (btn) {
    if (!FIELDS.length) { U.toast('لا توجد قيم للحفظ', 'warn'); return; }

    var changed = [], bad = 0, i, f, el, nv, raw, err;

    for (i = 0; i < FIELDS.length; i++) {
      f = FIELDS[i];
      el = U.$('#settings-v-' + i);
      err = U.$('#settings-err-' + i);
      if (err) err.innerHTML = '';
      if (!el) continue;

      if (f.type === 'bool') {
        nv = el.classList.contains('on');
      } else if (f.type === 'num') {
        raw = String(el.value).replace(/^\s+|\s+$/g, '');
        // isFinite ضروريّ: Infinity و1e999 تمرّان من isNaN، وJSON يحوّلهما إلى null بصمت
        if (raw === '' || !isFinite(Number(raw))) {
          if (err) err.innerHTML = U.notice('هذه القيمة رقميّة — أدخل رقمًا صحيحًا ومحدودًا.');
          bad++; continue;
        }
        nv = Number(raw);
      } else if (f.type === 'json') {
        raw = String(el.value).replace(/^\s+|\s+$/g, '');
        if (raw === '') {
          if (err) err.innerHTML = U.notice('لا يمكن ترك قيمة JSON فارغة — اكتب <span class="mono">[]</span> أو <span class="mono">{}</span> إن أردت إفراغها.');
          bad++; continue;
        }
        try { nv = JSON.parse(raw); }
        catch (ex) {
          if (err) err.innerHTML = U.notice('صيغة JSON غير صحيحة: ' + U.esc(ex && ex.message ? ex.message : ex));
          bad++; continue;
        }
      } else if (f.type === 'null') {
        raw = String(el.value);
        nv = raw.replace(/^\s+|\s+$/g, '') === '' ? null : raw;
      } else {
        nv = String(el.value);
      }

      if (JSON.stringify(nv) !== JSON.stringify(f.orig)) changed.push({ key: f.key, value: nv });
    }

    if (bad) { U.toast('صحّح الحقول المعلَّمة (' + bad + ') ثم أعد الحفظ', 'err'); return; }
    if (!changed.length) { U.toast('لا توجد تغييرات للحفظ', 'warn'); return; }

    /* «بواسطة» لا يضبطه أي مُشغِّل في قاعدة البيانات، فلو لم نُرسله بقيت النسبة
       للمحرّر السابق مع تاريخ جديد — أي عرض معلومة خاطئة في الشاشة */
    var s = IAQ.session();
    var who = (IAQ.me && IAQ.me.email) || (s && s.email) || '';
    var keys = changed.map(function (r) { return r.key; }).join(',');
    var stamp = new Date().toISOString();
    var payload = changed.map(function (r) {
      var o = { key: r.key, value: r.value, updated_at: stamp };
      if (who) o.updated_by = who;   // مفاتيح كل الصفوف متطابقة — شرط PostgREST للإدراج الجماعي
      return o;
    });

    btn.disabled = true;
    A.upsert('settings', payload, 'key').then(function (out) {
      if (!out || !out.length) {
        btn.disabled = false;
        U.toast('لم يُرجِع الخادم أيّ صفّ محدَّث — لم يُحفظ شيء على الأرجح', 'warn');
        return null;
      }
      return IAQ.audit('settings.update', 'settings', keys).then(function () { return out; });
    }).then(function (out) {
      if (!out) return;
      U.toast('تم حفظ ' + F.num(out.length) + ' قيمة');
      IAQ.go('settings');
    })['catch'](function (e) {
      btn.disabled = false;
      U.toast(e.message || 'فشل الإجراء', 'err');
    });
  });
})();

/* ===== 90-audit.js ===== */
/* ============================================================================
   سجلّ العمليات — شاشة قراءة فقط لجدول public.audit_log.

   قرارات مقصودة في هذه الشاشة:
   • لا يوجد أي زرّ حذف أو تعديل هنا. سجلّ عمليات يمكن محوه من شاشته لا قيمة له،
     والنصّ المعروض للمستخدم يقول ذلك صراحةً.
   • لا نكتب في السجلّ عند فتحه (لا IAQ.audit) — قراءة السجلّ ليست عملية تُسجَّل،
     وإلّا تلوّث السجلّ بنفسه.
   • القراءة الممنوعة بـRLS ترجع 200 ومصفوفة فارغة لا خطأ، فلا نزعم وجود خطأ عند
     الفراغ؛ نقول إن السجلّ قد يكون فارغًا فعلًا أو أن الدور لا يسمح بقراءته.
   • تُقرأ آخر 200 سطر فقط، والتصفية والبحث يعملان على هذه الصفوف داخل المتصفّح
     لا على كامل الجدول — وهذا مكتوب في الواجهة كي لا يُفهم العدد خطأً.
   • أزرار التصفية تُبنى من قيم entity الموجودة فعلًا في الصفوف المقروءة، لا من
     قائمة ثابتة، فلا تظهر تصنيفات وهمية.
   ============================================================================ */
(function () {
  'use strict';
  var U = IAQ.ui, F = IAQ.fmt, A = IAQ.api;

  var KEY = 'audit';
  var LIMIT = 200;

  /* حالة الشاشة — تُقرأ عند كلّ إعادة رسم، والرسم يستبدل محتوى المنطقة كاملًا
     لذلك لا نُعلّق أيّ مستمع على عنصر ننشئه، بل نستخدم data-act. */
  var mountEl = null;   // منطقة العرض
  var rows = [];        // الصفوف المقروءة فعلًا — لا تُختلق أبدًا
  var total = null;     // الإجمالي من ترويسة Content-Range، أو null إن تعذّر
  var ent = '*';        // الكيان المُصفّى: '*' = الكل، '' = سطور بلا كيان
  var q = '';           // نصّ البحث الحالي
  var loadErr = '';     // رسالة فشل القراءة إن وقعت

  /* ----------------------------- أيقونات الأسطر ----------------------------- */
  var ICON = {
    create: '<path d="M12 5v14M5 12h14"/>',
    update: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    del: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
    publish: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18"/>',
    unpub: '<path d="M3 3l18 18"/><path d="M10.6 5.2A9 9 0 0 1 21 12a9 9 0 0 1-1.5 5M4.5 7A9 9 0 0 0 3 12a9 9 0 0 0 10.4 6.8"/>',
    login: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
    logout: '<path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M16 17l5-5-5-5M21 12H9"/>',
    upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
    other: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>'
  };

  /* اسم الكيان داخل الجملة. صيغة مُعرَّفة مقصودة: هذا الاسم يقع مرّة مفعولًا به
     («حدّث الخبر») ومرّة مجرورًا («على الخبر» و«أوقف نشر الخبر»)، والصيغة المُعرَّفة
     تصحّ في الموضعين بلا تشكيل، بخلاف «خبرًا» التي تُنتج «على خبرًا». */
  var ENT_OBJ = {
    news: 'الخبر',
    documents: 'الوثيقة',
    submissions: 'الطلب الوارد',
    survey_responses: 'استجابة الاستبيان',
    settings: 'الإعداد',
    content_overrides: 'تعديل المحتوى',
    media: 'ملف الوسائط',
    admins: 'الحساب الإداري',
    audit_log: 'سطر السجلّ'
  };
  /* اسم الكيان في أزرار التصفية */
  var ENT_NAME = {
    news: 'الأخبار',
    documents: 'الوثائق',
    submissions: 'الطلبات الواردة',
    survey_responses: 'الاستبيانات',
    settings: 'الإعدادات',
    content_overrides: 'تعديلات المحتوى',
    media: 'الوسائط',
    admins: 'المدراء',
    audit_log: 'سجلّ العمليات'
  };
  /* قراءة آمنة من قواميس هذا الملف: قيم قادمة من قاعدة البيانات تُستخدم كمفاتيح،
     وبدون hasOwnProperty قد ترجع خصائص Object الموروثة (constructor / toString /
     __proto__) فيُطبع نصّ دالّة داخلية في الواجهة بدل الترجمة العربية. */
  function dict(map, k) {
    return Object.prototype.hasOwnProperty.call(map, String(k)) ? map[String(k)] : null;
  }

  var VERB = {
    create: 'أضاف',
    update: 'حدّث',
    del: 'حذف',
    publish: 'نشر',
    unpub: 'أوقف نشر',
    login: 'سجّل الدخول إلى اللوحة',
    logout: 'خرج من اللوحة',
    upload: 'رفع ملفًا'
  };

  /* تصنيف الإجراء من نصّه — الترتيب مهم: unpublish قبل publish، وlogout قبل login */
  function kindOf(a) {
    var s = String(a == null ? '' : a).toLowerCase();
    if (s.indexOf('logout') >= 0 || s.indexOf('signout') >= 0) return 'logout';
    if (s.indexOf('login') >= 0 || s.indexOf('signin') >= 0) return 'login';
    if (s.indexOf('unpublish') >= 0) return 'unpub';
    if (s.indexOf('publish') >= 0) return 'publish';
    if (s.indexOf('upload') >= 0) return 'upload';
    if (s.indexOf('delete') >= 0 || s.indexOf('remove') >= 0) return 'del';
    if (s.indexOf('update') >= 0 || s.indexOf('upsert') >= 0 ||
        s.indexOf('edit') >= 0 || s.indexOf('patch') >= 0) return 'update';
    if (s.indexOf('create') >= 0 || s.indexOf('insert') >= 0 || s.indexOf('add') >= 0) return 'create';
    return 'other';
  }

  function svgOf(kind) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + (dict(ICON, kind) || ICON.other) + '</svg>';
  }

  function entOf(r) { return r.entity == null ? '' : String(r.entity); }

  /* جملة عربية مفهومة + الإجراء الخام كما هو في الجدول (شفافية، لا تفسير مُخترع) */
  function sentence(r) {
    var kind = kindOf(r.action);
    var e = entOf(r);
    var raw = String(r.action == null ? '' : r.action);
    var actor = '<b>' + U.esc(r.actor_email || 'حساب غير معروف') + '</b>';
    var obj = e ? (U.esc(dict(ENT_OBJ, e) || ('الصفّ في جدول «' + e + '»'))) : '';
    var idPart = '';
    if (r.entity_id != null && String(r.entity_id) !== '') {
      idPart = ' رقم <span class="mono">' + U.esc(String(r.entity_id)) + '</span>';
    }

    var txt;
    if (kind === 'login' || kind === 'logout') {
      txt = actor + ' ' + (dict(VERB, kind) || '');
    } else if (kind === 'other') {
      txt = actor + ' نفّذ الإجراء <span class="mono">' + U.esc(raw) + '</span>' +
            (obj ? ' على ' + obj : '') + idPart;
      return txt;                       // لا نُكرّر الإجراء الخام مرّتين
    } else {
      txt = actor + ' ' + (dict(VERB, kind) || 'نفّذ إجراءً على') + ' ' +
            (obj || 'الصفّ (جدوله غير مُسجَّل)') + idPart;
    }
    if (raw) txt += ' <span class="mono">· ' + U.esc(raw) + '</span>';
    return txt;
  }

  /* ------------------------- الكيانات الموجودة فعلًا ------------------------- */
  /* البادئة '#' مقصودة: قيمة entity قادمة من قاعدة البيانات، ومفتاح مثل '__proto__'
     لا يُخزَّن كخصيصة عادية فيُكرَّر الزرّ ويصبح العدّ NaN. */
  function entList() {
    var seen = {}, order = [], i, v, k;
    for (i = 0; i < rows.length; i++) {
      v = entOf(rows[i]);
      k = '#' + v;
      if (!Object.prototype.hasOwnProperty.call(seen, k)) { seen[k] = 0; order.push(v); }
      seen[k]++;
    }
    order.sort();
    return order.map(function (x) { return { v: x, n: seen['#' + x] }; });
  }

  /* عدد الجداول الحقيقية في الصفوف المقروءة — السطور بلا كيان ليست جدولًا فلا تُحتسب */
  function entRealCount() {
    var l = entList(), c = 0, i;
    for (i = 0; i < l.length; i++) if (l[i].v) c++;
    return c;
  }

  function readQ() {
    var el = U.$('#audit-q');
    return el ? String(el.value == null ? '' : el.value).replace(/^\s+|\s+$/g, '') : q;
  }

  /* تصفية داخل المتصفّح على الصفوف المقروءة فقط */
  function apply() {
    var needle = q.toLowerCase();
    return rows.filter(function (r) {
      if (ent !== '*' && entOf(r) !== ent) return false;
      if (!needle) return true;
      var hay = (String(r.actor_email == null ? '' : r.actor_email) + ' ' +
                 String(r.action == null ? '' : r.action)).toLowerCase();
      return hay.indexOf(needle) >= 0;
    });
  }

  /* -------------------------------- الرسم -------------------------------- */
  function noteHtml() {
    return U.notice(
      '<b>ما يرصده هذا السجلّ وما لا يرصده.</b><br>' +
      'يُدوّن هذا الجدول ما تفعله لوحة التحكّم نفسها فقط: إضافة وتعديل وحذف الصفوف ورفع الملفات ' +
      'من هذه اللوحة. أيّ تغيير يجري من خارجها — مباشرة في Supabase، أو عند إعادة بناء الموقع ' +
      'من ملفات المصدر — لا يظهر هنا.<br>' +
      'والتدوين يجري بـ«أفضل جهد»: إذا فشلت كتابة السطر لا يُلغى الإجراء نفسه، ولذلك ' +
      '<b>غياب سطر لا يعني أن التغيير لم يحدث</b>، كما أنّ وجود سطر لا يُثبت وحده أن الإجراء اكتمل.<br>' +
      'ولن تجد زرّ حذف في هذه الشاشة، وهذا مقصود: سجلّ عمليات يمكن محوه من شاشته لا قيمة له. ' +
      'إن لزم حذف أو أرشفة فمن Supabase مباشرة وبقرار مُوثَّق خارج اللوحة.'
    );
  }

  function metricsHtml(shown) {
    var h = '<div class="metric-grid">';
    h += total == null
      ? '<div class="metric warn"><div class="mv">—</div><div class="ml">الإجمالي في الجدول (تعذّر قراءته)</div></div>'
      : '<div class="metric"><div class="mv">' + F.num(total) + '</div><div class="ml">إجمالي السطور في الجدول</div></div>';
    h += '<div class="metric"><div class="mv">' + F.num(rows.length) + '</div><div class="ml">المقروء في هذه الصفحة</div></div>';
    h += '<div class="metric"><div class="mv">' + F.num(shown) + '</div><div class="ml">المطابق للتصفية الحالية</div></div>';
    h += '<div class="metric"><div class="mv">' + F.num(entRealCount()) + '</div><div class="ml">الجداول الظاهرة في الصفوف المقروءة</div></div>';
    h += '</div>';
    return h;
  }

  function filterbarHtml() {
    var list = entList();
    var h = '<div class="filterbar">' +
      '<button class="btn sm' + (ent === '*' ? ' ok' : ' ghost') + '" data-act="auditFilter" data-arg="*">' +
      'الكل (' + F.num(rows.length) + ')</button>';
    list.forEach(function (it) {
      var label = it.v ? U.esc(dict(ENT_NAME, it.v) || it.v) : 'بلا كيان';
      h += '<button class="btn sm' + (ent === it.v ? ' ok' : ' ghost') + '" data-act="auditFilter" ' +
        'data-arg="' + U.esc(it.v) + '">' + label + ' (' + F.num(it.n) + ')</button>';
    });
    return h + '</div>';
  }

  function searchHtml() {
    return '<div class="fld"><label for="audit-q">بحث في البريد الإلكتروني أو اسم الإجراء</label>' +
      '<div class="addrow">' +
      '<input id="audit-q" type="text" value="' + U.esc(q) + '" placeholder="مثال: update أو name@example.com" />' +
      '<button class="btn sm" data-act="auditSearch">تصفية</button>' +
      '<button class="btn sm ghost" data-act="auditClear">مسح التصفية</button>' +
      '</div></div>' +
      '<div class="small muted">اكتب الكلمة ثم اضغط «تصفية». البحث يجري داخل المتصفّح على الصفوف ' +
      'المقروءة أعلاه فقط (' + F.num(rows.length) + ' سطرًا)، لا على كامل الجدول.</div>';
  }

  function timelineHtml(list) {
    return '<div class="timeline">' + list.map(function (r) {
      return '<div class="tl-item">' +
        '<div class="tl-ic">' + svgOf(kindOf(r.action)) + '</div>' +
        '<div><div class="tl-txt">' + sentence(r) + '</div>' +
        '<div class="tl-date">' + U.esc(F.date(r.created_at)) + '</div></div>' +
        '</div>';
    }).join('') + '</div>';
  }

  function paint() {
    if (!mountEl) return;
    /* لا نقول «أحدث 200 عملية» لأن الجدول قد يحوي أقلّ من ذلك — 200 حدّ أعلى للقراءة لا عدد مؤكَّد */
    var h = U.head('سجلّ العمليات',
      'أحدث العمليات المُسجَّلة من لوحة التحكّم، الأحدث أولًا، بحدّ أعلى ' + F.num(LIMIT) + ' سطرًا.');
    h += noteHtml();

    if (loadErr) {
      h += U.notice('<b>تعذّرت قراءة سجلّ العمليات.</b><br>' + U.esc(loadErr) +
        '<br>لم يُعرض أيّ سطر، ولا نعرف عدد السطور الموجودة فعلًا.');
      h += U.card('', '<div class="right"><button class="btn ghost sm" data-act="auditReload">إعادة المحاولة</button></div>');
      mountEl.innerHTML = h;
      return;
    }

    var list = apply();
    h += metricsHtml(list.length);

    if (total != null && total > rows.length) {
      h += '<div class="small muted" style="margin-block-end:14px">في الجدول ' + F.num(total) +
        ' سطرًا، والمعروض هنا أحدث ' + F.num(rows.length) + ' سطرًا فقط.</div>';
    }

    h += filterbarHtml();

    var body = searchHtml();
    if (!rows.length) {
      body += U.empty('لا توجد بيانات') +
        '<div class="small muted" style="text-align:center">' +
        'قد يكون السجلّ فارغًا فعلًا، وقد لا تسمح سياسات قاعدة البيانات لدورك بقراءته — ' +
        'القراءة الممنوعة ترجع نتيجة فارغة لا رسالة خطأ، فلا نستطيع التمييز بينهما من هنا.</div>';
    } else if (!list.length) {
      body += U.empty('لا يوجد سطر مطابق للتصفية أو البحث الحالي');
    } else {
      body += timelineHtml(list);
    }

    h += U.card('العمليات المُسجَّلة', body,
      '<button class="btn ghost sm" data-act="auditReload">تحديث من قاعدة البيانات</button>');

    mountEl.innerHTML = h;
  }

  /* -------------------------------- القراءة -------------------------------- */

  var WAIT = 'جارٍ قراءة سجلّ العمليات…';

  /* منطقة العرض (#viewArea) واحدة لكل الشاشات: لو انتقل المستخدم إلى شاشة أخرى قبل
     وصول البيانات، فرسمُنا سيمحو تلك الشاشة. نتعرّف على ذلك من محتوى المنطقة نفسها:
     إن لم يكن فيها انتظارُنا ولا أزرارُنا فقد رسم غيرُنا فيها، فنمتنع عن الرسم.
     (لا نعتمد على location.hash: تعذّر ضبطه يجعل الشاشة لا تُرسم أبدًا.) */
  function gone() {
    if (!mountEl) return true;
    var h = String(mountEl.innerHTML || '');
    return h.indexOf('data-act="audit') < 0 && h.indexOf(WAIT) < 0;
  }

  function load() {
    loadErr = '';
    if (mountEl) mountEl.innerHTML = U.spinner(WAIT);
    /* id.desc ثانويًّا: عدّة سطور قد تحمل الطابع الزمني نفسه، وبدون مفتاح ثانٍ
       يصبح ترتيب أوّل 200 سطر غير مستقرّ بين قراءة وأخرى. */
    return A.select('audit_log',
      'select=id,actor_email,action,entity,entity_id,created_at&order=created_at.desc,id.desc&limit=' + LIMIT)
      .then(function (list) {
        rows = list || [];
        /* الإجمالي منفصل: فشله لا يُفشل الشاشة، ونقول إنه غير متاح بدل تلفيق رقم */
        return A.count('audit_log', 'select=id').then(
          function (n) { return n; },
          function () { return null; }
        );
      })
      .then(function (n) {
        /* النواة تُرجع 0 إذا غابت ترويسة Content-Range أو تعذّر تحليلها. صفر مع وجود
           صفوف مقروءة يعني ترويسة غير موثوقة، فنقول «تعذّر قراءته» ولا نعرض رقمًا كاذبًا. */
        total = (n == null || !isFinite(n) || n < rows.length) ? null : Number(n);
        if (gone()) return;
        paint();
      })
      .catch(function (e) {
        rows = []; total = null;
        loadErr = (e && e.message) || 'فشل الإجراء';
        if (gone()) return;
        U.toast(loadErr, 'err');
        paint();
      });
  }

  IAQ.views.register(KEY, {
    label: 'سجلّ العمليات',
    group: 'عام',
    icon: '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>' +
          '<rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>',
    render: function (mount) {
      mountEl = mount;
      ent = '*';
      q = '';
      return load();
    }
  });

  /* الأحداث بالتفويض — نقرأ نصّ البحث قبل كلّ إعادة رسم كي لا يضيع ما كُتب */
  IAQ.on('auditFilter', function (btn) {
    q = readQ();
    ent = btn.getAttribute('data-arg');
    if (ent == null) ent = '*';
    paint();
  });

  IAQ.on('auditSearch', function () {
    q = readQ();
    paint();
  });

  IAQ.on('auditClear', function () {
    q = '';
    ent = '*';
    paint();
  });

  IAQ.on('auditReload', function () {
    load();
  });
})();
</script>
<script>IAQ.boot();</script>
</body>
</html>
