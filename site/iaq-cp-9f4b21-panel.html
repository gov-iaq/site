<style>
:root{--t:#007878;--td:#063f36;--g:#c09048;--ink:#0f2a2a;--body:#47534f;--muted:#5c6b67;--line:#e5eae9;--bg:#f3f6f7;--surface:#fff;--disp:'El Messiri',serif;--ui:'Tajawal',sans-serif;--teal:var(--t);--teal-600:var(--td);--gold:var(--g);--gold-600:#a3762f;--surface-2:#eef3f3}
*{box-sizing:border-box;margin:0;padding:0}
/* الوسم hidden يجب أن يُخفي دائمًا. قاعدةُ المتصفّح [hidden]{display:none}
   تتغلّب عليها أي قاعدةٍ للمؤلّف تُعطي العنصر display صريحًا — و.btn
   يُعطيه inline-flex، فبقي زرُّ الحفظ الأعلى ظاهرًا رغم إخفائه. أُصلح
   هذا في نمط الموقع ونُسي في نمط اللوحة. */
[hidden]{display:none!important}
body{font-family:var(--ui);background:var(--bg);color:var(--body);line-height:1.7;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
/* بطاقاتُ لوحة التحكّم — بلغة بطاقات الموقع: نصفُ قطرٍ وحدٌّ وظلٌّ يعلو
   عند التحويم. ولا يبدأ اسمٌ منها بـad- ولا يحوي banner: حاجبات الإعلانات
   تُخفيها فتختفي اللوحة، وقد وقع ذلك فعلًا. */
/* تبويبات لوحة التحكّم: خطٌّ سفليٌّ يتبع النشط — لا صناديق، فالشاشة
   مليئةٌ ببطاقاتٍ وحدودٍ سلفًا. */
.dash-tabs{display:flex;gap:4px;border-block-end:1px solid var(--line);
  margin-block-end:16px;overflow-x:auto;scrollbar-width:none}
.dash-tabs::-webkit-scrollbar{display:none}
.dash-tab{background:none;border:0;border-block-end:2.5px solid transparent;
  padding:11px 16px;font:inherit;font-size:14.5px;font-weight:600;color:var(--muted);
  cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s;margin-block-end:-1px}
.dash-tab:hover{color:var(--ink)}
.dash-tab.is-on{color:var(--t);border-block-end-color:var(--t)}
/* حلقةُ التركيز شريطٌ داخليٌّ لا صندوقٌ ذهبيّ: الصندوق يُشبه حالةَ التحديد
   فيُربك القارئ عن التبويب النشط الحقيقيّ. */
.dash-tab:focus-visible{outline:none;box-shadow:inset 0 -3px 0 var(--g)}
/* مكتبة الوسائط: شبكةٌ تتكيّف، ومعاينةٌ بنسبةٍ ثابتة فلا ترقص الصفوف */
.ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr));gap:12px}
.ml-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px;display:flex;flex-direction:column;gap:6px;text-align:start;
  transition:border-color .2s,box-shadow .2s}
.ml-item:hover{border-color:var(--t);box-shadow:0 8px 20px -12px rgba(6,63,54,.4)}
.ml-hit{display:block;width:100%;background:none;border:0;padding:0;font:inherit;
  color:inherit;text-align:start;cursor:pointer}
.ml-hit:focus-visible{outline:2px solid var(--t);outline-offset:2px;border-radius:9px}
.ml-thumb{aspect-ratio:4/3;background:var(--surface-2);border-radius:9px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.ml-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.ml-name{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml-meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ml-acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-block-start:2px}
.ml-grid.is-pick{max-height:60vh;overflow:auto}
.iaq-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-block-end:14px}
@media (max-width:1100px){.iaq-kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.iaq-kpi-grid{grid-template-columns:1fr}}
.iaq-kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px 14px;transition:border-color .25s,box-shadow .25s,transform .25s;
  display:flex;flex-direction:column;min-height:118px}
.iaq-kpi:hover{border-color:var(--t);box-shadow:0 10px 26px -14px rgba(6,63,54,.42);transform:translateY(-2px)}
.iaq-kpi.is-gold{border-color:rgba(192,144,72,.5);background:linear-gradient(160deg,rgba(192,144,72,.07),transparent 60%)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block-end:8px}
.kpi-ico{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--t);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.iaq-kpi.is-gold .kpi-ico{background:rgba(192,144,72,.14);color:#8a6224}
.kpi-ico svg{width:18px;height:18px}
.kpi-delta{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-val{font-family:var(--disp);font-size:2rem;line-height:1.15;color:var(--ink);
  font-variant-numeric:tabular-nums}
.kpi-lbl{font-size:13.5px;color:var(--muted);margin-block-start:2px}
.kpi-sub{font-size:12px;color:var(--muted);margin-block-start:6px}
.kpi-spark{margin-block-start:auto;padding-block-start:10px;opacity:.85}
.card-h{margin:0 0 12px;font-family:var(--disp);font-size:1.05rem;color:var(--ink)}
/* --muted كان #7a8683: تضادُّه ٣.٧٧ على الأبيض و٣.٣٧ على السطح الثاني، وبه
   سبعةٌ وستّون تلميحًا وتسميةُ كل رقم. صار #5c6b67 فيعبُر ٤.٥:١ على الأسطح
   الثلاثة (٥.٥٩ و٥.١٥ و٤.٩٩) ويبقى أفتحَ من --body فيُقرأ ثانويًّا. */

/* «ماذا أفعل الآن؟»: سطرٌ واحدٌ زرٌّ كامل — أكبرُ من أن يُخطئه الإصبع، وفي
   ترتيب التنقّل، وله حالةُ تركيزٍ ظاهرة. */
.now-row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;
 padding:13px 14px;margin-block-end:8px;background:var(--surface);cursor:pointer;
 border:1px solid var(--line);border-radius:12px;font:inherit;color:var(--ink);
 transition:background .16s,border-color .16s}
.now-row:last-child{margin-block-end:0}
.now-row:hover{background:#f4f9f8;border-color:#c9dedb}
.now-row:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.now-row.is-urgent{border-inline-start:4px solid #b4471f;background:#fdf6f3}
.now-row.is-urgent:hover{background:#fbeee8}
.now-ico{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;
 border-radius:9px;background:#eef4f3;color:var(--t)}
.now-row.is-urgent .now-ico{background:#f7e3da;color:#8c3d1c}
.now-ico svg{width:19px;height:19px}
.now-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.now-txt b{font-weight:700;font-size:.97rem;line-height:1.5}
.now-sub{color:var(--muted);font-size:.82rem;line-height:1.6}
.now-go{flex:0 0 auto;color:var(--muted)}
.now-go svg{width:18px;height:18px}
.topbar{position:sticky;top:0;z-index:50;height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
.tb-left{display:flex;align-items:center;gap:12px}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-brand img{width:34px;height:34px;object-fit:contain}
.tb-title{font-family:var(--disp);font-weight:700;color:var(--ink);font-size:16px;line-height:1.2}
.tb-title small{display:block;font-family:var(--ui);font-weight:500;color:var(--muted);font-size:11px}
.badge{background:#fff8ec;border:1px solid #ecd9b0;color:#8a6d2a;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.tb-actions{display:flex;align-items:center;gap:8px}
.hamb{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:4px;display:none}
.hamb span{width:18px;height:2px;background:var(--ink);border-radius:2px}
.app{display:grid;grid-template-columns:264px 1fr;min-height:calc(100vh - 62px)}
aside{background:#fff;border-inline-end:1px solid var(--line)}
.sidebar-inner{position:sticky;top:62px;max-height:calc(100vh - 62px);overflow-y:auto;padding:14px 12px}
.nav-group{font-size:11px;color:var(--muted);font-weight:700;padding:16px 12px 6px;letter-spacing:.3px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:none;background:none;border-radius:10px;cursor:pointer;color:var(--body);font-family:var(--ui);font-size:14.5px;font-weight:500;text-align:right;position:relative;transition:background .15s,color .15s}
.nav-item svg{width:20px;height:20px;color:var(--muted);flex:none}
.nav-item:hover{background:#eef4f3;color:var(--t)}
.nav-item.active{background:#e3f1f0;color:var(--t);font-weight:700}
.nav-item.active svg{color:var(--t)}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;background:var(--g);border-radius:3px}
main{padding:26px 30px;min-width:0}
.view-head h1{font-family:var(--disp);font-size:1.7rem;color:var(--ink)}
.view-head p{color:var(--muted);margin-top:4px;margin-bottom:22px}
.sub{font-family:var(--disp);font-size:1.15rem;color:var(--ink);margin:26px 0 14px}
.iaq-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.iaq-card h3{font-family:var(--disp);font-size:1.15rem;color:var(--ink);margin-bottom:14px}
.muted{color:var(--muted)}.small{font-size:.85rem}.mono{font-family:monospace;direction:ltr;font-size:.85rem;color:var(--muted)}
.notice{background:#fff8ec;border:1px solid #ecd9b0;color:#6b5320;border-radius:12px;padding:14px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.notice b{color:#5a4413}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.stat-box .sv{font-family:var(--disp);font-weight:700;font-size:1.7rem;color:var(--t)}
.stat-box .sl{color:var(--muted);font-size:.9rem;margin-top:4px}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qa{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;font-family:var(--ui);font-weight:600;color:var(--ink);transition:all .18s}
.qa:hover{border-color:var(--t);color:var(--t);transform:translateY(-2px);box-shadow:0 10px 24px rgba(6,63,54,.08)}
.qa svg{width:22px;height:22px;color:var(--t);flex:none}
.cols{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.preview-col{position:sticky;top:80px}
.preview-label{font-weight:700;color:var(--ink);margin-bottom:10px;font-family:var(--disp)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:6px}
.fld input,.fld select,.fld textarea,.addrow input,.addrow select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:var(--ui);font-size:14px;background:#fff;color:var(--ink)}
.fld textarea{min-height:82px;resize:vertical}

.dtxt:focus{outline:none;border-color:var(--t);box-shadow:0 0 0 3px rgba(0,120,120,.12)}
.notes{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.note{background:#fbf9f3;border:1px solid #ecd9b0;border-radius:10px;padding:10px 12px;font-size:13px}
.note p{margin-top:4px;color:var(--body)}
.timeline{display:flex;flex-direction:column;gap:14px}
.tl-item{display:flex;gap:12px;align-items:flex-start}
.tl-ic{width:30px;height:30px;border-radius:50%;background:#e3f1f0;color:var(--t);display:flex;align-items:center;justify-content:center;flex:none}
.tl-ic svg{width:15px;height:15px}
.tl-txt{font-size:13px;color:var(--ink)}
.tl-date{font-size:11px;color:var(--muted);margin-top:2px}
.u-cell{display:flex;align-items:center;gap:10px}
.u-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--t),var(--td));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--disp);flex:none}
.role-card{padding:20px}
.role-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.role-head b{font-family:var(--disp);font-size:1.1rem;color:var(--ink)}
.perm-tbl{width:100%;border-collapse:collapse}
.perm-tbl th{font-size:12px;color:var(--muted);font-weight:700;padding:8px;text-align:right;border-bottom:1px solid var(--line)}
.perm-tbl th.ac,.perm-tbl td.ac{text-align:center;width:66px}
.perm-tbl td{padding:8px;font-size:13.5px;color:var(--body);border-bottom:1px solid var(--line)}
.pcheck{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;position:relative;transition:all .15s}
.pcheck.on{background:var(--t);border-color:var(--t)}
.pcheck.on::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.lockcheck{color:#0f8f56;font-weight:700}
.snips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
.snip{padding:7px 12px;border:1px solid var(--line);background:#f7fafa;border-radius:8px;font-family:var(--ui);font-size:12.5px;color:var(--t);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.snip:hover{border-color:var(--t);background:#e3f1f0}
.snip svg{width:14px;height:14px}
.blocks{display:flex;flex-direction:column;gap:14px}
.code-block{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cb-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f7fafa;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cb-title{flex:1;min-width:120px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-family:var(--ui);font-size:13.5px;font-weight:600}
.cb-pos{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-family:var(--ui);font-size:12.5px}
.code-editor{width:100%;min-height:160px;padding:14px;border:none;font-family:'Courier New',monospace;font-size:13px;line-height:1.7;direction:ltr;text-align:left;background:#0f2a2a;color:#d7e8e4;resize:vertical}
.code-editor:focus{outline:none}
.code-editor.sm{min-height:100px;border:1px solid var(--line);border-radius:10px}
.psel{padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-family:var(--ui);font-size:13.5px}
.code-preview{width:100%;height:520px;border:1px solid var(--line);border-radius:12px;background:#fff}
</style>
</head>

/* ---------- charts ---------- */
function areaChart(series,labels){
 var W=580,H=200,pl=6,pr=6,pt=16,pb=26,n=series.length;
 var max=Math.max.apply(null,series)*1.15||1;
 var X=function(i){return pl+i*(W-pl-pr)/(n-1);};
 var Y=function(v){return H-pb-(v/max)*(H-pt-pb);};
 var pts=series.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);});
 var line='M'+pts.join(' L');
 var area=line+' L'+X(n-1).toFixed(1)+','+(H-pb)+' L'+X(0).toFixed(1)+','+(H-pb)+' Z';
 var grid='';[0.25,0.5,0.75,1].forEach(function(f){var y=Y(max*f);grid+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="c-grid"/>';});
 var lab='';var step=Math.max(1,Math.ceil(n/6));for(var i=0;i<n;i+=step){lab+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" class="c-ax">'+esc(labels[i])+'</text>';}
 return '<svg viewBox="0 0 '+W+' '+H+'" class="chart-svg"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#007878" stop-opacity=".26"/><stop offset="1" stop-color="#007878" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" class="c-area"/><path d="'+line+'" class="c-line"/>'+lab+'</svg>';
}
function groupedBars(labels,a,b,la,lb){
 var max=Math.max(Math.max.apply(null,a),Math.max.apply(null,b))*1.12||1;
 var g=labels.map(function(l,i){return '<div class="bargrp"><div class="bpair"><div class="bar b1" style="height:'+(a[i]/max*100).toFixed(1)+'%"></div><div class="bar b2" style="height:'+(b[i]/max*100).toFixed(1)+'%"></div></div><div class="bx">'+esc(l)+'</div></div>';}).join('');
 return '<div class="bars">'+g+'</div><div class="mini-legend"><span><i class="d" style="background:#007878"></i>'+esc(la)+'</span><span><i class="d" style="background:#c09048"></i>'+esc(lb)+'</span></div>';

function donut(data,center){
 var total=data.reduce(function(s,d){return s+d.value;},0)||1,acc=0;
 var stops=data.map(function(d){var a=(acc/total*100);acc+=d.value;var b=(acc/total*100);return d.color+' '+a.toFixed(2)+'% '+b.toFixed(2)+'%';}).join(',');
 var legend=data.map(function(d){return '<div class="lg-row"><span class="lg-dot" style="background:'+d.color+'"></span><span class="lg-name">'+esc(d.label)+'</span><span class="lg-val">'+nf(d.value)+'</span></div>';}).join('');

}
function hbars(data){

/* حرزُ ما لم يُحفظ قبل أيّ انتقال — من القائمة أو من زرٍّ داخليّ. الحرزُ
   مشتركٌ مع شاشات screens.js فلا يفترق سلوكُ اللوحة بين نصفَيها. */
function curLabel(){for(var i=0;i<NAV.length;i++){if(NAV[i]&&NAV[i].k===current)return NAV[i].label;}return 'الشاشة الحالية';}
function switchView(k){if(k!==current&&window.IAQ_DIRTY&&!window.IAQ_DIRTY.ok())return;current=k;renderSidebar();$('#viewArea').innerHTML=views[k]();afterRender(k);window.scrollTo(0,0);closeDrawer();}
/* إغلاقُ التبويب أو تحديثُه: المتصفّح يسأل بنفسه إن كان هناك ما يُفقَد */
window.addEventListener('beforeunload',function(e){if(window.IAQ_DIRTY&&window.IAQ_DIRTY.has()){e.preventDefault();e.returnValue='';return '';}});
/* بعد كل انتقال: التركيزُ ينزل إلى عنوان الشاشة الجديدة. كان يسقط إلى جسم
   الصفحة، فمن يتنقّل بلوحة المفاتيح يبدأ من رأس الصفحة كلَّ مرّة — إحدى
   وعشرون ضغطةَ Tab قبل أوّل حقل. و tabindex="-1" يجعل العنوان قابلًا للتركيز
   برمجيًّا وحده فلا يدخل ترتيبَ التنقّل.
   وأُسقط startLive: مُحاكي «زوّار الآن» بأرقام Math.random من النموذج الأوّلي،
   ومفتاحُ dashboard صار يعرض لوحةً تقرأ أرقامًا حقيقية. */
function afterRender(k){
 if(k==="theme")applyPreview();
 var h=$('#viewArea').querySelector('h1');
 if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(e){h.focus();}}
}

function applyPreview(){var el=$('#themePreview');if(!el)return;var t=config.theme;el.style.setProperty('--pp',t.primary);el.style.setProperty('--pa',t.accent);el.style.setProperty('--pbg',t.bg);el.style.setProperty('--psurf',t.surface);el.style.setProperty('--psurf2',t.surface2);el.style.setProperty('--pink',t.ink);el.style.setProperty('--pbody',t.body);el.style.setProperty('--phero',t.heroBg);el.style.setProperty('--prad',t.radius+'px');el.style.setProperty('--phead',"'"+t.headFont+"'");el.style.setProperty('--pbodyf',"'"+t.bodyFont+"'");el.classList.toggle('pat',!!t.pattern);}

/* كان هنا save() على كل حرفٍ يُكتب: نشرٌ تلقائيٌّ في شاشتين، وزرُّ «حفظ
   التغييرات» تحتهما يُوهم أنّ ما قبله لم يُنشَر. الآن الزرُّ هو الناشرُ
   الوحيد كما في الشاشات السبع عشرة الأخرى، والحرزُ يمنع فقدَ ما كُتب. */
document.addEventListener('input',function(e){var t=e.target;var p=t.getAttribute('data-bind');if(!p)return;var v=(t.type==='checkbox')?t.checked:t.value;setP(config,p,v);if(window.IAQ_DIRTY)window.IAQ_DIRTY.mark(curLabel());if(t.hasAttribute('data-sync')){$$('[data-bind="'+p+'"][data-sync]').forEach(function(o){if(o!==t)o.value=t.value;});}if(p.indexOf('theme.')===0){applyPreview();if(p==='theme.radius'){var rv=$('#radVal');if(rv)rv.textContent=t.value;}}});
document.addEventListener('change',function(e){var t=e.target;var up=t.getAttribute('data-upload');if(up){handleUpload(up,t);return;}var role=t.getAttribute('data-role');if(role==='assign'){var id=t.getAttribute('data-id');find(id).assignee=t.value;save();toast('تم الإسناد إلى '+(userName(t.value)||'لا أحد'));openSub(id);return;}if(role==='priority'){find(t.getAttribute('data-id')).priority=t.value;save();return;}if(role==='urole'){var u=config.users.filter(function(x){return x.id===t.getAttribute('data-id');})[0];if(u){u.role=t.value;save();toast('تم تحديث الدور');}return;}if(role==='codepage'){codePage=t.value;switchView('code');return;}var p=t.getAttribute('data-bind');if(p&&t.tagName==='SELECT'){setP(config,p,t.value);save();}});
document.addEventListener('click',function(e){
 var nb=e.target.closest('[data-nav]');if(nb){switchView(nb.getAttribute('data-nav'));return;}
 var pr=e.target.closest('[data-preset]');if(pr){var key=pr.getAttribute('data-preset');if(PRESETS[key]){config.theme=JSON.parse(JSON.stringify(PRESETS[key]));save();switchView('theme');toast('تم تطبيق النمط');}return;}
 var a=e.target.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act');var path=a.getAttribute('data-path');var i=a.getAttribute('data-i');i=(i==null?null:parseInt(i,10));var id=a.getAttribute('data-id');
 switch(act){
  /* الزرّ ينتظر النتيجةَ الحقيقية: كان يُصدر «تم حفظ التغييرات» فورًا، أي قبل
     أن تبدأ الكتابةُ (مُهلة ٧٠٠ مللي) وقبل معرفةِ نجاحها. */
  case 'save': {var sb=a;sb.disabled=true;var was=sb.textContent;sb.textContent='جارٍ الحفظ…';
   Promise.resolve(save(true)).then(function(ok){sb.disabled=false;sb.textContent=was;
    if(ok===false){toast('لم يُحفظ — التفصيل في شريط الأسفل');return;}
    if(window.IAQ_DIRTY)window.IAQ_DIRTY.clear();toast('حُفظ ونُشر');});break;}
  case 'toggle': setP(config,path,!getP(config,path));if(window.IAQ_DIRTY)window.IAQ_DIRTY.mark(curLabel());rerender();break;
  case 'up': case 'down': {var arr=getP(config,path);var j=act==='up'?i-1:i+1;if(j<0||j>=arr.length)break;var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;if(window.IAQ_DIRTY)window.IAQ_DIRTY.mark(curLabel());rerender();break;}
  case 'del': {getP(config,path).splice(i,1);save();rerender();break;}
  case 'add-child': config.menu[i].children.push({id:uid(),label:"عنصر جديد",href:"#"});save();switchView('menu');break;
  case 'add-menu': config.menu.push({id:uid(),label:($('#newMenuLabel').value.trim()||"عنصر جديد"),href:($('#newMenuHref').value.trim()||"#"),visible:true,children:[]});save();switchView('menu');toast('تمت الإضافة');break;
  case 'add-page': {var tt=$('#npTitle').value.trim();if(!tt){toast('أدخل عنوان الصفحة');break;}config.pages.push({id:uid(),title:tt,slug:($('#npSlug').value.trim()||('page-'+uid())),type:$('#npType').value,status:$('#npStatus').value});save();switchView('pages');toast('تم إنشاء الصفحة');break;}
  case 'del-page': config.pages.splice(i,1);save();switchView('pages');break;
  /* case 'add-section' حُذف: كان يُنشئ قسمًا بمفتاح custom_… لا وجودَ له في
     الصفحة، فتتخطّاه collectSite في الجسر ولا يُكتب له شيء — ومع ذلك يُصدر
     «تمت إضافة القسم» ويبقى صفًّا دائمًا في settings.sections. وزرُّ الحذف
     بجانبه حُذف كذلك: كان يُخرج القسمَ من القائمة، فإن كان مُخفيًا بقي
     تجاوزُ الإخفاء ساريًا على الموقع بلا صفٍّ يُلغيه — إخفاءٌ لا رجعةَ فيه
     من اللوحة. */
  case 'add-news': config.news.unshift({id:uid(),tag:"عام",date:"اليوم",title:"عنوان الخبر الجديد",excerpt:"اكتب مقتطف الخبر هنا."});save();switchView('news');break;
  case 'del-news': config.news.splice(i,1);save();switchView('news');break;
  case 'del-media': config.media.splice(i,1);save();switchView('media');break;
  case 'copy-media': try{navigator.clipboard.writeText(config.media[i].src);}catch(e2){}toast('تم نسخ الرابط');break;
  case 'theme-reset': config.theme=JSON.parse(JSON.stringify(defaults().theme));save();switchView('theme');toast('تمت إعادة الضبط');break;
  case 'logo-reset': config.brand.logo=EMBLEM;save();switchView('logo');break;
  case 'export': exportConfig();break;
  case 'reset-all': if(confirm('استعادة كل الإعدادات الافتراضية؟ ستفقد تعديلاتك.')){config=defaults();save();switchView(current);toast('تمت الاستعادة');}break;
  case 'range': range=parseInt(a.getAttribute('data-r'),10);switchView('dashboard');break;
  case 'subfilter': subFilter=a.getAttribute('data-t');switchView('subs');break;
  case 'sub-open': openSub(id);break;
  case 'sub-close': closeSub();break;
  case 'sub-status': {var s=find(id);s.status=a.getAttribute('data-s');if(s.status==='تم الرد'&&s.rt==null)s.rt=Math.max(1,Math.round(Math.random()*8));save();openSub(id);toast('تم تحديث الحالة');break;}
  case 'tpl': {var ta=$('#replyText');if(ta)ta.value=REPLY_TPL[i][1];break;}
  case 'sub-reply': {var sub=find(id);var ta2=$('#replyText');var txt=(ta2&&ta2.value.trim());if(!txt){toast('اكتب نص الرد');break;}sub.replies.push({by:'أنت',text:txt,date:'الآن'});sub.status='تم الرد';if(sub.rt==null)sub.rt=Math.max(1,Math.round(Math.random()*6));save();openSub(id);toast('تم إرسال الرد');break;}
  case 'sub-note': {var sub2=find(id);var na=$('#noteText');var nt=(na&&na.value.trim());if(!nt){toast('اكتب الملاحظة');break;}sub2.notes.push({by:'أنت',text:nt,date:'الآن'});save();openSub(id);break;}
  case 'add-user': {var un=$('#uName').value.trim();if(!un){toast('أدخل اسم المستخدم');break;}config.users.push({id:uid(),name:un,email:($('#uEmail').value.trim()||'user@incubator.org.sa'),role:$('#uRole').value,status:'نشط',last:'الآن'});save();switchView('users');toast('تمت إضافة المستخدم');break;}
  case 'del-user': config.users.splice(i,1);save();switchView('users');break;
  case 'ustatus': {var u=config.users.filter(function(x){return x.id===id;})[0];if(u){u.status=(u.status==='نشط'?'موقوف':'نشط');save();switchView('users');}break;}
  case 'perm': {var rid=a.getAttribute('data-role'),mod=a.getAttribute('data-mod'),ac=a.getAttribute('data-a');var r=config.roles.filter(function(x){return x.id===rid;})[0];if(r){r.perms[mod][ac]=!r.perms[mod][ac];save();a.classList.toggle('on');a.setAttribute('aria-pressed',r.perms[mod][ac]);}break;}
  case 'add-role': {var rn=$('#rName').value.trim();if(!rn){toast('أدخل اسم الدور');break;}config.roles.push({id:'r_'+uid(),name:rn,desc:($('#rDesc').value.trim()||'دور مخصّص'),perms:permsAll(false)});save();switchView('users');toast('تمت إضافة الدور');break;}
  case 'del-role': {var rid2=a.getAttribute('data-role');config.roles=config.roles.filter(function(x){return x.id!==rid2;});save();switchView('users');break;}
  case 'code-add': {if(!config.customCode.pages[codePage])config.customCode.pages[codePage]=[];config.customCode.pages[codePage].push({id:uid(),title:'كتلة جديدة',pos:'bottom',enabled:true,code:''});save();switchView('code');break;}
  case 'code-del': config.customCode.pages[codePage].splice(i,1);save();switchView('code');break;
  case 'code-preview': previewCode(config.customCode.pages[codePage][i].code);break;
  case 'code-preview-all': {var all=(config.customCode.pages[codePage]||[]).filter(function(b){return b.enabled;}).map(function(b){return b.code;}).join('\n');previewCode(all);break;}
  case 'snippet': {if(!config.customCode.pages[codePage])config.customCode.pages[codePage]=[];config.customCode.pages[codePage].push({id:uid(),title:SNIPPETS[i].name,pos:'bottom',enabled:true,code:SNIPPETS[i].code});save();switchView('code');toast('تمت إضافة المقطع');break;}
 }
});
function find(id){return config.submissions.filter(function(x){return x.id===id;})[0];}

      'margin-block-end:14px">' + msgs.join('<br><br>') + '</div>';
  }

  /* ================== «ماذا أفعل الآن؟» ==================
     كانت اللوحة تفتح على اثنين وعشرين رقمًا لا يقول أيٌّ منها ما يُفعَل. وهذه
     ثلاثةُ أسطرٍ أو أقلّ، كلُّ سطرٍ زرٌّ يهبط في الشاشة التي تُعالجه — ومبنيّةٌ
     من القراءات القائمة نفسها، لا قراءةً جديدةً غير مفتاحِ دورة المجلس.

     وإن لم يكن شيء فالسطرُ يقول ذلك صريحًا: قائمةٌ فارغةٌ تُقرأ عطلًا. */

  /* الإفرادُ والتثنيةُ والجمعُ بالقاعدة العربية، لا «2 طلبًا» ولا «6 يومًا»:
     f = [مفرد, مثنّى, جمعُ قلّة (٣–١٠), جمعُ كثرة (١١+)]. العددُ يُضاف في
     الأخيرين وحدهما — فالمفردُ والمثنّى تحملهما الصيغةُ نفسها. */
  function arNum(n, f) {
    n = Math.abs(Math.round(n));
    if (n === 1) return f[0];
    if (n === 2) return f[1];
    return n + ' ' + (n <= 10 ? f[2] : f[3]);
  }
  function daysLabel(n) {
    return arNum(n, ['يومٍ واحد', 'يومين', 'أيام', 'يومًا']);
  }
  function spanLabel(days) {
    days = Math.abs(Math.round(days));
    if (days < 60) return daysLabel(days);
    if (days < 365) return arNum(Math.round(days / 30), ['شهرٍ واحد', 'شهرين', 'أشهر', 'شهرًا']);
    return arNum(Math.round(days / 365), ['سنةٍ واحدة', 'سنتين', 'سنوات', 'سنة']);
  }
  /* تاريخٌ ميلاديٌّ كما يكتبه المدير إلى Date. يتحمّل «2026/1/24م» و
     «24/01/2026م»: الجزءُ ذو الأربع خاناتٍ هو السنة، ويُقرَّر الباقي بموضعه. */
  function gDate(s) {
    var p = String(s == null ? '' : s).replace(/[^\d/]/g, '').split('/').filter(Boolean);
    if (p.length !== 3) return null;
    var y, mo, d;
    if (p[0].length === 4) { y = +p[0]; mo = +p[1]; d = +p[2]; }
    else if (p[2].length === 4) { y = +p[2]; mo = +p[1]; d = +p[0]; }
    else return null;
    if (!(y > 1900 && y < 2200 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
    var dt = new Date(y, mo - 1, d);
    return isFinite(dt.getTime()) ? dt : null;
  }
  /* data-nav يعالجه مستمعُ ملفّ التصميم نفسه الذي يعالج القائمة الجانبية،
     فلا نحتاج مسارَ انتقالٍ ثانيًا يفترق عنه. */
  function nowRow(o) {
    return '<button type="button" class="now-row' + (o.urgent ? ' is-urgent' : '') +
      '" data-nav="' + esc(o.view) + '">' +
      '<span class="now-ico">' + ico(o.icon || 'clock') + '</span>' +
      '<span class="now-txt"><b>' + esc(o.txt) + '</b>' +
      (o.sub ? '<span class="now-sub">' + esc(o.sub) + '</span>' : '') + '</span>' +
      '<span class="now-go">' + ico('arrow') + '</span></button>';
  }
  /* term = دورةُ المجلس السارية: المحفوظُ فوق المبنيّ، حقلًا حقلًا */
  function termNow(term) {
    var end = gDate(term && term.end_g);
    if (!end) return null;
    var days = Math.round((end.getTime() - Date.now()) / 86400000);
    if (days < 0) {
      return { urgent: 1, icon: 'alert', view: 'board',
               txt: 'دورةُ مجلس الإدارة انتهت قبل ' + spanLabel(-days),
               sub: 'وهي منشورةٌ الآن على صفحة «مجلس الإدارة» — حدِّثها من هنا' };
    }
    if (days <= 60) {
      return { icon: 'clock', view: 'board',
               txt: 'دورةُ مجلس الإدارة تنتهي بعد ' + daysLabel(days),
               sub: 'جهّز التجديد وحدِّث تاريخَ الدورة من هذه الشاشة' };
    }
    return null;
  }
  function nowRows(subs, subsErr, oldest, open, late, term) {
    var out = [];
    if (subsErr) {
      out.push({ urgent: 1, icon: 'alert', view: 'subslist',
                 txt: 'تعذّرت قراءة الطلبات الواردة',
                 sub: subsErr });
    } else if (open) {
      out.push({ urgent: !!late, icon: 'inbox2', view: 'subslist',
                 txt: arNum(open, ['طلبٌ واحدٌ لم يُفتح بعد', 'طلبان لم يُفتحا بعد',
                                   'طلباتٍ لم تُفتح بعد', 'طلبًا لم تُفتح بعد']),
                 sub: (open === 1 ? 'وصل قبل ' : 'أقدمها وصل قبل ') + ageLabel(oldest) +
                      (late ? ' · ' + arNum(late, ['واحدٌ منها', 'اثنان منها',
                                                   'منها', 'منها']) +
                              ' فوق ثلاثة أيام' : '') });
    }
    var t = termNow(term);
    if (t) out.push(t);
    return out;
  }

  /* عمرٌ بالمللي ثانية إلى عبارةٍ عربية. مشتركٌ بين تبويبَي اللوحة كي لا
     يفترق الرقمُ نفسه بينهما كما افترق سلفًا. */
  function ageLabel(ms) {
    if (ms == null) return '—';
    var h = ms / 3600000;
    if (h < 1) return arNum(h * 60, ['دقيقةٍ واحدة', 'دقيقتين', 'دقائق', 'دقيقة']);
    if (h < 48) return arNum(h, ['ساعةٍ واحدة', 'ساعتين', 'ساعات', 'ساعة']);
    return daysLabel(h / 24);
  }
  /* سلسلة يوميّة كاملة — الأيام الخالية أصفار كي لا يكذب الرسم */
  function series(rows, days, filter) {
    var m = {};
    (rows || []).forEach(function (r) {
      if (filter && !filter(r)) return;
      m[r.day] = (m[r.day] || 0) + (Number(r.n) || 0);
    });
    var out = [];
    for (var i = days - 1; i >= 0; i--) {
      var d = dayStr(i);
      out.push({ x: d, t: d.slice(5).replace('-', '/'), y: m[d] || 0 });
    }
    return out;
  }
  function rangeBar(d) {
    var OPTS = [[7, 'أسبوع'], [30, '٣٠ يومًا'], [90, '٩٠ يومًا'],
                [365, 'سنة'], [0, 'منذ الإنشاء']];
    return '<div class="addrow" style="margin-block-end:14px;flex-wrap:wrap">' +
      OPTS.map(function (o) {
        return '<button class="btn ' + (Number(d) === o[0] ? '' : 'ghost') +
          '" data-sc="range" data-d="' + o[0] + '">' + esc(o[1]) + '</button>';
      }).join('') + '</div>';
  }
  function card(title, body, note) {
    return '<div class="iaq-card" style="margin-block-end:14px">' +
      '<h3 style="margin:0 0 12px;font-family:var(--disp);font-size:1.04rem">' + esc(title) + '</h3>' +
      body + (note ? '<p class="muted small" style="margin-block-start:10px">' + esc(note) + '</p>' : '') + '</div>';
  }
  function grid(n) { return '<div class="stat-grid" style="grid-template-columns:repeat(' + n + ',1fr)">'; }

  /* ============================ رسوم SVG ============================
     تُرسم بأيدينا لا بمكتبة: اللوحة ملفٌّ واحد بلا تبعية خارجية (وهذا يمنع
     أيضًا إرسال أي بيانات إلى طرفٍ ثالث). والقياسات نسبية فتتّسع للحاوية. */
  function svgEsc(s) { return esc(s); }
  function niceMax(v) {
    if (v <= 5) return 5;
    var p = Math.pow(10, String(Math.floor(v)).length - 1);
    return Math.ceil(v / p) * p;
  }

  /* خطّ زمنيّ بمنطقة مظلّلة. pts = [{x:'2026-08-01', y:12}, …] */
  function chartLine(pts, opt) {
    opt = opt || {};
    /* bare: شريطٌ صغيرٌ داخل بطاقة رقم — بلا شبكةٍ ولا تسمياتٍ ولا نقاط،
       فالمساحة 34px لا تتّسع لها والغرضُ اتجاهٌ لا قراءةُ قيم. */
    var W = 720, H = opt.h || 190;
    var PL = opt.bare ? 0 : 42, PR = opt.bare ? 0 : 8;
    var PT = opt.bare ? 2 : 12, PB = opt.bare ? 2 : 26;
    if (!pts.length) return '<div class="muted" style="padding:22px;text-align:center">لا بيانات في هذا المدى.</div>';
    var max = niceMax(Math.max.apply(null, pts.map(function (p) { return p.y; })) || 1);
    var iw = W - PL - PR, ih = H - PT - PB;
    var n = pts.length;
    function X(i) { return PL + (n === 1 ? iw / 2 : (iw * i) / (n - 1)); }
    function Y(v) { return PT + ih - (ih * v) / max; }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
    var area = line + ' L' + X(n - 1).toFixed(1) + ' ' + (PT + ih) + ' L' + X(0).toFixed(1) + ' ' + (PT + ih) + ' Z';
    var grid = '', ticks = 4;
    for (var g = 0; opt.bare ? false : g <= ticks; g++) {
      var v = (max / ticks) * g, y = Y(v);
      grid += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) +
        '" stroke="var(--line)" stroke-width="1"' + (g ? ' stroke-dasharray="3 4"' : '') + '/>' +
        '<text x="' + (PL - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--muted)">' +
        Math.round(v) + '</text>';
    }
    var lab = '', step = Math.max(1, Math.ceil(n / 7));
    for (var i = 0; opt.bare ? false : i < n; i += step) {
      lab += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' +
        svgEsc(pts[i].t || pts[i].x) + '</text>';
    }
    var dots = opt.bare ? '' : pts.map(function (p, i) {
      return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (n > 45 ? 1.6 : 3) +
        '" fill="var(--teal)"><title>' + svgEsc((p.t || p.x) + ' — ' + p.y) + '</title></circle>';
    }).join('');
    if (opt.bare) {
      return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
        'style="width:100%;height:' + H + 'px;display:block" aria-hidden="true">' +
        '<path d="' + area + '" fill="var(--teal)" opacity=".14"/>' +
        '<path d="' + line + '" fill="none" stroke="var(--teal)" stroke-width="3" ' +
        'stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" ' +
      'aria-label="' + svgEsc(opt.label || 'اتجاه زمنيّ') + '">' + grid +
      '<path d="' + area + '" fill="var(--teal)" opacity=".10"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--teal)" stroke-width="2.2" stroke-linejoin="round"/>' +
      dots + lab + '</svg>';
  }

  /* أعمدة أفقية — أفقيّة لأن التسميات العربية طويلة والعمودية تقطعها */
  function chartBars(items, opt) {
    opt = opt || {};
    if (!items.length) return '<div class="muted" style="padding:22px;text-align:center">لا بيانات.</div>';
    var top = items.slice(0, opt.top || 10);
    var max = Math.max.apply(null, top.map(function (i) { return i.n; })) || 1;
    return '<div style="display:grid;gap:8px">' + top.map(function (it) {
      var pct = Math.max(2, Math.round((it.n / max) * 100));
      return '<div style="display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center">' +
        '<div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(it.l) + '">' +
          esc(it.l) + '</div>' +
        '<div style="background:var(--surface-2,#f5f8f8);border-radius:999px;height:12px;overflow:hidden">' +
          '<div style="width:' + pct + '%;height:100%;background:' + (opt.gold ? 'var(--gold)' : 'var(--teal)') +
          ';border-radius:999px"></div></div>' +
        '<b class="small mono">' + it.n + '</b></div>';
    }).join('') + '</div>';
  }

  /* حلقة للتركيب */
  function chartDonut(items, opt) {
    opt = opt || {};
    var tot = items.reduce(function (s, i) { return s + i.n; }, 0);
    if (!tot) return '<div class="muted" style="padding:22px;text-align:center">لا بيانات.</div>';
    var COL = ['var(--teal)', 'var(--gold)', 'var(--teal-600)', 'var(--gold-600)', 'var(--muted)'];
    var R = 54, C = 2 * Math.PI * R, off = 0, segs = '';
    items.forEach(function (it, i) {
      var frac = it.n / tot, len = C * frac;
      segs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + COL[i % COL.length] +
        '" stroke-width="20" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)">' +
        '<title>' + svgEsc(it.l + ' — ' + it.n + ' (' + Math.round(frac * 100) + '%)') + '</title></circle>';
      off += len;
    });
    var legend = items.map(function (it, i) {
      return '<div style="display:flex;align-items:center;gap:7px" class="small">' +
        '<span style="width:11px;height:11px;border-radius:3px;background:' + COL[i % COL.length] + '"></span>' +
        esc(it.l) + ' <b class="mono">' + it.n + '</b></div>';
    }).join('');
    return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">' +
      '<svg viewBox="0 0 140 140" style="width:132px;height:132px;flex:0 0 auto" role="img" aria-label="' +
      svgEsc(opt.label || 'تركيب') + '">' + segs +
      '<text x="70" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">' + tot + '</text>' +
      '<text x="70" y="84" text-anchor="middle" font-size="10" fill="var(--muted)">' + svgEsc(opt.unit || 'الإجمالي') + '</text>' +
      '</svg><div style="display:grid;gap:6px">' + legend + '</div></div>';
  }

  /* خريطة حرارة: أيام الأسبوع × الساعات — لمعرفة وقت ذروة الزوّار */
  var DOW = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  function chartHeat(cells) {
    var max = 0, m = {};
    cells.forEach(function (c) {
      m[c.dow + '_' + c.hour] = c.n;
      if (c.n > max) max = c.n;
    });
    if (!max) return '<div class="muted" style="padding:22px;text-align:center">لا بيانات بعد.</div>';
    var out = '<div style="overflow-x:auto"><table style="border-collapse:separate;border-spacing:2px;direction:rtl">' +
      '<thead><tr><th scope="col"></th>';
    for (var h = 0; h < 24; h += 2) {
      out += '<th colspan="2" style="font-size:9px;font-weight:500;color:var(--muted)">' + h + '</th>';
    }
    out += '</tr></thead><tbody>';
    for (var d = 0; d < 7; d++) {
      out += '<tr><td class="small" style="white-space:nowrap;padding-inline-end:6px;color:var(--muted)">' + DOW[d] + '</td>';
      for (var hh = 0; hh < 24; hh++) {
        var v = m[d + '_' + hh] || 0;
        var a = v ? (0.14 + 0.86 * (v / max)) : 0;
        out += '<td title="' + DOW[d] + ' ' + hh + ':00 — ' + v + '" style="width:13px;height:15px;border-radius:3px;' +
          (v ? 'background:color-mix(in srgb,var(--teal) ' + Math.round(a * 100) + '%,transparent)'
             : 'background:var(--surface-2,#f2f5f4)') + '"></td>';
      }
      out += '</tr>';
    }
    return out + '</tbody></table></div>';
  }

  /* ========================= لوحة التحكم الحقيقية =========================
     العدّ يُطلب برأس Prefer: count=exact و Range: 0-0 — فيعود العدد في ترويسة
     Content-Range بلا جلب صفٍّ واحد. أرخص من قراءة الجداول كلها بكثير. */
  function countOf(path) {
    return fetch(CFG.url + '/rest/v1/' + path + (path.indexOf('?') > -1 ? '&' : '?') + 'select=id', {
      method: 'GET',
      headers: {
        apikey: CFG.key,
        Authorization: 'Bearer ' + tok(),
        Prefer: 'count=exact',
        Range: '0-0'
      }
    }).then(function (r) {
      var cr = r.headers.get('content-range') || '';
      var n = parseInt(String(cr).split('/')[1], 10);
      return isFinite(n) ? n : (r.ok ? 0 : -1);
    }).catch(function () { return -1; });
  }
  function isoDaysAgo(d) {
    var t0 = Date.now() - d * 86400000;
    return new Date(t0).toISOString().slice(0, 10);
  }

  var DASH = [
    { g: 'المحتوى المنشور', items: [
      { l: 'أعضاء الجمعية العمومية', q: 'people?grp=eq.assembly&status=eq.published' },
      { l: 'أعضاء مجلس الإدارة', q: 'people?grp=eq.board&status=eq.published' },
      { l: 'فريق العمل', q: 'people?grp=eq.team&status=eq.published' },
      { l: 'الشركاء', q: 'partners?status=eq.published' },
      { l: 'الأخبار', q: 'news?status=eq.published' },
      { l: 'الوثائق', q: 'documents?status=eq.published' },
      { l: 'شرائح السلايدر', q: 'hero_slides?status=eq.published' },
      { l: 'عناصر القائمة الظاهرة', q: 'menu_items?visible=is.true' }
    ] },
    { g: 'الوارد من الزوّار', items: [
      { l: 'إجمالي الطلبات', q: 'submissions' },
      { l: 'طلبات جديدة', q: 'submissions?status=eq.new', hot: 1 },
      { l: 'طلبات هذا الأسبوع', q: 'submissions?created_at=gte.' + isoDaysAgo(7) },
      { l: 'استجابات قياس الرضا', q: 'survey_responses' }
    ] },
    { g: 'ما لا يظهر للزائر', items: [
      { l: 'أخبار مسودّة', q: 'news?status=eq.draft' },
      { l: 'وثائق مسودّة', q: 'documents?status=eq.draft' },
      { l: 'أشخاص مخفيّون', q: 'people?status=eq.hidden' },
      { l: 'حسابات اللوحة', q: 'admins' }
    ] }
  ];

  /* ======================== مكتبة الوسائط ========================
     رفعٌ حقيقيٌّ إلى دلو iaq-media وصفٌّ في public.media. والحذف يُزيل السطر
     ويُبقي الملفّ: صفحةٌ تستعمل الصورة لا تنكسر بحذفها من المكتبة. */
  var MEDIA = [];

  function mediaUrl(m) {
    var p = String(m.storage_path || '');
    if (/^https?:\/\//i.test(p)) return p;
    return CFG.url + '/storage/v1/object/public/' +
      encodeURI((m.bucket || 'iaq-media') + '/' + p);
  }
  function kb(n) {
    var b = Number(n) || 0;
    if (!b) return '';
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return Math.round(b / 1024) + ' KB';
    return (Math.round(b / 104857.6) / 10) + ' MB';
  }


  function loadMedia(myKey) {
    return api('media?select=*&order=created_at.desc&limit=300')
      .then(function (rows) {
        MEDIA = rows || [];
        if (myKey && !alive(myKey)) return;
        paintMedia();
      })
      .catch(function (e) {
        err = e.message;
        var g = $('#ml-grid');
        if (g) g.innerHTML = '<div class="muted">تعذّرت القراءة: ' + esc(e.message) + '</div>';
      });
  }

  /* الشبكة داخل النافذة: كلُّ بطاقةٍ زرُّ اختيارٍ ومعها حذف */
  function mediaGrid() {
    if (!MEDIA.length) {
      return '<div class="muted" style="padding:26px;text-align:center">' +
        'لا صور بعد — ارفع صورةً من الزرّ أعلاه وستظهر هنا.</div>';
    }
    return '<div class="ml-grid is-pick">' + MEDIA.map(function (m) {
      var u = mediaUrl(m);
      return '<div class="ml-item">' +
        '<button type="button" class="ml-hit" data-sc="mlpick" data-u="' + esc(u) + '" ' +
          'title="اختيار هذه الصورة">' +
          '<div class="ml-thumb"><img src="' + esc(u) + '" alt="' + esc(m.alt || m.title || '') +
            '" loading="lazy"></div>' +
          '<div class="ml-name">' + esc(m.title || String(m.storage_path).split('/').pop()) + '</div>' +
          '<div class="ml-meta">' + esc(kb(m.bytes)) + '</div>' +
        '</button>' +
        '<div class="ml-acts">' +
          '<button class="btn ghost sm" data-sc="mlcopy" data-u="' + esc(u) + '">نسخ</button>' +
          '<button class="btn danger sm" data-sc="mldel" data-id="' + esc(String(m.id)) + '">حذف</button>' +
        '</div></div>';
    }).join('') + '</div>';
  }

  function paintMedia() {
    var g = $('#ml-grid');
    if (g) g.innerHTML = mediaGrid();
  }

  function mlMsg(text, kind) {
    var el = $('#ml-msg');
    if (!el) return;
    el.style.color = kind === 'err' ? '#8c3d1c' : (kind === 'ok' ? '#0c6c6c' : '');
    el.textContent = text;
  }

  /* رفعٌ متتابعٌ لا متزامن: عشرُ صورٍ متزامنةٍ تُخفق بعضها على اتصالٍ ضعيف */
  function mediaUpload(files) {
    var list = [].slice.call(files || []);
    if (!list.length) return;
    var done = 0, fail = 0;
    function step() {
      if (!list.length) {
        mlMsg('رُفعت ' + done + ' صورة' + (fail ? ' · فشلت ' + fail : ''), fail ? 'err' : 'ok');
        return loadMedia(null).then(function () {
          /* الرسالة تُعاد بعد إعادة رسم الشبكة، وإلّا مُحيت قبل أن تُقرأ */
          mlMsg('رُفعت ' + done + ' صورة' + (fail ? ' · فشلت ' + fail : ''), fail ? 'err' : 'ok');
        });
      }
      var f = list.shift();
      mlMsg('جارٍ رفع ' + f.name + '… (' + (done + fail + 1) + '/' + (done + fail + 1 + list.length) + ')');
      var stamp = Date.now().toString(36);
      var path = 'lib/' + stamp + '/' + safeName(f.name);
      fetch(CFG.url + '/storage/v1/object/' + encodeURI('iaq-media/' + path) + '?upsert=true', {
        method: 'POST',
        headers: {
          apikey: CFG.key,
          Authorization: 'Bearer ' + tok(),
          'x-upsert': 'true',
          'Content-Type': f.type || 'application/octet-stream'
        },
        body: f
      }).then(function (r) {
        if (!r.ok) {
          if (r.status === 404) throw new Error('دلو iaq-media غير موجود — شغّل supabase/setup.sql');
          throw new Error('تعذّر الرفع (' + r.status + ')');
        }
        /* السطر بعد الملفّ: لا نُسجّل صورةً لم تصل */
        return api('media?select=id', {
          method: 'POST',
          body: JSON.stringify([{
            bucket: 'iaq-media', storage_path: path, kind: 'image',
            title: f.name, bytes: f.size, created_by: (S && S.email) || ''
          }])
        });
      }).then(function () { done++; step(); })
        .catch(function (e) { fail++; mlMsg(e.message, 'err'); step(); });
    }
    step();
  }

  function mediaDelete(id) {
    var m = null;
    MEDIA.forEach(function (x) { if (String(x.id) === String(id)) m = x; });
    if (!m) return;
    askPassword('حذف من المكتبة',
      '<p>حذف <b>' + esc(m.title || m.storage_path) + '</b> من المكتبة؟</p>' +
      '<p class="muted small">يُحذف سطرها من المكتبة ويبقى الملفّ في التخزين — ' +
      'فالصفحات التي تستعمل رابطها لا تنكسر. ولن تظهر بعدها في منتقي الصور.</p>',
      function () {
        api('media?id=eq.' + Number(id) + '&select=id', { method: 'DELETE' })
          .then(function () {
            /* نافذةُ كلمة المرور استبدلت نافذةَ المكتبة، فنُعيد فتحها بعد الحذف */
            return loadMedia(null).then(function () {
              openPicker(null);
              mlMsg('حُذفت من المكتبة.', 'ok');
            });
          })
          .catch(function (e) { close(); mlMsg(e.message, 'err'); });
      });
  }

  /* ---------------- منتقي الصورة ----------------
     يظهر في كل حقل صورة. يقرأ المكتبة إن لم تُقرأ بعد، فلا يفتح فارغًا. */
  var pickTarget = null;

  /* المكتبة نافذةٌ لا شاشة: تُفتح من أي حقل صورة، وفيها الشبكةُ والرفعُ والحذف.
     فتُدار الصور حيث تُستعمل، ولا تبقى شاشةٌ فارغةٌ في القائمة. */
  function pickerBody() {
    /* زرٌّ حقيقيّ يفتح الحقلَ المخفيّ، لا <label> حوله: الحقلُ المخفيّ خارجٌ
       من ترتيب التنقّل، و<label> ليس عنصرًا يُركَّز عليه — فكان الرفعُ مغلقًا
       تمامًا على من لا يستعمل الفأرة. */
    return '<div class="addrow" style="flex-wrap:wrap;margin-block-end:12px">' +
        '<button type="button" class="btn" data-sc="filepick" data-t="ml-up">' +
          ico('up') + ' رفع صور</button>' +
        '<input type="file" id="ml-up" accept="image/*" multiple hidden>' +
        '<button class="btn ghost" data-sc="mlreload">' + ico('down') + ' تحديث</button>' +
      '</div>' +
      '<div id="ml-msg" class="muted small" style="margin-block-end:10px"></div>' +
      '<div id="ml-grid">' + mediaGrid() + '</div>' +
      '<p class="muted small" style="margin-block-start:10px">' +
      'الصور تُرفع إلى تخزين الموقع وتبقى. والحذف يُزيلها من المكتبة ويُبقي الملفّ، ' +
      'فالصفحات التي تستعملها لا تنكسر.</p>';
  }

  function openPicker(targetId) {
    if (targetId) pickTarget = targetId;
    wireMedia();
    function draw() {
      modal('مكتبة الصور', pickerBody(),
        '<button class="btn ghost" data-sc="close">إغلاق</button>');
    }
    if (MEDIA.length) { draw(); return; }
    modal('مكتبة الصور', '<p class="muted">جارٍ قراءة المكتبة…</p>',
      '<button class="btn ghost" data-sc="close">إغلاق</button>');
    loadMedia(null).then(draw);
  }
  function applyPick(u) {
    if (!pickTarget) { close(); return; }
    var el = byId(pickTarget);
    if (el) {
      el.value = u;
      /* المعاينة المجاورة تُحدَّث: حقلٌ يقول رابطًا وصورةٌ تُظهر غيره يُربك */
      var box = el.parentNode;
      var img = box ? box.querySelector('img') : null;
      if (img) img.src = u;
    }
    pickTarget = null;
    close();
  }

  /* ======================== لوحة التحكّم ========================
     الترتيب مقصود: ما يستدعي عملًا أوّلًا (زوّار وطلبات وسرعة ردّ)، والجردُ
     أسفلَه. وكلُّ الأرقام من ثلاث قراءاتٍ لا أكثر. */

  /* بطاقةُ رقمٍ كبيرٍ بأيقونةٍ ومقارنةٍ وشريطٍ صغير */
  function kpi(o) {
    var d = o.delta;
    var arrow = '', col = 'var(--muted)';
    if (d != null && isFinite(d)) {
      if (d > 0) { arrow = '▲ '; col = '#0c6c6c'; }
      else if (d < 0) { arrow = '▼ '; col = '#8c3d1c'; }
      else { arrow = '= '; }
    }
    return '<div class="iaq-kpi' + (o.gold ? ' is-gold' : '') + '">' +
      '<div class="kpi-top">' +
        '<span class="kpi-ico">' + (o.icon ? ico(o.icon) : '') + '</span>' +
        (d != null && isFinite(d)
          ? '<span class="kpi-delta" style="color:' + col + '">' + arrow +
            Math.abs(Math.round(d)) + '%</span>'
          : (o.note ? '<span class="kpi-delta muted">' + esc(o.note) + '</span>' : '')) +
      '</div>' +
      '<div class="kpi-val">' + esc(String(o.v)) + '</div>' +
      '<div class="kpi-lbl">' + esc(o.l) + '</div>' +
      (o.spark ? '<div class="kpi-spark">' + o.spark + '</div>' : '') +
      (o.sub ? '<div class="kpi-sub">' + esc(o.sub) + '</div>' : '') +
      '</div>';
  }

  /* نسبةُ التغيّر بين نصفَي المدى. null إن خلا النصف الأوّل — فقسمةٌ على صفرٍ
     تُنتج «∞%» وهو أسوأ من لا شيء. */
  function delta(rows, days, filter) {
    var half = dayStr(days - 1), mid = dayStr(Math.floor(days / 2) - 1);
    var a = 0, b = 0;
    (rows || []).forEach(function (r) {
      if (filter && !filter(r)) return;
      var d = String(r.day || '');
      if (d < half) return;
      if (d < mid) a += Number(r.n) || 0; else b += Number(r.n) || 0;
    });
    if (!a) return null;
    return ((b - a) / a) * 100;
  }

  /* ثلاث تبويباتٍ في شاشةٍ واحدة: الثلاثة تقرأ من المصادر نفسها، وكان
     الانتقال بينها يُعيد كل القراءات من الصفر. التبويب يُبدّل العرضَ لا
     القراءة، والمدى يُبدّل القراءة للثلاثة معًا. */
  var DASH_TAB = 'now';
  var DASH_TABS = [['now', 'نظرةٌ عامّة'], ['visits', 'الزوّار والصفحات'],
                   ['work', 'سجلّ العمل والتراجع']];

  function tabBar() {
    /* tablist حقيقيّ: من يسمع يعرف أنّها ثلاثةٌ وأيُّها المختار، والسهمان
       يتنقّلان بينها (مستمعٌ في مُوزّع المفاتيح). وكانت أزرارًا بحتة. */
    return '<div class="dash-tabs" role="tablist" aria-label="أقسام لوحة التحكّم">' +
      DASH_TABS.map(function (o) {
        var on = DASH_TAB === o[0];
        return '<button class="dash-tab' + (on ? ' is-on' : '') + '" role="tab" ' +
          'id="dtab-' + o[0] + '" aria-selected="' + (on ? 'true' : 'false') + '" ' +
          'aria-controls="dash-body" tabindex="' + (on ? '0' : '-1') + '" ' +
          'data-sc="dtab" data-t="' + o[0] + '">' + esc(o[1]) + '</button>';
      }).join('') + '</div>';
  }

  function dashView(sc, myKey) {
    setTimeout(function () { paintTab(myKey); }, 0);
    return '<div class="view-head"><h1>' + esc(sc.h1) + '</h1>' +
      '<p>' + esc(sc.sub) + '</p></div>' +
      tabBar() +
      '<div id="dv-range">' + rangeBar(RANGE) + '</div>' +
      '<div id="sc-err"></div>' +
      '<div id="dash-body" role="tabpanel" aria-labelledby="dtab-' + DASH_TAB + '">' +
      '<div class="iaq-card" id="dv-now" style="margin-block-end:14px">' +
        '<h3 class="card-h">ماذا أفعل الآن؟</h3>' +
        '<div class="muted small">جارٍ الفحص…</div></div>' +
      '<div id="dv-kpi" class="iaq-kpi-grid">' +
        new Array(7).join('<div class="iaq-kpi"><div class="kpi-val">…</div>' +
          '<div class="kpi-lbl">جارٍ القراءة</div></div>') +
      '</div>' +
      '<div id="dv-charts"></div>' +
      '<div id="dv-inv"></div>' +
      '<div class="iaq-card"><h3 class="card-h">آخر الطلبات الواردة</h3>' +
        '<div id="dv-latest" class="muted">جارٍ القراءة…</div></div></div>';
  }

  /* يرسم التبويب المختار في الحاوية نفسها */
  function paintTab(myKey) {
    var box = $('#dash-body');
    var rb = $('#dv-range');
    if (rb) rb.innerHTML = rangeBar(RANGE);
    if (!box) return;
    if (DASH_TAB === 'visits') {
      box.innerHTML = '<div class="iaq-card"><div class="muted">جارٍ قراءة الإحصاءات…</div></div>';
      return paintVisits(myKey);
    }
    if (DASH_TAB === 'work') {
      box.innerHTML = '<div class="iaq-card"><div class="muted">جارٍ قراءة السجلّ…</div></div>';
      return paintWorklog(myKey);
    }
    box.innerHTML = '<div class="iaq-card" id="dv-now" style="margin-block-end:14px">' +
        '<h3 class="card-h">ماذا أفعل الآن؟</h3>' +
        '<div class="muted small">جارٍ الفحص…</div></div>' +
      '<div id="dv-kpi" class="iaq-kpi-grid"></div>' +
      '<div id="dv-charts"></div><div id="dv-inv"></div>' +
      '<div class="iaq-card"><h3 class="card-h">آخر الطلبات الواردة</h3>' +
      '<div id="dv-latest" class="muted">جارٍ القراءة…</div></div>';
    return paintDash(myKey);
  }

  function paintDash(myKey) {
    /* المدى المختار؛ وصفرٌ = منذ الإنشاء فنقرأ الكلّ ونحسب المدى من البيانات */
    var D = RANGE || 0;
    var subsErr = null;
    /* ثلاث قراءاتٍ لا أكثر — والمقارنة من ضِعف المدى في القراءة نفسها */
    Promise.all([
      readView('v_views_daily', D ? D * 2 : 0),
      /* الفشلُ يُرفع لا يُبلَع: كان catch يُرجع [] فتُطبع «٠ طلب لم يُفتح ·
         لا متأخّر» — وعطلٌ يُقرأ طمأنينةً أسوأ من عطلٍ يُعلن عن نفسه.
         و hours_to_first لم يُعَد مطلوبًا: الحالةُ في جدول الطلبات تكفي. */
      api('v_subs_response?select=status,created_at&order=created_at.desc&limit=1000')
        .catch(function (e) { subsErr = e.message || 'تعذّرت القراءة'; return null; }),
      readView('v_audit_daily', D ? D * 2 : 0),
      readView('v_views_by_path', D),
      readView('v_views_by_label', D),
      readView('v_views_by_device', D),
      readHealth(),
      /* دورةُ المجلس: قراءةٌ واحدةٌ صغيرة، والمبنيُّ أساسٌ تحتها */
      api('settings?select=key,value&key=eq.board_term').catch(function () { return []; })
    ]).then(function (r) {
      if (!alive(myKey)) return;
      /* «منذ الإنشاء»: المدى من أقدم يومٍ في البيانات، فلا تُقصّ السلسلة */
      if (!D) D = spanOf(r[0]);
      var daily = r[0] || [], subs = r[1], audit = r[2] || [];
      var byPath = r[3] || [], byLabel = r[4] || [], byDev = r[5] || [];

      /* المدى المعروض. نقرأ ضِعفَه كي تُحسب المقارنة، فالجمعُ يقتصر على نصفِه
         الأحدث — إلّا في «منذ الإنشاء»: ليس قبله مدًى يُقارَن، والمدى المعروض
         هو العمرُ كلّه بلا حدٍّ سفليّ. كان الحدُّ هنا نصفَ العمر، فعرضَ هذا
         التبويبُ نصفَ الرقم الذي يعرضه تبويبُ الزوّار على المدى نفسه. */
      var SPAN = RANGE || D;
      var FROM = RANGE ? dayStr(SPAN - 1) : '';   /* '' = بلا حدّ: كلُّ يومٍ ≥ '' */
      function tot(kind) {
        return total(daily, function (x) {
          return String(x.day) >= FROM && (!kind || x.kind === kind);
        });
      }
      var noStats = !daily.length;

      /* مؤشّرا الوارد من حالة الطلب في جدوله نفسه، لا من hours_to_first: ذاك
         يُشتقّ من سجلّ العمل الذي تُفرغه purge_audit بعد ثلاثين يومًا، فالمُجاب
         عليه قديمًا يعود «بلا ردّ». وكان المتوسّط يحسب المُجاب عليه وحده —
         فكلّما زاد الإهمال جَمُلَ الرقم. */
      var open = 0, late = 0, oldest = null, now = Date.now();
      (subs || []).forEach(function (s) {
        if (s.status !== 'new') return;
        open++;
        var age = now - new Date(s.created_at).getTime();
        if (age > 3 * 86400000) late++;
        if (oldest === null || age > oldest) oldest = age;
      });
      var seen = (subs || []).length;
      var rate = seen ? Math.round(((seen - open) / seen) * 100) : null;

      /* الدورةُ السارية: المحفوظُ في settings فوق المبنيِّ، حقلًا حقلًا —
         فحقلٌ لم يُملأ في اللوحة يبقى على قيمته في الموقع. */
      var term = {};
      var bt0 = realVal('boardTerm');
      if (bt0 && typeof bt0 === 'object') {
        for (var bk in bt0) if (bt0.hasOwnProperty(bk)) term[bk] = bt0[bk];
      }
      var btRow = (r[7] || [])[0];
      if (btRow && btRow.value && typeof btRow.value === 'object') {
        for (var bk2 in btRow.value) {
          if (btRow.value.hasOwnProperty(bk2) && String(btRow.value[bk2] || '').trim()) {
            term[bk2] = btRow.value[bk2];
          }
        }
      }

      var nbox = $('#dv-now');
      if (nbox) {
        var rws = nowRows(subs, subsErr, oldest, open, late, term);
        /* الحساباتُ المتبقّية تحتاج عدًّا: تُلحَق حين تصل، ولا تُؤخّر ما جاهز */
        nbox.innerHTML = '<h3 class="card-h">ماذا أفعل الآن؟</h3>' +
          '<div id="dv-now-rows">' + rws.map(nowRow).join('') + '</div>' +
          '<div id="dv-now-more"></div>' +
          '<div id="dv-now-none" class="muted small"' + (rws.length ? ' hidden' : '') + '>' +
          'جارٍ الفحص…</div>';
        Promise.all([
          countOf('news?status=eq.draft'),
          countOf('documents?status=eq.draft')
        ]).then(function (c) {
          if (!alive(myKey)) return;
          var more = [];
          /* countOf تُرجع -1 عند فشل القراءة (screens.js:1370). ولو تخطّيناه
             بـ«> 0» لَظهر «لا شيءَ ينتظرك» وفي الحقيقة لم نفحص — وهو الكذبُ
             نفسه الذي أُصلح في مؤشّرات الوارد. */
          if (c[0] < 0 || c[1] < 0) {
            more.push({ urgent: 1, icon: 'alert', view: 'dashboard',
                        txt: 'تعذّر فحصُ المسودّات المعلّقة',
                        sub: 'لم تُقرأ الأخبارُ أو الوثائق — قد تكون هناك مسودّاتٌ ' +
                             'لا يراها الزائر. حدِّث الصفحة أو تحقّق من اتصالك' });
          }
          if (c[0] > 0) {
            more.push({ icon: 'log', view: 'newslist',
                        txt: arNum(c[0], ['خبرٌ واحدٌ مسودّة', 'خبران مسودّة',
                                          'أخبارٍ مسودّة', 'خبرًا مسودّة']),
                        sub: 'مكتوبةٌ ولا يراها الزائر — انشرها أو احذفها' });
          }
          if (c[1] > 0) {
            more.push({ icon: 'docs', view: 'docs',
                        txt: arNum(c[1], ['وثيقةٌ واحدةٌ مسودّة', 'وثيقتان مسودّة',
                                          'وثائقٍ مسودّة', 'وثيقةً مسودّة']),
                        sub: 'مرفوعةٌ ولا تظهر في صفحة الوثائق' });
          }
          var mb = $('#dv-now-more'), nb2 = $('#dv-now-none');
          if (mb) mb.innerHTML = more.map(nowRow).join('');
          if (nb2) {
            var any = rws.length + more.length;
            nb2.hidden = !!any;
            /* «لا شيء» تُقال حين فُحص كلُّ شيءٍ فعلًا — لا حين تعذّر الفحص */
            if (!any) nb2.textContent = 'لا شيءَ ينتظرك: كلُّ الوارد مفتوح، ولا مسودّةً معلّقة، ' +
              'ولا التزامًا قريبًا. والأرقامُ أدناه للمتابعة لا للعمل.';
          }
        });
      }

      function spark(kind, rows) {
        return chartLine(series(rows || daily, SPAN, kind ? function (x) { return x.kind === kind; } : null),
                         { bare: 1, h: 34 });
      }
      function dash(v) { return noStats ? '—' : String(v); }

      /* المقارنة تحتاج مدًى سابقًا قُرئ فعلًا. و«منذ الإنشاء» لا قبلَه شيء،
         فسهمُه كان يقارن نصفَ عمر الجمعية بنصفِه — وليس هذا ما يُقرأ منه. */
      var NOTE = RANGE ? '' : 'منذ الإنشاء';
      function dlt(f, rows) { return RANGE ? delta(rows || daily, RANGE * 2, f) : null; }

      var kbox = $('#dv-kpi');
      if (kbox) {
        kbox.innerHTML =
          kpi({ v: dash(tot('page')), l: 'زيارة صفحة', icon: 'eye', note: NOTE,
                delta: dlt(function (x) { return x.kind === 'page'; }),
                spark: noStats ? '' : spark('page') }) +
          kpi({ v: dash(tot('file_dl')), l: 'تنزيل ملفّ', icon: 'down', note: NOTE,
                delta: dlt(function (x) { return x.kind === 'file_dl'; }),
                spark: noStats ? '' : spark('file_dl') }) +
          kpi({ v: dash(tot('form')), l: 'إرسال نموذج', icon: 'inbox2', note: NOTE,
                delta: dlt(function (x) { return x.kind === 'form'; }) }) +

      var cbox = $('#dv-charts');

              card('أكثر الصفحات زيارةً',

              card('أكثر الملفّات تنزيلًا',

                'التنزيل الفعليّ لا المعاينة في المتصفّح.') +
            '</div>' +
            card('الأجهزة',
              chartDonut(sumBy(byDev, function (x) {
                return { mobile: 'جوال', tablet: 'لوحيّ', desktop: 'حاسب' }[x.device] || 'غير معروف';
              }), { unit: 'زيارة' }),
              'نسبةُ الجوال إلى الحاسب — منها تُقرَّر أولويّة أيّ الشاشتين نُحسّن أوّلًا.'));
      }

      /* الجرد مضغوطٌ في الأسفل: أرقامٌ لا تتغيّر كثيرًا ولا تستدعي عملًا */
      var ibox = $('#dv-inv');
      if (ibox) {
        ibox.innerHTML = '<div class="iaq-card" style="margin-block-end:14px">' +

          DASH.map(function (g, gi) {
            return g.items.map(function (it, i) {
              return '<div class="stat-box"><div class="sb-val" id="dv-' + gi + '-' + i + '">…</div>' +
                '<div class="sb-label">' + esc(it.l) + '</div></div>';

        DASH.forEach(function (g, gi) {
          g.items.forEach(function (it, i) {
            countOf(it.q).then(function (n) {
              if (!alive(myKey)) return;

              if (n < 0) { el.textContent = '—'; el.title = 'تعذّرت القراءة'; return; }

    api('submissions?select=id,kind,status,created_at,payload&order=created_at.desc&limit=5')
      .then(function (rows) {

  /* ======================== إحصاءات الزوّار ======================== */
  var PAGE_AR = null;
  function pageName(slug) {
    if (!PAGE_AR) {
      PAGE_AR = {};
      ((window.IAQ_REAL && window.IAQ_REAL.pages) || []).forEach(function (p) {
        if (p && p.slug) PAGE_AR[p.slug] = p.title || p.slug;

    }
    return PAGE_AR[slug] || slug;
  }
  var KIND_AR = { page: 'زيارة صفحة', file_dl: 'تنزيل ملفّ', file_view: 'معاينة ملفّ',
                  cta: 'نقر زرّ', form: 'إرسال نموذج', contact: 'تواصل' };

  function visitsView(sc, myKey) {
    setTimeout(function () { paintVisits(myKey); }, 0);
    return head(sc) + '<div id="sc-err"></div><div id="sc-body">' +
      '<div class="iaq-card"><div class="muted">جارٍ قراءة الإحصاءات…</div></div></div>';
