<section class="section lc" id="licSec" aria-labelledby="lc-h">
<style>
/* ============================================================
   معرض التراخيص — شهادات مؤطّرة مع تكبير
   ============================================================ */
.lc{position:relative;overflow:hidden;--lc-gl:rgba(192,144,72,.42);--lc-t6:#0c6c6c;--lc-gi:#7a5518;--lc-tt:#eef4f3;--lc-tb:#d6e5e3;--lc-gt:#f8efdb;--lc-gb:#ecdcbb}
.lc::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(45deg,transparent 0 46px,rgba(0,120,120,.05) 46px 47px),
    repeating-linear-gradient(-45deg,transparent 0 46px,rgba(0,120,120,.05) 46px 47px);
  -webkit-mask-image:radial-gradient(115% 80% at 100% 0%,#000 0%,transparent 70%);
  mask-image:radial-gradient(115% 80% at 100% 0%,#000 0%,transparent 70%);
}
.lc > .container{position:relative;z-index:1}
.lc-grid{display:grid;gap:26px}
.lc-card{
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--card-radius);
  overflow:hidden;position:relative;
  transition:opacity .6s var(--ease) var(--lc-d,0ms),transform .6s var(--ease) var(--lc-d,0ms),
             border-color .3s var(--ease),box-shadow .35s var(--ease);
}
.lc.js-on .lc-card{opacity:0;transform:translateY(22px)}
.lc.js-on .lc-card.is-in{opacity:1;transform:none}
.lc-card:hover{border-color:var(--teal);box-shadow:0 20px 44px rgba(6,63,54,.13)}
.lc-card::before{
  content:"";position:absolute;inset-block-start:-4px;inset-inline-start:-4px;z-index:3;
  width:13px;height:13px;background:var(--gold);opacity:.35;transform:rotate(45deg);border-radius:2px;
  transition:opacity .35s,transform .55s var(--ease);
}
.lc-card:hover::before{opacity:1;transform:rotate(135deg)}
/* إطار الشهادة */
.lc-media{
  position:relative;display:block;width:100%;padding:20px;border:0;cursor:zoom-in;
  background:linear-gradient(150deg,var(--lc-tt),#fbfdfd);
  border-inline-end:1px solid var(--line);
}
.lc-media::after{
  content:"";position:absolute;inset:12px;border:1px solid var(--lc-gl);border-radius:4px;
  pointer-events:none;transition:border-color .35s var(--ease),inset .35s var(--ease);
}
.lc-media:hover::after{border-color:var(--gold);inset:8px}
.lc-media img{
  display:block;width:100%;height:auto;border-radius:2px;
  box-shadow:0 6px 18px rgba(6,63,54,.14);background:#fff;
  transition:transform .5s var(--ease);
}
.lc-media:hover img{transform:scale(1.02)}
.lc-media:focus-visible{outline:2px solid var(--teal);outline-offset:-4px}
.lc-noimg{aspect-ratio:1.5;background:var(--surface-2);border-radius:2px}
.lc-zoom{
  position:absolute;inset-block-end:26px;inset-inline-end:26px;z-index:2;
  width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.94);color:var(--teal);
  box-shadow:0 4px 14px rgba(6,63,54,.22);transition:transform .3s var(--ease),background .3s;
}
.lc-zoom svg{width:18px;height:18px}
.lc-media:hover .lc-zoom{transform:scale(1.1);background:var(--teal);color:#fff}
/* البيانات */
.lc-body{padding:26px 28px;display:flex;flex-direction:column}
.lc-title{font-family:var(--font-display);font-size:1.3rem;font-weight:600;color:var(--ink);margin:0 0 8px}
.lc-valid{
  display:inline-flex;align-self:flex-start;align-items:center;gap:7px;
  font-size:.88rem;font-weight:700;padding:5px 12px;border-radius:7px;margin:0 0 18px;
  color:var(--lc-t6);background:var(--lc-tt);border:1px solid var(--lc-tb);
}
.lc-facts{margin:0;display:grid;gap:0;border-block-start:1px solid var(--line)}
.lc-fact{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:12px;
  padding:11px 0;border-block-end:1px solid var(--line)}
.lc-fact dt{color:var(--muted);font-size:.9rem}
.lc-fact dd{margin:0;color:var(--ink);font-weight:700;font-size:.94rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lc-actions{display:flex;flex-wrap:wrap;gap:10px;margin-block-start:20px}
.lc-btn{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-body);
  font-size:.95rem;font-weight:700;padding:11px 20px;border-radius:9px;
  transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease);
}
.lc-btn-solid{background:var(--teal);color:#fff;border:1px solid var(--teal)}
.lc-btn-solid:hover{background:#00615f;transform:translateY(-2px)}
.lc-btn-ghost{background:transparent;color:var(--teal);border:1.6px solid var(--teal)}
.lc-btn-ghost:hover{background:var(--teal);color:#fff;transform:translateY(-2px)}
.lc-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* نافذة التكبير */
.lc-lb{
  position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:24px;
  background:rgba(8,32,30,.92);
}
.lc-lb.open{display:grid}
.lc-lb img{max-width:min(1400px,96vw);max-height:86vh;width:auto;height:auto;border-radius:4px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lc-lb figcaption{color:#eaf4f2;text-align:center;margin-block-start:14px;font-family:var(--font-display);font-size:1.05rem}
.lc-lb-close{
  position:absolute;inset-block-start:18px;inset-inline-end:18px;width:44px;height:44px;
  display:grid;place-items:center;border:0;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;transition:background .25s,transform .25s
}
.lc-lb-close:hover{background:rgba(255,255,255,.28);transform:rotate(90deg)}
.lc-lb-close svg{width:20px;height:20px}
.lc-hint{margin-block-start:22px;color:var(--muted);font-size:.9rem;text-align:center}
@media (max-width:860px){
  .lc-card{grid-template-columns:1fr}
  .lc-media{border-inline-end:0;border-block-end:1px solid var(--line)}
  .lc-body{padding:22px}
  .lc-title{font-size:1.16rem}
}
@media (max-width:520px){
  .lc-fact{grid-template-columns:1fr;gap:2px;padding:10px 0}
  .lc-actions .lc-btn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .lc.js-on .lc-card{opacity:1;transform:none}
  .lc-card,.lc-media img,.lc-media::after,.lc-zoom,.lc-btn{transition:none!important}
  .lc-media:hover img{transform:none}
  .lc-card:hover::before{transform:rotate(45deg)}
}
</style>
<div class="container">
  <h2 id="lc-h" class="gm-sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">تراخيص الجمعية وشهاداتها الرسمية</h2>
  <div class="lc-grid">{{LICENSE_CARDS}}</div>
  <p class="lc-hint">اضغط على صورة الشهادة لتكبيرها، أو حمّلها بصيغة PDF.</p>
</div>
<figure class="lc-lb" id="lcLightbox" role="dialog" aria-modal="true" aria-label="تكبير الشهادة">
  <button type="button" class="lc-lb-close" id="lcClose" aria-label="إغلاق">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div><img id="lcImg" src="" alt="" /><figcaption id="lcCap"></figcaption></div>
</figure>
<script>
(function(){
  var sec=document.getElementById('licSec'); if(!sec) return;
  var cards=[].slice.call(sec.querySelectorAll('.lc-card'));
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  sec.classList.add('js-on');

  function run(){ cards.forEach(function(c){ c.classList.add('is-in'); }); }
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(en){
      en.forEach(function(x){ if(x.isIntersecting){ run(); io.disconnect(); } });
    },{threshold:.08,rootMargin:'0px 0px -6% 0px'});
    io.observe(sec);
  } else { run(); }

  var lb=document.getElementById('lcLightbox'),
      img=document.getElementById('lcImg'),
      cap=document.getElementById('lcCap'),
      closeBtn=document.getElementById('lcClose'),
      last=null;
  function open(src,caption,trigger){
    if(!src) return;
    img.src=src; img.alt=caption||''; cap.textContent=caption||'';
    lb.classList.add('open'); last=trigger||null;
    document.body.style.overflow='hidden'; closeBtn.focus();
  }
  function close(){
    lb.classList.remove('open'); img.src='';
    document.body.style.overflow='';
    if(last){ last.focus(); last=null; }
  }
  sec.querySelectorAll('.lc-media').forEach(function(b){
    b.addEventListener('click',function(){
      open(b.getAttribute('data-zoom'), b.getAttribute('data-caption'), b);
    });
  });
  closeBtn.addEventListener('click', close);
  lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && lb.classList.contains('open')) close();
  });
})();
</script>
</section>
