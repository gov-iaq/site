<section class="section gm" id="memSec" aria-labelledby="gm-title">
<style>
/* ============================================================
   قسم أعضاء الجمعية العمومية — اتجاه «هندسي عربي»
   ============================================================ */
.gm{
  position:relative;overflow:hidden;background:var(--bg);
  --gm-dir:1;
  --gm-lattice:rgba(0,120,120,.055);
  --gm-teal-600:#0c6c6c;
  --gm-gold-ink:#7a5518;
  --gm-gold-line:rgba(192,144,72,.42);
  --gm-teal-tint:#eef4f3;
  --gm-teal-bd:#d6e5e3;
  --gm-gold-tint:#f8efdb;
  --gm-gold-bd:#ecdcbb;
  --gm-shadow-h:0 14px 34px rgba(6,63,54,.10);
  --gm-step:60ms;
}
/* شبكة معيّنية هندسية خفيفة كخلفية */
.gm::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(45deg,transparent 0 43px,var(--gm-lattice) 43px 44px),
    repeating-linear-gradient(-45deg,transparent 0 43px,var(--gm-lattice) 43px 44px);
  -webkit-mask-image:radial-gradient(120% 85% at 100% 0%,#000 0%,transparent 72%);
  mask-image:radial-gradient(120% 85% at 100% 0%,#000 0%,transparent 72%);
}
.gm > .container{position:relative;z-index:1}
/* نجمة ثمانية مجرّدة تدور ببطء */
.gm-orn{
  position:absolute;inset-block-start:-70px;inset-inline-start:-70px;
  width:280px;height:280px;color:var(--gold);opacity:.13;z-index:0;pointer-events:none;
  animation:gmSpin 90s linear infinite;
}
@keyframes gmSpin{to{transform:rotate(360deg)}}
/* عدّادات إحصائية بأطراف هندسية */
.gm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-block-end:34px}
.gm-stat{
  position:relative;background:var(--surface);border:1px solid var(--line);padding:22px 24px;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  transition:border-color .3s var(--ease),background .3s var(--ease);
}
.gm-stat::after{
  content:"";position:absolute;inset-block-end:0;inset-inline-start:0;
  width:0;height:2px;background:var(--teal);transition:width .6s var(--ease);
}
.gm-stat:hover{border-color:var(--gm-teal-bd);background:var(--surface-2)}
.gm-stat:hover::after{width:100%}
.gm-stat b{
  display:block;font-family:var(--font-display);font-weight:700;
  font-size:clamp(1.9rem,3.4vw,2.6rem);line-height:1.15;color:var(--teal);
  font-variant-numeric:tabular-nums;
}
.gm-stat span{display:block;font-size:1rem;font-weight:500;color:var(--muted);margin-block-start:4px}
.gm-stat.is-gold b{color:var(--gm-gold-ink)}
.gm-stat.is-gold::after{background:var(--gold)}
/* شريط الأدوات: فلترة + بحث */
.gm-bar{
  display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  padding-block:18px;border-block:1px solid var(--line);margin-block-end:12px;
}
.gm-seg{display:inline-flex;gap:6px;padding:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.gm-fil{
  position:relative;display:inline-flex;align-items:center;gap:9px;
  padding:11px 20px;border:0;border-radius:8px;cursor:pointer;background:transparent;
  font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--body);
  transition:color .25s,background .25s var(--ease),box-shadow .25s;
}
.gm-fil::before{
  content:"";position:absolute;inset-block-start:50%;inset-inline-start:9px;
  width:6px;height:6px;margin-block-start:-3px;background:var(--gold);
  transform:rotate(45deg) scale(0);border-radius:1px;transition:transform .3s var(--ease);
}
.gm-fil:hover{color:var(--teal);background:#fff}
.gm-fil[aria-pressed="true"]{background:var(--teal);color:#fff;box-shadow:0 8px 20px rgba(0,120,120,.20);padding-inline-start:28px}
.gm-fil[aria-pressed="true"]::before{background:var(--gold);transform:rotate(45deg) scale(1)}
.gm-fil .gm-c{
  font-size:.85rem;font-weight:700;padding:1px 8px;border-radius:999px;
  background:rgba(0,120,120,.10);color:var(--gm-teal-600);font-variant-numeric:tabular-nums;
}
.gm-fil[aria-pressed="true"] .gm-c{background:rgba(255,255,255,.22);color:#fff}
.gm-fil:focus-visible,.gm-clear:focus-visible,.gm-reset:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.gm-search{position:relative;flex:1 1 260px;max-width:380px}
.gm-search input{
  width:100%;padding:13px 46px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:1rem;
  transition:border-color .25s,box-shadow .25s;
}
.gm-search input::placeholder{color:var(--muted)}
.gm-search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,120,120,.14)}
.gm-search .gm-si{
  position:absolute;inset-inline-start:15px;inset-block-start:50%;transform:translateY(-50%);
  width:19px;height:19px;color:var(--muted);pointer-events:none;
}
.gm-clear{
  position:absolute;inset-inline-end:8px;inset-block-start:50%;transform:translateY(-50%);
  width:32px;height:32px;display:none;place-items:center;border:0;border-radius:8px;
  background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s;
}
.gm-clear svg{width:15px;height:15px}
.gm-clear:hover{background:var(--surface-2);color:var(--teal)}
.gm-search.has-value .gm-clear{display:grid}
.gm-live{font-size:.95rem;color:var(--muted);margin:0 0 26px}
.gm-live b{color:var(--teal);font-weight:700;font-variant-numeric:tabular-nums}
/* الشبكة والبطاقة */
.gm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gm-grid.is-busy{pointer-events:none}
.gm-card{
  position:relative;display:flex;align-items:center;gap:14px;
  padding:18px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--card-radius);
  transition:
    opacity .55s var(--ease) var(--gm-delay,0ms),
    transform .55s var(--ease) var(--gm-delay,0ms),
    border-color .3s var(--ease),box-shadow .35s var(--ease);
}
/* حركة الدخول القُطرية — مشروطة بتوفّر JavaScript حتى لا تختفي الأسماء بدونه */
.gm.js-on .gm-card{opacity:0;transform:translate(calc(var(--gm-dir) * 14px),18px) scale(.985)}
.gm.js-on .gm-card.is-in{opacity:1;transform:none}
.gm-card[hidden]{display:none}
.gm-card:hover{border-color:var(--teal);box-shadow:var(--gm-shadow-h);transform:translateY(-5px)}
.gm-card:focus-within{border-color:var(--teal);box-shadow:var(--gm-shadow-h)}
/* إطار داخلي مزدوج */
.gm-card::after{
  content:"";position:absolute;inset:5px;border:1px solid transparent;border-radius:8px;
  pointer-events:none;transition:border-color .35s var(--ease);
}
.gm-card:hover::after{border-color:var(--gm-gold-line)}
/* معيّن الزاوية */
.gm-card::before{
  content:"";position:absolute;inset-block-start:-4px;inset-inline-start:-4px;
  width:12px;height:12px;background:var(--gold);opacity:.28;transform:rotate(45deg);
  border-radius:2px;transition:opacity .35s var(--ease),transform .5s var(--ease);
}
.gm-card:hover::before{opacity:1;transform:rotate(135deg)}
/* الأفاتار: مثمّن + إطار معيّني يدور */
.gm-av{position:relative;flex:none;width:76px;height:76px;display:grid;place-items:center}
.gm-av-frame{
  position:absolute;inset:7px;border:1.5px solid var(--gm-gold-line);border-radius:4px;
  transform:rotate(45deg);transition:transform .6s var(--ease),border-color .35s var(--ease);
}
.gm-card:hover .gm-av-frame{transform:rotate(90deg);border-color:var(--gold)}
.gm-av b{
  position:relative;width:54px;height:54px;display:grid;place-items:center;
  font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1;
  background:var(--gm-teal-tint);color:var(--gm-teal-600);
  clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
  transition:background .35s var(--ease),color .35s var(--ease),transform .5s var(--ease);
}
.gm-card:hover .gm-av b{background:var(--teal);color:#fff;transform:scale(1.06)}
.gm-card[data-cat="working"] .gm-av b{background:var(--gm-gold-tint);color:var(--gm-gold-ink)}
.gm-card[data-cat="working"]:hover .gm-av b{background:var(--gold);color:#33240a}
/* النصوص */
.gm-body{min-width:0;flex:1}
.gm-name{
  font-family:var(--font-display);font-size:clamp(.95rem,.55rem + .95vw,1.14rem);font-weight:600;
  line-height:1.5;color:var(--ink);margin:0 0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.gm-name .gm-title{font-size:.82em;font-weight:500;color:var(--muted);margin-inline-end:3px}
.gm-chip{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-body);font-size:.92rem;font-weight:700;padding:5px 13px;border-radius:7px;
  color:var(--gm-teal-600);background:var(--gm-teal-tint);border:1px solid var(--gm-teal-bd);
  transition:background .3s,border-color .3s;
}
.gm-chip .dm{width:7px;height:7px;background:currentColor;transform:rotate(45deg);border-radius:1px;flex:none}
.gm-card[data-cat="working"] .gm-chip{color:var(--gm-gold-ink);background:var(--gm-gold-tint);border-color:var(--gm-gold-bd)}
/* حالة لا نتائج */
.gm-empty{
  grid-column:1/-1;text-align:center;padding:64px 24px;
  border:1px dashed var(--line);border-radius:var(--card-radius);background:var(--surface-2);
  animation:gmFade .4s var(--ease) both;
}
@keyframes gmFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.gm-empty svg{width:62px;height:62px;color:var(--teal);opacity:.42;margin-block-end:16px}
.gm-empty h3{font-size:1.25rem;margin-block-end:8px;color:var(--ink)}
.gm-empty p{color:var(--muted);margin-block-end:20px}
.gm-reset{
  border:1.6px solid var(--teal);background:transparent;color:var(--teal);
  font-family:var(--font-body);font-weight:700;font-size:1rem;padding:11px 24px;
  border-radius:10px;cursor:pointer;transition:background .25s,color .25s;
}
.gm-reset:hover{background:var(--teal);color:#fff}
.gm-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* استجابة */
@media (max-width:1024px){.gm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .gm-stats{grid-template-columns:1fr;gap:12px}
  .gm-bar{flex-direction:column;align-items:stretch}
  .gm-seg{width:100%;justify-content:space-between}
  .gm-fil{flex:1;justify-content:center;padding-inline:12px}
  .gm-fil[aria-pressed="true"]{padding-inline-start:12px}
  .gm-fil::before{display:none}
  .gm-search{max-width:none}
  .gm-orn{display:none}
}
@media (max-width:600px){
  .gm-grid{grid-template-columns:1fr}
  .gm-card{padding:16px}
  .gm-av{width:66px;height:66px}
  .gm-av b{width:48px;height:48px;font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){
  .gm-orn{animation:none}
  .gm-card,.gm-empty{transition:opacity .001s,border-color .2s;animation:none}
  .gm.js-on .gm-card{opacity:1;transform:none}
  .gm-card:hover{transform:none}
  .gm-card:hover .gm-av-frame{transform:rotate(45deg)}
  .gm-card:hover .gm-av b{transform:none}
  .gm-card:hover::before{transform:rotate(45deg)}
  .gm-av-frame,.gm-av b,.gm-stat::after,.gm-fil::before{transition:none}
}
</style>
<svg class="gm-orn" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
  <rect x="20" y="20" width="60" height="60"/>
  <rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"/>
  <circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="30"/>
</svg>
<div class="container">
  <h2 id="gm-title" class="gm-sr">أعضاء الجمعية العمومية</h2>

  <div class="gm-stats" role="list">
    <div class="gm-stat" role="listitem"><b data-count-to="{{N_ALL}}">0</b><span>إجمالي الأعضاء</span></div>
    <div class="gm-stat" role="listitem"><b data-count-to="{{N_FOUNDER}}">0</b><span>عضو مؤسس</span></div>
    <div class="gm-stat is-gold" role="listitem"><b data-count-to="{{N_WORKING}}">0</b><span>عضو عامل</span></div>
  </div>

  <div class="gm-bar">
    <div class="gm-seg" role="group" aria-label="تصفية الأعضاء حسب فئة العضوية">
      <button type="button" class="gm-fil" data-filter="all" aria-pressed="true">الكل <span class="gm-c">{{N_ALL}}</span></button>
      <button type="button" class="gm-fil" data-filter="founder" aria-pressed="false">مؤسسون <span class="gm-c">{{N_FOUNDER}}</span></button>
      <button type="button" class="gm-fil" data-filter="working" aria-pressed="false">عاملون <span class="gm-c">{{N_WORKING}}</span></button>
    </div>
    <div class="gm-search">
      <label class="gm-sr" for="gm-q">البحث باسم العضو</label>
      <svg class="gm-si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input type="search" id="gm-q" placeholder="ابحث باسم العضو…" autocomplete="off">
      <button type="button" class="gm-clear" aria-label="مسح البحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <p class="gm-live" id="gm-live" role="status" aria-live="polite" aria-atomic="true">يُعرض <b>{{N_ALL}}</b> من أصل <b>{{N_ALL}}</b> عضواً</p>

  <div class="gm-grid" id="gm-grid">{{CARDS}}</div>
</div>
<script>
(function(){
  var section=document.getElementById('memSec'); if(!section) return;
  var grid=document.getElementById('gm-grid');
  var live=document.getElementById('gm-live');
  var input=document.getElementById('gm-q');
  var wrap=input?input.closest('.gm-search'):null;
  var clearBtn=section.querySelector('.gm-clear');
  var fils=[].slice.call(section.querySelectorAll('.gm-fil'));
  var cards=[].slice.call(grid.querySelectorAll('.gm-card'));
  var total=cards.length;
  /* إعادة الفهرسة بعد أن تُعيد طبقة التشغيل بناء البطاقات من قاعدة البيانات */
  window.IAQ_REINDEX=window.IAQ_REINDEX||{};
  window.IAQ_REINDEX.assembly=function(){
    cards=[].slice.call(grid.querySelectorAll('.gm-card'));
    total=cards.length;
    cards.forEach(function(c){ c.dataset.key=norm(c.getAttribute('data-name')); });
    /* العدّادات الثلاثة: الإجمالي ثم المؤسسون ثم العاملون */
    var st=section.querySelectorAll(".gm-stat b[data-count-to]");
    var nF=cards.filter(function(c){return c.getAttribute("data-cat")==="founder";}).length;
    var nW=cards.filter(function(c){return c.getAttribute("data-cat")==="working";}).length;
    var vals=[total,nF,nW];
    for(var i=0;i<st.length&&i<3;i++){
      st[i].setAttribute("data-count-to",String(vals[i]));
      st[i].textContent=String(vals[i]);
    }
    /* first=true يفرض رسمًا فوريًّا بلا مؤقّت الانتقال: لو كان التبويب في
       الخلفية لَتأخّر المؤقّت وبقيت البطاقات مخفيّة حتى أول تفاعل. */
    first=true;
    render();
  };
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rtl=(getComputedStyle(document.documentElement).direction==='rtl');
  var state={cat:'all',q:''};
  var timer=null,swap=null,first=true;

  section.classList.add('js-on');

  function norm(s){
    return (s||'').replace(/[ً-ْٰـ]/g,'')
      .replace(/[آأإٱ]/g,'ا')
      .replace(/ى/g,'ي').replace(/ة/g,'ه')
      .replace(/\s+/g,' ').trim().toLowerCase();
  }
  cards.forEach(function(c){ c.dataset.key=norm(c.getAttribute('data-name')); });

  var empty=document.createElement('div');
  empty.className='gm-empty'; empty.hidden=true;
  empty.innerHTML='<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="24" y="24" width="52" height="52"/><rect x="24" y="24" width="52" height="52" transform="rotate(45 50 50)"/></svg>'+
    '<h3>لا توجد نتائج مطابقة</h3><p>لم نجد عضواً يطابق بحثك. جرّب اسماً آخر أو أعد ضبط التصفية.</p>'+
    '<button type="button" class="gm-reset">إعادة التعيين</button>';
  grid.appendChild(empty);
  empty.querySelector('.gm-reset').addEventListener('click',function(){
    state.cat='all'; state.q=''; input.value=''; wrap.classList.remove('has-value');
    fils.forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-filter')==='all'?'true':'false'); });
    render(); input.focus();
  });

  function cols(){
    var v=getComputedStyle(grid).gridTemplateColumns;
    return v&&v!=='none' ? v.split(' ').filter(Boolean).length : 1;
  }
  function match(c){
    var okCat=(state.cat==='all'||c.getAttribute('data-cat')===state.cat);
    var okQ=(!state.q||c.dataset.key.indexOf(state.q)>-1);
    return okCat&&okQ;
  }
  function paint(list){
    var n=cols(), step=parseFloat(getComputedStyle(section).getPropertyValue('--gm-step'))||60;
    cards.forEach(function(c){ c.hidden=true; c.classList.remove('is-in'); c.style.removeProperty('--gm-delay'); });
    list.forEach(function(c,i){
      c.hidden=false;
      if(!reduce) c.style.setProperty('--gm-delay',(((i%n)+Math.floor(i/n))*step)+'ms');
    });
    empty.hidden=list.length>0;
    void grid.offsetWidth;
    list.forEach(function(c){ c.classList.add('is-in'); });
    live.innerHTML='يُعرض <b>'+list.length+'</b> من أصل <b>'+total+'</b> عضواً';
  }
  function render(){
    var list=cards.filter(match);
    if(reduce||first){ first=false; paint(list); return; }
    grid.classList.add('is-busy');
    cards.forEach(function(c){ if(!c.hidden) c.classList.remove('is-in'); });
    clearTimeout(swap);
    swap=setTimeout(function(){ paint(list); grid.classList.remove('is-busy'); },180);
  }

  fils.forEach(function(btn,i){
    btn.addEventListener('click',function(){
      if(btn.getAttribute('aria-pressed')==='true') return;
      fils.forEach(function(b){ b.setAttribute('aria-pressed',b===btn?'true':'false'); });
      state.cat=btn.getAttribute('data-filter'); render();
    });
    btn.addEventListener('keydown',function(e){
      var d=0;
      if(e.key==='ArrowLeft') d=rtl?1:-1;
      else if(e.key==='ArrowRight') d=rtl?-1:1;
      else if(e.key==='Home') d=-99; else if(e.key==='End') d=99; else return;
      e.preventDefault();
      var j=(d===-99)?0:(d===99)?fils.length-1:(i+d+fils.length)%fils.length;
      fils[j].focus(); fils[j].click();
    });
  });

  input.addEventListener('input',function(){
    wrap.classList.toggle('has-value',input.value.length>0);
    clearTimeout(timer);
    timer=setTimeout(function(){ state.q=norm(input.value); render(); },140);
  });
  input.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&input.value){ e.preventDefault(); clearBtn.click(); }
  });
  clearBtn.addEventListener('click',function(){
    input.value=''; wrap.classList.remove('has-value'); state.q=''; render(); input.focus();
  });

  function counters(){
    section.querySelectorAll('[data-count-to]').forEach(function(el){
      var to=parseInt(el.getAttribute('data-count-to'),10)||0;
      if(reduce){ el.textContent=to; return; }
      var t0=null,dur=1100;
      requestAnimationFrame(function tick(ts){
        if(t0===null) t0=ts;
        var p=Math.min((ts-t0)/dur,1), e=1-Math.pow(1-p,3);
        el.textContent=Math.round(to*e);
        if(p<1) requestAnimationFrame(tick);
      });
    });
  }

  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(en){
      en.forEach(function(x){ if(x.isIntersecting){ render(); counters(); io.disconnect(); } });
    },{threshold:.12,rootMargin:'0px 0px -8% 0px'});
    io.observe(section);
  } else { render(); counters(); }
})();
</script>
</section>
