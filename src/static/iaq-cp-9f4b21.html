<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>لوحة التحكّم | حاضنة الجمعيات</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8f8;--surface:#fff;--ink:#0f2a2a;--body:#47534f;--muted:#66726f;--line:#e5eae9;
  --teal:#007878;--t6:#0c6c6c;--gold:#c09048;--gl:rgba(192,144,72,.42);--tt:#eef4f3;--tb:#d6e5e3;
  --ease:cubic-bezier(.22,.61,.36,1);
  --fd:'El Messiri',Georgia,serif;--fb:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--fb);background:var(--bg);color:var(--body);min-height:100vh;
  display:grid;place-items:center;padding:24px;position:relative;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(45deg,transparent 0 46px,rgba(0,120,120,.05) 46px 47px),
    repeating-linear-gradient(-45deg,transparent 0 46px,rgba(0,120,120,.05) 46px 47px);
  -webkit-mask-image:radial-gradient(120% 80% at 100% 0%,#000 0%,transparent 72%);
  mask-image:radial-gradient(120% 80% at 100% 0%,#000 0%,transparent 72%);
}
.wrap{position:relative;z-index:1;width:100%;max-width:430px}
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:34px 32px;box-shadow:0 24px 60px -30px rgba(6,63,54,.4);
}
.card::after{content:"";position:absolute;inset:6px;border:1px solid var(--gl);border-radius:9px;pointer-events:none;opacity:.5}
.card::before{content:"";position:absolute;inset-block-start:-4px;inset-inline-start:-4px;width:14px;height:14px;background:var(--gold);opacity:.5;transform:rotate(45deg);border-radius:2px}
.brand{text-align:center;margin-block-end:26px}
.brand .mark{
  width:64px;height:64px;margin:0 auto 14px;display:grid;place-items:center;
  color:var(--teal);background:var(--tt);border:1px solid var(--tb);
  clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
}
.brand .mark svg{width:30px;height:30px}
.brand h1{font-family:var(--fd);font-size:1.42rem;font-weight:600;color:var(--ink)}
.brand p{color:var(--muted);font-size:.93rem;margin-block-start:5px}
.field{margin-block-end:16px}
.field label{display:block;font-size:.92rem;font-weight:700;color:var(--ink);margin-block-end:7px}
.field input{
  width:100%;font-family:var(--fb);font-size:1rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,120,120,.13)}
.field input[dir=ltr]{text-align:left}
.btn{
  width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--fb);font-size:1rem;font-weight:700;padding:13px 20px;border:1px solid var(--teal);
  border-radius:10px;background:var(--teal);color:#fff;cursor:pointer;
  transition:background .25s,transform .25s var(--ease),opacity .2s;
}
.btn:hover:not(:disabled){background:#00615f;transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:progress;transform:none}
.btn svg{width:17px;height:17px}
.msg{
  display:none;align-items:flex-start;gap:9px;margin-block-end:16px;padding:12px 14px;
  border-radius:10px;font-size:.92rem;line-height:1.7;
}
.msg.show{display:flex}
.msg.err{background:#fdf1ec;border:1px solid #f0cdbc;color:#8c3d1c}
.msg.ok{background:var(--tt);border:1px solid var(--tb);color:var(--t6)}
.msg svg{width:16px;height:16px;flex:none;margin-block-start:3px}
.foot{margin-block-start:22px;padding-block-start:18px;border-block-start:1px solid var(--line);text-align:center}
.foot a{color:var(--teal);font-size:.9rem;font-weight:700;text-decoration:none}
.foot a:hover{text-decoration:underline}
.note{margin-block-start:14px;color:var(--muted);font-size:.82rem;line-height:1.7;text-align:center}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-block-start-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn,.field input{transition:none}.btn:hover{transform:none}.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/><path d="M12 14.6v2.4"/>
        </svg>
      </div>
      <h1>لوحة تحكّم الموقع</h1>
      <p>جمعية حاضنة الجمعيات</p>
    </div>

    <div class="msg" id="msg" role="alert" aria-live="assertive"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" dir="ltr" autocomplete="username"
               placeholder="name@iaq.org.sa" required />
      </div>
      <div class="field">
        <label for="pass">كلمة المرور</label>
        <input type="password" id="pass" name="pass" autocomplete="current-password"
               placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn" id="btn">
        <span id="btnTxt">تسجيل الدخول</span>
        <svg id="btnIc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
    </form>

    <div class="foot"><a href="index.html">&#8592; العودة إلى الموقع</a></div>
    <p class="note">الدخول مقصور على المخوّلين، والبيانات محميّة بسياسات الوصول في قاعدة البيانات.</p>
  </div>
</div>

<script>
(function(){
  var CFG = {{SUPABASE_CFG}};
  var PANEL = "{{PANEL_URL}}";
  var form=document.getElementById('loginForm'),
      btn=document.getElementById('btn'), btnTxt=document.getElementById('btnTxt'),
      btnIc=document.getElementById('btnIc'), msg=document.getElementById('msg'),
      emailEl=document.getElementById('email'), passEl=document.getElementById('pass');

  var ICO_ERR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16v.01"/></svg>';
  var ICO_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function show(kind, text){
    msg.className='msg show '+kind;
    msg.innerHTML=(kind==='err'?ICO_ERR:ICO_OK)+'<span>'+text+'</span>';
  }
  function hide(){ msg.className='msg'; msg.innerHTML=''; }
  function busy(on){
    btn.disabled=on;
    btnTxt.textContent = on ? 'جارٍ التحقّق...' : 'تسجيل الدخول';
    btnIc.style.display = on ? 'none' : '';
    var s=document.getElementById('sp');
    if(on && !s){ var d=document.createElement('span'); d.id='sp'; d.className='spin'; btn.appendChild(d); }
    if(!on && s) s.remove();
  }

  /* جلسة سارية؟ انتقل للوحة مباشرة */
  try{
    var saved=JSON.parse(sessionStorage.getItem('iaq_session')||'null');
    if(saved && saved.access_token && saved.expires_at*1000 > Date.now()+5000){
      location.replace(PANEL); return;
    }
  }catch(e){}

  form.addEventListener('submit', function(e){
    e.preventDefault(); hide();
    var email=(emailEl.value||'').trim(), pass=passEl.value||'';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ show('err','يرجى إدخال بريد إلكتروني صحيح.'); emailEl.focus(); return; }
    if(pass.length<6){ show('err','كلمة المرور قصيرة جدًا.'); passEl.focus(); return; }
    if(!CFG || !CFG.url || !CFG.key){ show('err','إعداد الاتصال غير مكتمل. راجع مسؤول النظام.'); return; }

    busy(true);
    fetch(CFG.url+'/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'apikey':CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:pass})
    })
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,data:j}; }); })
    .then(function(res){
      if(!res.ok || !res.data.access_token){
        var m=(res.data && (res.data.error_description||res.data.msg||res.data.message))||'';
        if(/not confirmed/i.test(m)) show('err','لم يُفعّل هذا البريد بعد. راجع مسؤول النظام.');
        else if(res.status===429) show('err','محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.');
        else if(res.status===400 || /invalid/i.test(m)) show('err','البريد الإلكتروني أو كلمة المرور غير صحيحة.');
        else show('err','تعذّر تسجيل الدخول. '+(m||'حاول مرة أخرى.'));
        busy(false); return;
      }
      var d=res.data;
      sessionStorage.setItem('iaq_session', JSON.stringify({
        access_token:d.access_token, refresh_token:d.refresh_token,
        expires_at:d.expires_at || (Math.floor(Date.now()/1000)+(d.expires_in||3600)),
        email:(d.user&&d.user.email)||email
      }));
      show('ok','تم التحقّق بنجاح، جارٍ فتح اللوحة...');
      setTimeout(function(){ location.replace(PANEL); }, 600);
    })
    .catch(function(){
      show('err','تعذّر الاتصال بالخدمة. تحقّق من الإنترنت وأعد المحاولة.');
      busy(false);
    });
  });
})();
</script>
</body>
</html>
