<script>
/* بوّابة الجلسة — قبل أي رسم. بلا جلسة سارية نعود لصفحة الدخول فورًا. */
(function(){
  var LOGIN="{{LOGIN_URL}}";
  var s=null; try{ s=JSON.parse(sessionStorage.getItem('iaq_session')||'null'); }catch(e){}
  if(!s || !s.access_token || !(s.expires_at*1000 > Date.now()+5000)){
    try{ sessionStorage.removeItem('iaq_session'); }catch(e){}
    location.replace(LOGIN); return;
  }
  window.IAQ_SESSION=s;
  window.IAQ_SUPABASE={{SUPABASE_CFG}};
  window.IAQ_LOGIN=LOGIN;
  window.IAQ_LOGOUT=function(){
    try{
      fetch(IAQ_SUPABASE.url+'/auth/v1/logout',{method:'POST',
        headers:{apikey:IAQ_SUPABASE.key,Authorization:'Bearer '+s.access_token}});
    }catch(e){}
    try{ sessionStorage.removeItem('iaq_session'); }catch(e){}
    location.replace(LOGIN);
  };
})();
</script>
